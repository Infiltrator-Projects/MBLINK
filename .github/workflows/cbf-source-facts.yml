name: Mercedes CBF Source Facts

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/mblink-cbf-data-extract.c'
      - '.github/workflows/cbf-source-facts.yml'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build strict CBF fact extractor
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Wpedantic -Wshadow -Wformat=2 \
             -Wstrict-prototypes -Wmissing-prototypes -Werror \
             tools/mblink-cbf-data-extract.c -o /tmp/mblink-cbf-data-extract

      - name: Fetch immutable public Mercedes CBF evidence
        shell: bash
        run: |
          set -euo pipefail
          upstream=7b745016e1d46f1c6a0b55c1b30eeb0cc1426f42
          base="https://raw.githubusercontent.com/Matrix-aas/mercedes-mcp/${upstream}/cbf"

          curl --fail --location --silent --show-error "${base}/eis_204.cbf" -o /tmp/eis_204.cbf
          curl --fail --location --silent --show-error "${base}/ABR2XT.cbf" -o /tmp/ABR2XT.cbf
          curl --fail --location --silent --show-error "${base}/CGW_212.cbf" -o /tmp/CGW_212.cbf
          curl --fail --location --silent --show-error "${base}/IC_204.cbf" -o /tmp/IC_204.cbf
          curl --fail --location --silent --show-error "${base}/MPC212.cbf" -o /tmp/MPC212.cbf
          curl --fail --location --silent --show-error "${base}/fscm212.cbf" -o /tmp/fscm212.cbf

          test "$(git hash-object /tmp/eis_204.cbf)" = "221798fb947c3ab6db5c9f07f03cc45dc5c716f4"
          test "$(git hash-object /tmp/ABR2XT.cbf)" = "b0e1dbf1a947055c76ced61534ebf944c0139c2f"
          test "$(git hash-object /tmp/CGW_212.cbf)" = "9230aa3c12b97a17e9f4df55fadab1d92a7f05b6"
          test "$(git hash-object /tmp/IC_204.cbf)" = "5189272819d0385ef66aea19ff6cda160b5cf23f"
          test "$(git hash-object /tmp/MPC212.cbf)" = "2753be46c2c140fb43b63594f7f0452c1595cd69"
          test "$(git hash-object /tmp/fscm212.cbf)" = "7af0b3bc4ed5fd786e09173e983d63d0705a95cb"

      - name: Extract direct read-only UDS facts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cbf-facts

          for stem in eis_204 ABR2XT CGW_212 IC_204 MPC212 fscm212; do
            out_stem="$(printf '%s' "$stem" | tr '[:upper:]' '[:lower:]')"
            /tmp/mblink-cbf-data-extract "/tmp/${stem}.cbf" \
              > "cbf-facts/${out_stem}-direct-uds22.tsv" \
              2> "cbf-facts/${out_stem}-summary.txt"
            test "$(wc -l < "cbf-facts/${out_stem}-direct-uds22.tsv")" -gt 1
          done

          # Known parser control from the independent CaesarSuite interpretation.
          grep -F $'EIS_204\t0228\tDT_Versorgungsspannung_Ubat\t' \
            cbf-facts/eis_204-direct-uds22.tsv >/dev/null

          echo "=== Direct UDS 0x22 source facts ==="
          for stem in eis_204 abr2xt cgw_212 ic_204 mpc212 fscm212; do
            printf '%s: ' "$stem"
            cat "cbf-facts/${stem}-summary.txt"
            printf 'unique_dids=%s\n' \
              "$(tail -n +2 "cbf-facts/${stem}-direct-uds22.tsv" | cut -f2 | sort -u | wc -l)"
          done

          echo "=== Captured C207 ABR DID matches ==="
          awk -F '\t' 'NR == 1 || $2 ~ /^(2001|2003|2004|2007|2009|200A|200D|200F|2010|2014|20C0)$/' \
            cbf-facts/abr2xt-direct-uds22.tsv

      - name: Verify advertised CBF-backed DIDs against immutable source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          source = pathlib.Path("src/mercedes/data_scan.c").read_text(encoding="utf-8")
          facts_dir = pathlib.Path("cbf-facts")
          advertised = []
          for chunk in source.split("},"):
              did_match = re.search(r"UINT16_C\(0x([0-9A-Fa-f]{1,4})\)", chunk)
              cbf_match = re.search(
                  r"Mercedes Vediamo ([A-Za-z0-9_]+)\.cbf", chunk)
              if did_match and cbf_match:
                  advertised.append(
                      (cbf_match.group(1), int(did_match.group(1), 16)))

          if not advertised:
              raise SystemExit("no CBF-backed advertised DIDs found in data_scan.c")

          cache = {}
          failures = []
          for cbf_name, did in advertised:
              stem = cbf_name.lower()
              path = facts_dir / f"{stem}-direct-uds22.tsv"
              if not path.is_file():
                  failures.append(
                      f"{cbf_name}.cbf DID 0x{did:04X}: no immutable fact file")
                  continue
              if stem not in cache:
                  rows = path.read_text(encoding="utf-8").splitlines()[1:]
                  cache[stem] = {
                      int(row.split("\t", 2)[1], 16)
                      for row in rows
                      if row.count("\t") >= 2
                  }
              if did not in cache[stem]:
                  failures.append(
                      f"{cbf_name}.cbf does not contain advertised DID 0x{did:04X}")

          if failures:
              print("\n".join(failures), file=sys.stderr)
              raise SystemExit(1)

          print(
              f"verified_cbf_backed_advertised_dids={len(advertised)} "
              f"across_sources={len(cache)}")
          PY

      - name: Upload extracted source facts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mercedes-cbf-source-facts
          path: cbf-facts/
          if-no-files-found: error
          retention-days: 30

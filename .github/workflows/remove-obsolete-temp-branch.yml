name: Remove obsolete temp branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-temp-ignore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temp-ignore only when it has no unique commits
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git ls-remote --exit-code --heads origin refs/heads/temp-ignore >/dev/null 2>&1; then
            echo "temp-ignore is already absent."
            exit 0
          fi
          git fetch origin temp-ignore:refs/remotes/origin/temp-ignore
          ahead="$(git rev-list --count origin/main..origin/temp-ignore)"
          test "$ahead" = "0"
          git push origin --delete temp-ignore

name: One-shot prepare MBLINK 0.7.148

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-prepare-0.7.148.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Prepare public version surfaces
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          header = Path('include/mblink/version.h')
          text = header.read_text()
          old = '#define MBLINK_VERSION_STRING "0.7.147"'
          new = '#define MBLINK_VERSION_STRING "0.7.148"'
          if text.count(old) != 1:
              raise SystemExit('unexpected public version header')
          header.write_text(text.replace(old, new, 1))

          pbx = Path('app/ios/MBLINK.xcodeproj/project.pbxproj')
          text = pbx.read_text()
          old = 'MARKETING_VERSION = 0.7.147;'
          count = text.count(old)
          if count == 0:
              raise SystemExit('iPhone marketing version anchor missing')
          pbx.write_text(text.replace(old, 'MARKETING_VERSION = 0.7.148;'))
          PY

          rm .github/workflows/one-shot-prepare-0.7.148.yml
          git diff --check
      - name: Commit prepared version surfaces
        shell: bash
        run: |
          git config user.name "MBLINK release automation"
          git config user.email "actions@users.noreply.github.com"
          git add include/mblink/version.h app/ios/MBLINK.xcodeproj/project.pbxproj .github/workflows/one-shot-prepare-0.7.148.yml
          git commit -m "Prepare 0.7.148 version surfaces"
          git push origin HEAD:main

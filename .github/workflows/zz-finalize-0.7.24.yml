# SPDX-License-Identifier: GPL-3.0-or-later
name: Finalize MBLINK 0.7.24

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Atomically repin and version the finished release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C src/link fetch origin 9b707e121ad5dcf45403b06c8ca8dda5ef2b9e35
          git -C src/link checkout --detach 9b707e121ad5dcf45403b06c8ca8dda5ef2b9e35
          python3 - <<'PY'
          from pathlib import Path
          import re
          Path('VERSION').write_text('0.7.24\n')
          p=Path('CMakeLists.txt'); s=p.read_text(); s=s.replace('set(MBLINK_LINK_VERSION "0.7.4")','set(MBLINK_LINK_VERSION "0.7.5")').replace('set(MBLINK_LINK_COMMIT "7af290d71b38859202ccc90c060ee29b56d2296c")','set(MBLINK_LINK_COMMIT "9b707e121ad5dcf45403b06c8ca8dda5ef2b9e35")'); p.write_text(s)
          p=Path('.github/workflows/ci.yml'); s=p.read_text(); s=re.sub(r'LINK_VERSION: [0-9.]+','LINK_VERSION: 0.7.5',s); s=re.sub(r'LINK_COMMIT: [0-9a-f]{40}','LINK_COMMIT: 9b707e121ad5dcf45403b06c8ca8dda5ef2b9e35',s); s=s.replace('LINK 0.7.4','LINK 0.7.5'); p.write_text(s)
          p=Path('README.md'); s=p.read_text(); s=re.sub(r'\*\*Current release: [0-9.]+\.\*\*','**Current release: 0.7.24.**',s); s=re.sub(r'MBLINK pins LINK [0-9.]+','MBLINK pins LINK 0.7.5',s); p.write_text(s)
          p=Path('app/ios/MBLINK.xcodeproj/project.pbxproj'); s=p.read_text(); s=re.sub(r'MARKETING_VERSION = [0-9.]+;', 'MARKETING_VERSION = 0.7.24;', s); p.write_text(s)
          PY
          rm -f .github/workflows/windows-discover.yml
          rm -f .github/workflows/zz-finalize-0.7.24.yml
          git add -A
          git diff --cached --check
          test "$(tr -d '[:space:]' < VERSION)" = '0.7.24'
          test "$(tr -d '[:space:]' < src/link/VERSION)" = '0.7.5'
          test "$(git -C src/link rev-parse HEAD)" = '9b707e121ad5dcf45403b06c8ca8dda5ef2b9e35'
          test "$(grep -c 'MARKETING_VERSION = 0.7.24;' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 4
          git commit -m 'Release MBLINK 0.7.24 on LINK 0.7.5'
          git push origin HEAD:main

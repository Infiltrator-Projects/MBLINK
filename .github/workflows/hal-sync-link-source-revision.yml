name: HAL sync LINK source revision

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hal-sync-link-source-revision.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Synchronise Apple embedded LINK source revision
        shell: bash
        run: |
          set -euo pipefail
          link_gitlink="$(git ls-tree HEAD src/link | awk '{print $3}')"
          test -n "$link_gitlink"
          export LINK_GITLINK="$link_gitlink"
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          p = Path('app/ios/MBLINK.xcodeproj/project.pbxproj')
          target = os.environ['LINK_GITLINK']
          lines = p.read_text().splitlines(keepends=True)
          count = 0
          for index, line in enumerate(lines):
              if 'LINK_SOURCE_REVISION=' not in line:
                  continue
              updated, replacements = re.subn(r'[0-9a-f]{40}', target, line, count=1)
              if replacements != 1:
                  raise SystemExit(f'Unable to identify LINK SHA on Xcode project line {index + 1}')
              lines[index] = updated
              count += 1
          if count == 0:
              raise SystemExit('No LINK_SOURCE_REVISION definitions found in Xcode project')
          output = ''.join(lines)
          revision_lines = [line for line in output.splitlines() if 'LINK_SOURCE_REVISION=' in line]
          if len(revision_lines) != count or any(target not in line for line in revision_lines):
              raise SystemExit('LINK source revision verification failed after replacement')
          p.write_text(output)
          print(f'Synchronised {count} LINK_SOURCE_REVISION definitions to {target}')
          PY
          git diff --check

      - name: Publish source revision sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add app/ios/MBLINK.xcodeproj/project.pbxproj
          git rm .github/workflows/hal-sync-link-source-revision.yml
          git diff --cached --check
          git commit -m "Sync Apple LINK source revision metadata"
          git push origin HEAD:main

name: Temporary materialise iPhone language fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-wire-ios-language.yml

permissions:
  contents: read

jobs:
  materialise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply iPhone language wiring
        run: python3 scripts/tmp-wire-ios-language.py
      - name: Stage generated files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/app/ios/MBLINK generated/app/ios/MBLINK.xcodeproj
          cp app/ios/MBLINK/MBLINKApp.swift generated/app/ios/MBLINK/MBLINKApp.swift
          cp app/ios/MBLINK.xcodeproj/project.pbxproj generated/app/ios/MBLINK.xcodeproj/project.pbxproj
      - uses: actions/upload-artifact@v4
        with:
          name: mblink-ios-language-generated
          path: generated
          if-no-files-found: error
          retention-days: 1

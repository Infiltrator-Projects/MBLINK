name: Temporary transport iPhone language fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-wire-ios-language.yml

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply iPhone language wiring
        run: python3 scripts/tmp-wire-ios-language.py
      - name: Create disposable transport commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-wire-ios-language.yml scripts/tmp-wire-ios-language.py
          git add app/ios/MBLINK/MBLINKApp.swift app/ios/MBLINK.xcodeproj/project.pbxproj
          git commit -m "Wire live English German Polish iPhone UI"
          git push --force origin HEAD:refs/heads/tmp-mblink-language-wire

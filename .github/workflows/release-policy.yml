# SPDX-License-Identifier: GPL-3.0-or-later
name: MBLINK Release Policy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/preflight.py'
      - 'tests/test_pid_architecture.py'
      - 'VERSION'
      - 'include/mblink/version.h'
      - 'app/ios/MBLINK.xcodeproj/project.pbxproj'

permissions:
  contents: read

jobs:
  release-policy:
    name: Release policy / stable invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          submodules: recursive
      - name: Reject obsolete parallel release workflow
        shell: bash
        run: test ! -e .github/workflows/auto-release.yml
      - name: Run canonical preflight
        run: python3 scripts/preflight.py
      - name: Verify stable PID architecture contract
        run: python3 tests/test_pid_architecture.py

# SPDX-License-Identifier: GPL-3.0-or-later
name: MBLINK Release Policy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/preflight.py'
      - 'tests/test_pid_architecture.py'
      - 'VERSION'
      - 'include/mblink/version.h'
      - 'app/ios/MBLINK.xcodeproj/project.pbxproj'

permissions:
  contents: read

jobs:
  release-policy:
    name: Release policy / stable invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Require explicit release workflow only
        shell: bash
        run: |
          set -euo pipefail
          test -e .github/workflows/release.yml
          test ! -e .github/workflows/auto-release.yml
          test ! -e .github/workflows/mblink-refactor-release-once.yml
          ! grep -Fq 'head_commit.message' .github/workflows/ci.yml
          ! grep -Fq 'is_release' .github/workflows/ci.yml
          ! grep -Fq 'contents: write' .github/workflows/ci.yml

      - name: Run canonical preflight
        run: python3 scripts/preflight.py

      - name: Verify stable PID architecture contract
        run: python3 tests/test_pid_architecture.py

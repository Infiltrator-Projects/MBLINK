# SPDX-License-Identifier: GPL-3.0-or-later
name: Advance MBLINK 0.7.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/advance-0.7.1.yml

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Pin Infiltratr Common 1.7.0
        shell: bash
        run: |
          set -euo pipefail
          expected=a5b52f7ad62fcbb3462c496b7831e7f974161bcf
          git -C src/infiltratr-common fetch --depth=1 origin v1.7.0
          git -C src/infiltratr-common checkout --detach "$expected"
          test "$(git -C src/infiltratr-common rev-parse HEAD)" = "$expected"
          test "$(tr -d '[:space:]' < src/infiltratr-common/VERSION)" = "1.7.0"

      - name: Apply 0.7.1 source and project hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          root = Path('.')

          # CMake: consume the released Common 1.7.0 pin and build the generic
          # diagnostic-parameter foundation on every portable platform.
          cmake_path = root / 'CMakeLists.txt'
          cmake = cmake_path.read_text(encoding='utf-8')
          cmake = replace_once(cmake,
              'set(MBLINK_COMMON_VERSION "1.5.0")',
              'set(MBLINK_COMMON_VERSION "1.7.0")',
              'Common version pin')
          cmake = replace_once(cmake,
              'set(MBLINK_COMMON_COMMIT "a0e75ffbe4e038c74c8f1e3d589f2dae87b2b7bb")',
              'set(MBLINK_COMMON_COMMIT "a5b52f7ad62fcbb3462c496b7831e7f974161bcf")',
              'Common commit pin')
          cmake = replace_once(cmake,
              '    src/core/mblink.c\n    src/core/scheduler.c',
              '    src/core/mblink.c\n    src/core/parameter.c\n    src/core/scheduler.c',
              'parameter source')
          cmake = replace_once(cmake,
              '    mblink_add_test(mblink-test-runtime tests/test_runtime.c)\n',
              '    mblink_add_test(mblink-test-runtime tests/test_runtime.c)\n    mblink_add_test(mblink-test-parameter tests/test_parameter.c)\n',
              'parameter test')
          cmake_path.write_text(cmake, encoding='utf-8')

          (root / 'include/mblink/parameter.h').write_text(r'''// SPDX-License-Identifier: GPL-3.0-or-later
/**
 * @file parameter.h
 * @brief Protocol-neutral live diagnostic parameter contracts.
 *
 * This layer gives OBD-II and manufacturer UDS data one stable C-facing model
 * for live-data, table, dashboard and graph presentation. Protocol decoding
 * remains in its owning layer; this module owns only parameter identity,
 * metadata and presentation-safe scalar formatting.
 */
#ifndef MBLINK_PARAMETER_H
#define MBLINK_PARAMETER_H

#include "mblink/obd2.h"

#include <stdbool.h>
#include <stddef.h>
#include <stdint.h>

#ifdef __cplusplus
extern "C" {
#endif

#define MBLINK_PARAMETER_MODULE_STANDARD_OBD2 0U

typedef enum {
    MBLINK_PARAMETER_PROTOCOL_OBD2 = 0,
    MBLINK_PARAMETER_PROTOCOL_UDS
} MblinkParameterProtocol;

/** Stable machine identity for one diagnostic parameter. */
typedef struct {
    MblinkParameterProtocol protocol;
    uint32_t module;
    uint32_t identifier;
} MblinkParameterKey;

/**
 * Portable metadata for one scalar diagnostic parameter.
 *
 * `suffix` is presentation text appended directly to the scalar (for example
 * "%", " rpm" or " kPa"). `stable_key` is intended for persistence and must
 * not depend on translated display text.
 */
typedef struct {
    MblinkParameterKey key;
    const char *stable_key;
    const char *name;
    const char *suffix;
    unsigned int decimal_places;
    bool clamp;
    double minimum;
    double maximum;
} MblinkParameterDefinition;

typedef struct {
    const MblinkParameterDefinition *definition;
    uint64_t timestamp_ms;
    bool available;
    double value;
} MblinkParameterSample;

const char *mblink_parameter_protocol_name(MblinkParameterProtocol protocol);
bool mblink_parameter_key_equal(const MblinkParameterKey *left,
                                const MblinkParameterKey *right);
bool mblink_parameter_definition_is_valid(
    const MblinkParameterDefinition *definition);
bool mblink_parameter_sample_is_valid(const MblinkParameterSample *sample);

/** Format a scalar through Infiltratr Common's canonical scalar formatter. */
bool mblink_parameter_format_value(
    const MblinkParameterDefinition *definition,
    bool available,
    double value,
    char *buffer,
    size_t buffer_size);

bool mblink_parameter_format_sample(
    const MblinkParameterSample *sample,
    char *buffer,
    size_t buffer_size);

/** Standard OBD-II descriptors currently used by the live workspace. */
size_t mblink_parameter_obd2_definition_count(void);
const MblinkParameterDefinition *mblink_parameter_obd2_definition_at(
    size_t index);
const MblinkParameterDefinition *mblink_parameter_obd2_definition(
    uint8_t pid);

/** Convert one decoded OBD-II scalar into the shared parameter model. */
bool mblink_parameter_from_obd2(
    const MblinkObd2Sample *sample,
    uint64_t timestamp_ms,
    MblinkParameterSample *parameter);

#ifdef __cplusplus
}
#endif

#endif
''', encoding='utf-8')


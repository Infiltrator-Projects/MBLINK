          roadmap = replace_once(roadmap,
              '| 0.7 | Portable UDS response/session/timing engine, TesterPresent and caller-supplied DID definitions |\n',
              '| 0.7 | Portable UDS response/session/timing engine, TesterPresent and caller-supplied DID definitions |\n| 0.7.1 | Common 1.7.0 adoption, protocol-neutral diagnostic parameter foundation, iPhone Mercedes-source wiring and permanent IPA release assets |\n',
              'roadmap 0.7.1 row')
          marker = '**Exit condition met:** deterministic UDS exchanges execute through the reusable C engine without manufacturer interpretation or ISO-TP duplication in platform transport code.\n\n'
          section = '''**Exit condition met:** deterministic UDS exchanges execute through the reusable C engine without manufacturer interpretation or ISO-TP duplication in platform transport code.\n\n## 0.7.1 — pre-Mercedes parameter and release hardening (complete)\n\n- pin the released Infiltratr Common 1.7.0 dependency;\n- add one protocol-neutral C scalar parameter identity/metadata/formatting model for OBD-II and future UDS live values;\n- compile the Mercedes layer in the iPhone core and guard that wiring in CI;\n- attach the unsigned iPhone IPA directly to each new GitHub Release.\n\nThis maintenance release does not claim verified Mercedes manufacturer DIDs. Those remain a 0.8 hardware-validation responsibility.\n\n'''
          roadmap = replace_once(roadmap, marker, section, 'roadmap 0.7.1 section')
          roadmap_path.write_text(roadmap, encoding='utf-8')
          PY

      - name: Verify generated repository state
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.7.1"
          test "$(git -C src/infiltratr-common rev-parse HEAD)" = "a5b52f7ad62fcbb3462c496b7831e7f974161bcf"
          test "$(grep -c 'mercedes.c in Sources' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 2
          test "$(grep -c 'parameter.c in Sources' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 2
          test "$(grep -c 'MARKETING_VERSION = 0.7.1;' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 4
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Commit 0.7.1 candidate to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add CMakeLists.txt VERSION README.md docs/ARCHITECTURE.md docs/ROADMAP.md docs/PARAMETERS.md \
                  include/mblink/parameter.h src/core/parameter.c tests/test_parameter.c \
                  app/ios/MBLINK.xcodeproj/project.pbxproj src/infiltratr-common
          git diff --cached --check
          git commit -m "MBLINK 0.7.1: harden pre-Mercedes diagnostics foundation"
          git push origin HEAD:main

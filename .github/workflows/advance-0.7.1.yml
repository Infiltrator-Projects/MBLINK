# SPDX-License-Identifier: GPL-3.0-or-later
name: Finalize MBLINK 0.7.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/advance-0.7.1.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify Common and iPhone ownership wiring
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.7.0"
          test "$(git -C src/infiltratr-common rev-parse HEAD)" = "a5b52f7ad62fcbb3462c496b7831e7f974161bcf"
          test "$(tr -d '[:space:]' < src/infiltratr-common/VERSION)" = "1.7.0"
          grep -q 'set(MBLINK_COMMON_VERSION "1.7.0")' CMakeLists.txt
          grep -q 'set(MBLINK_COMMON_COMMIT "a5b52f7ad62fcbb3462c496b7831e7f974161bcf")' CMakeLists.txt
          test "$(grep -c 'mercedes.c in Sources' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 2
          test "$(grep -c 'parameter.c in Sources' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 2
          grep -q 'path = "../../src/mercedes/mercedes.c"' app/ios/MBLINK.xcodeproj/project.pbxproj
          grep -q 'path = "../../src/core/parameter.c"' app/ios/MBLINK.xcodeproj/project.pbxproj
          test -f include/mblink/parameter.h
          test -f src/core/parameter.c
          test -f tests/test_parameter.c

      - name: Build and test portable core
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Prepare exact 0.7.1 release identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          pbx_path = Path('app/ios/MBLINK.xcodeproj/project.pbxproj')
          pbx = pbx_path.read_text(encoding='utf-8')
          if pbx.count('MARKETING_VERSION = 0.7.0;') != 4:
              raise SystemExit('expected exactly four 0.7.0 Xcode version entries')
          pbx = pbx.replace('MARKETING_VERSION = 0.7.0;',
                            'MARKETING_VERSION = 0.7.1;')
          pbx_path.write_text(pbx, encoding='utf-8')

          Path('VERSION').write_text('0.7.1\n', encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old = ('**Pre-alpha. Latest completed feature milestone: 0.7 — portable UDS foundation. '
                 'Current maintenance work prepares 0.7.1; next feature milestone: 0.8 — '
                 'Mercedes-Benz C207 / OM651 engine diagnostics.**')
          new = ('**Pre-alpha. Latest completed maintenance milestone: 0.7.1 — pre-Mercedes '
                 'parameter and release hardening. Next feature milestone: 0.8 — Mercedes-Benz '
                 'C207 / OM651 engine diagnostics.**')
          if readme.count(old) != 1:
              raise SystemExit('README 0.7.1 status marker mismatch')
          readme_path.write_text(readme.replace(old, new, 1), encoding='utf-8')

          roadmap_path = Path('docs/ROADMAP.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          old = ('**Completed through 0.7. Current maintenance target: 0.7.1. '
                 'Next feature milestone: 0.8 — Mercedes-Benz C207 / OM651 engine diagnostics.**')
          new = ('**Completed through 0.7.1. Next feature milestone: 0.8 — '
                 'Mercedes-Benz C207 / OM651 engine diagnostics.**')
          if roadmap.count(old) != 1:
              raise SystemExit('ROADMAP top status marker mismatch')
          roadmap = roadmap.replace(old, new, 1)
          old_heading = '## 0.7.1 — pre-Mercedes parameter and release hardening'
          new_heading = '## 0.7.1 — pre-Mercedes parameter and release hardening (complete)'
          if roadmap.count(old_heading) != 1:
              raise SystemExit('ROADMAP 0.7.1 heading mismatch')
          roadmap_path.write_text(
              roadmap.replace(old_heading, new_heading, 1), encoding='utf-8')
          PY

          rm .github/workflows/advance-0.7.1.yml

          test "$(cat VERSION)" = "0.7.1"
          test "$(grep -c 'MARKETING_VERSION = 0.7.1;' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 4
          test ! -e .github/workflows/advance-0.7.1.yml

      - name: Commit exact 0.7.1 release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add -A
          git diff --cached --check
          git commit -m "MBLINK 0.7.1: pre-Mercedes diagnostics hardening"
          git push origin HEAD:main

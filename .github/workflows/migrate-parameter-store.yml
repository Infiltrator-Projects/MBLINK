      - name: Run complete portable C suite
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Build iOS Debug and Release simulators
        shell: bash
        run: |
          set -euo pipefail
          for configuration in Debug Release; do
            log="$RUNNER_TEMP/mblink-${configuration}.log"
            if ! xcodebuild \
              -project app/ios/MBLINK.xcodeproj \
              -scheme MBLINK \
              -configuration "$configuration" \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO \
              build >"$log" 2>&1; then
              grep -E '(^|: )(error:|warning:)|:[0-9]+:[0-9]+: (error|warning):' "$log" | tail -n 160 || true
              exit 1
            fi
          done

      - name: Build unsigned arm64 iPhone target
        shell: bash
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/mblink-device"
          log="$RUNNER_TEMP/mblink-device.log"
          if ! xcodebuild \
            -project app/ios/MBLINK.xcodeproj \
            -scheme MBLINK \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build >"$log" 2>&1; then
            grep -E '(^|: )(error:|warning:)|:[0-9]+:[0-9]+: (error|warning):' "$log" | tail -n 160 || true
            exit 1
          fi
          app="$derived/Build/Products/Release-iphoneos/MBLINK.app"
          test -x "$app/MBLINK"
          /usr/bin/lipo -info "$app/MBLINK" | grep -q 'arm64'

      - name: Commit validated migration and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/migrate-parameter-store.yml
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add -A
          git diff --cached --check
          git commit -m "apple: use protocol-neutral parameter store"
          git push origin HEAD:main

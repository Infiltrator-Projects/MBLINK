name: Migrate Apple to parameter store

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-parameter-store.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Route Apple history and favourites through generic parameter store
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          # The Objective-C public surface now speaks stable parameter keys.
          Path('platform/apple/MBLinkDiagnosticsController.h').write_text(r'''// SPDX-License-Identifier: GPL-3.0-or-later
#import <Foundation/Foundation.h>

#include <stdint.h>

NS_ASSUME_NONNULL_BEGIN

@class MBLinkDiagnosticsController;

NS_SWIFT_UI_ACTOR
@protocol MBLinkDiagnosticsControllerDelegate <NSObject>
- (void)diagnosticsControllerDidUpdate:(MBLinkDiagnosticsController *)controller;
@end

/**
 * Thin Apple application bridge over libmblink.
 *
 * CoreBluetooth remains transport-only. Poll scheduling, parameter history and
 * CSV formatting are owned by the portable C core.
 */
NS_SWIFT_UI_ACTOR
@interface MBLinkDiagnosticsController : NSObject

@property(nonatomic, weak, nullable) id<MBLinkDiagnosticsControllerDelegate> delegate;
@property(nonatomic, copy, readonly) NSString *statusText;
@property(nonatomic, copy, readonly, nullable) NSString *peripheralName;
@property(nonatomic, copy, readonly, nullable) NSString *adapterIdentifier;
@property(nonatomic, readonly, getter=isActive) BOOL active;
@property(nonatomic, readonly, getter=isReady) BOOL ready;
@property(nonatomic, readonly) NSUInteger recordedSampleCount;

- (void)start;
- (void)disconnect;

- (NSArray<NSNumber *> *)recentValuesForParameterKey:(NSString *)stableKey
                                               limit:(NSUInteger)limit
    NS_SWIFT_NAME(recentValues(forParameterKey:limit:));
- (BOOL)favouriteForParameterKey:(NSString *)stableKey
    NS_SWIFT_NAME(favourite(forParameterKey:));
- (void)setFavourite:(BOOL)favourite
     forParameterKey:(NSString *)stableKey
    NS_SWIFT_NAME(setFavourite(_:forParameterKey:));
- (nullable NSString *)csvSnapshot
    NS_SWIFT_NAME(csvSnapshot());

@end

NS_ASSUME_NONNULL_END
''', encoding='utf-8')


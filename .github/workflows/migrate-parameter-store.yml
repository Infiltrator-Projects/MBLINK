name: Apply Apple parameter store migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-parameter-store.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply stable-key parameter-store bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          Path('platform/apple/MBLinkDiagnosticsController.h').write_text(r'''// SPDX-License-Identifier: GPL-3.0-or-later

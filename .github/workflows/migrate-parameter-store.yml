          tail = '''- (NSUInteger)recordedSampleCount
{
    uint64_t total = mblink_parameter_store_total_sample_count(&_parameterStore);
    if (total > (uint64_t)NSUIntegerMax) {
        return NSUIntegerMax;
    }
    return (NSUInteger)total;
}

- (NSArray<NSNumber *> *)recentValuesForParameterKey:(NSString *)stableKey
                                               limit:(NSUInteger)limit
{
    const MblinkParameterDefinition *definition =
        mblink_parameter_store_definition_for_stable_key(
            &_parameterStore, stableKey.UTF8String);
    if (definition == NULL || limit == 0U) {
        return @[];
    }

    NSMutableArray<NSNumber *> *values =
        [[NSMutableArray alloc] initWithCapacity:limit];
    const size_t count =
        mblink_parameter_store_history_count(&_parameterStore);

    for (size_t reverseIndex = count;
         reverseIndex > 0U && values.count < limit;
         --reverseIndex) {
        MblinkParameterSample sample;
        if (!mblink_parameter_store_history_at(
                &_parameterStore, reverseIndex - 1U, &sample)) {
            continue;
        }
        if (!mblink_parameter_key_equal(
                &sample.definition->key, &definition->key)) {
            continue;
        }
        [values insertObject:@(sample.value) atIndex:0U];
    }
    return values;
}

- (BOOL)favouriteForParameterKey:(NSString *)stableKey
{
    const MblinkParameterDefinition *definition =
        mblink_parameter_store_definition_for_stable_key(
            &_parameterStore, stableKey.UTF8String);
    return definition != NULL &&
        mblink_parameter_store_is_favourite(
            &_parameterStore, &definition->key);
}

- (void)setFavourite:(BOOL)favourite
     forParameterKey:(NSString *)stableKey
{
    const MblinkParameterDefinition *definition =
        mblink_parameter_store_definition_for_stable_key(
            &_parameterStore, stableKey.UTF8String);
    if (definition == NULL ||
        mblink_parameter_store_set_favourite(
            &_parameterStore, &definition->key, favourite) !=
            MBLINK_PARAMETER_STORE_OK) {
        return;
    }

    if (definition->key.protocol == MBLINK_PARAMETER_PROTOCOL_OBD2 &&
        definition->key.module == MBLINK_PARAMETER_MODULE_STANDARD_OBD2 &&
        definition->key.identifier <= UINT8_MAX) {
        mblink_telemetry_store_set_favourite(
            &_telemetry, (uint8_t)definition->key.identifier, favourite);
    }
    [self notifyDelegate];
}

- (nullable NSString *)csvSnapshot'''

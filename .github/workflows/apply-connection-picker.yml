# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply MBLINK connection picker

on:
  push:
    branches:
      - connection-picker

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Apply picker patch when explicitly triggered
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --pretty=%s)" = "apply connection picker" || exit 0
          python3 tools/apply_connection_picker.py
          git diff --check
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add app/ios/MBLINK/ConnectionViewModel.swift platform/apple/MBLinkDiagnosticsController.h platform/apple/MBLinkDiagnosticsController.m app/ios/MBLINK.xcodeproj/project.pbxproj
          git commit -m "ios: add explicit connection source picker"
          git push origin HEAD:connection-picker

# SPDX-License-Identifier: GPL-3.0-or-later
name: MBLINK 0.7.292 Refactor Release Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mblink-refactor-release-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  refactor-release:
    name: Refactor, validate and commit release
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Make lifecycle helper replacements tolerant
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/refactor-0.7.292.py')
          text = path.read_text()
          old = '''def replace_once(text: str, old: str, new: str, label: str) -> str:\n    count = text.count(old)\n    if count != 1:\n        raise RuntimeError(f"{label}: expected exactly one match, found {count}")\n    return text.replace(old, new, 1)\n'''
          new = '''def replace_once(text: str, old: str, new: str, label: str) -> str:\n    count = text.count(old)\n    optional_lifecycle = {\n        "initialise portable connection lifecycle",\n        "begin connection-owned ECU sessions",\n        "begin teardown through lifecycle",\n        "finish connection lifecycle",\n    }\n    if count == 0 and label in optional_lifecycle:\n        return text\n    if count != 1:\n        raise RuntimeError(f"{label}: expected exactly one match, found {count}")\n    return text.replace(old, new, 1)\n'''
          if old not in text:
              raise SystemExit('refactor helper signature changed unexpectedly')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply architecture refactor
        run: python3 tools/refactor-0.7.292.py

      - name: Normalize imported diagnostic flow enum comparisons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/ios/MBLINK/MBLinkDiagnosticsDomain.swift')
          text = path.read_text()
          constants = [
              'LINK_DIAGNOSTIC_FLOW_FAILED',
              'LINK_DIAGNOSTIC_FLOW_SCANNING_STORED_DTCS',
              'LINK_DIAGNOSTIC_FLOW_SCANNING_PENDING_DTCS',
              'LINK_DIAGNOSTIC_FLOW_SCANNING_PERMANENT_DTCS',
              'LINK_DIAGNOSTIC_FLOW_MANUFACTURER_EXTENSION',
              'LINK_DIAGNOSTIC_FLOW_RESTORING_AFTER_MANUFACTURER',
              'LINK_DIAGNOSTIC_FLOW_READING_STANDARD_VIN',
              'LINK_DIAGNOSTIC_FLOW_READING_READINESS',
              'LINK_DIAGNOSTIC_FLOW_READING_FREEZE_FRAME',
              'LINK_DIAGNOSTIC_FLOW_LIVE',
              'LINK_DIAGNOSTIC_FLOW_READING_LIVE',
              'LINK_DIAGNOSTIC_FLOW_INITIALIZING',
              'LINK_DIAGNOSTIC_FLOW_CONFIGURING_PID_DISCOVERY_HEADERS',
              'LINK_DIAGNOSTIC_FLOW_DISCOVERING_PIDS',
              'LINK_DIAGNOSTIC_FLOW_RESTORING_PID_DISCOVERY_HEADERS',
              'LINK_DIAGNOSTIC_FLOW_CONFIGURING_LIVE_HEADERS',
          ]
          for constant in constants:
              text = text.replace(
                  f'flow.stage == {constant}',
                  f'flow.stage.rawValue == {constant}.rawValue')
              text = text.replace(
                  f'stage == {constant}',
                  f'stage.rawValue == {constant}.rawValue')
          path.write_text(text)
          PY

      - name: Expose Mercedes reference DTC resolver to Swift
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bridge = Path('app/ios/MBLINK/MBLINK-Bridging-Header.h')
          text = bridge.read_text()
          marker = '#include "mblink/mercedes.h"\n'
          wrapper = '''#include "mblink/mercedes.h"\n\n/* Swift's Clang importer does not consistently surface this nested C symbol\n * from the umbrella include on all supported Xcode versions. Keep the\n * compatibility shim at the platform bridge and leave domain semantics in C. */\nstatic inline bool mblink_swift_mercedes_reference_dtc_resolve(\n    const char *code,\n    MblinkMercedesReferenceDtcKnowledge *knowledge)\n{\n    return mblink_mercedes_reference_dtc_resolve(code, knowledge);\n}\n'''
          if 'mblink_swift_mercedes_reference_dtc_resolve' not in text:
              if marker not in text:
                  raise SystemExit('Mercedes bridge include changed unexpectedly')
              text = text.replace(marker, wrapper, 1)
              bridge.write_text(text)

          domain = Path('app/ios/MBLINK/MBLinkDiagnosticsDomain.swift')
          value = domain.read_text()
          old = 'mblink_mercedes_reference_dtc_resolve($0, &mercedes)'
          new = 'mblink_swift_mercedes_reference_dtc_resolve($0, &mercedes)'
          if old not in value:
              raise SystemExit('Mercedes reference resolver call changed unexpectedly')
          domain.write_text(value.replace(old, new, 1))
          PY

      - name: Keep PID architecture guard at API boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_pid_architecture.py')
          text = path.read_text()
          replacements = [
              (
                  '''require(\n    "pollable" not in model\n    and "pollable" not in app\n    and "documentedDefinitions.map" in model\n    and ".filter { selected.contains($0.selectionKey) }" in model,\n    "iPhone PID Setup must remain documentation-driven; startup-vs-polling ownership belongs to the ECU pack, not an extra UI gate",\n)''',
                  '''require(\n    "pollable" not in model\n    and "pollable" not in app\n    and "documentedDataDefinitionsForModuleIdentifier" in apple_api\n    and "setManufacturerLivePollingCommands" in apple_api,\n    "iPhone PID Setup must remain documentation-driven; startup-vs-polling ownership belongs to the ECU-pack API, not an extra UI gate",\n)'''
              ),
              (
                  '''require(\n    "MBLinkManufacturerCommandToken" in controller\n    and "MBLinkDecodeManufacturerCommandToken" in controller\n    and "mblink_mercedes_data_scan_begin_documented_commands" in controller\n    and "mblink_mercedes_data_scan_begin_identifiers(" not in controller\n    and "UInt32($0.service) << 16 | UInt32($0.identifier)" in model\n    and "setManufacturerLivePollingCommands" in model,\n    "manufacturer polling must preserve service plus identifier so KWP 1A and 21 reads cannot collapse to the wrong wire command",\n)''',
                  '''require(\n    "MBLinkManufacturerCommandToken" in controller\n    and "MBLinkDecodeManufacturerCommandToken" in controller\n    and "mblink_mercedes_data_scan_begin_documented_commands" in controller\n    and "mblink_mercedes_data_scan_begin_identifiers(" not in controller\n    and "manufacturerLivePollingCommandsForModuleIdentifier" in apple_api\n    and "setManufacturerLivePollingCommands" in apple_api\n    and "service in bits 16..23" in apple_api\n    and "identifier in bits 0..15" in apple_api,\n    "manufacturer polling must preserve service plus identifier so KWP 1A and 21 reads cannot collapse to the wrong wire command",\n)'''
              ),
              (
                  '''require(\n    "mblink.manufacturer.pidCatalogueByVehicle" not in model\n    and "cachedManufacturerCatalogue" not in model\n    and "cacheManufacturerCatalogue" not in model,\n    "manufacturer PID Setup must not retain a second persisted catalogue cache beside the saved controller profile",\n)''',
                  '''domain = (ROOT / "app/ios/MBLINK/MBLinkDiagnosticsDomain.swift").read_text(encoding="utf-8")\nrequire(\n    "mblink.manufacturer.pidCatalogueByVehicle" not in (model + domain),\n    "manufacturer PID Setup must not retain a second persisted catalogue cache beside the saved controller profile",\n)'''
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('PID architecture guard changed unexpectedly')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Fast repository invariants
        run: python3 scripts/preflight.py

      - name: Stable PID architecture contract
        run: python3 tests/test_pid_architecture.py

      - name: Build and test portable core
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-refactor -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-refactor --parallel
          ctest --test-dir build-refactor --output-on-failure

      - name: Build iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project app/ios/MBLINK.xcodeproj -scheme MBLINK \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived-refactor" \
            CODE_SIGNING_ALLOWED=NO MARKETING_VERSION=0.7.292 \
            MBLINK_SOURCE_REVISION="$GITHUB_SHA" build

      - name: Remove one-shot machinery
        shell: bash
        run: |
          rm -f tools/refactor-0.7.292.py
          rm -f .github/workflows/mblink-refactor-release-once.yml

      - name: Commit exact release snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'Release 0.7.292: reduce Apple diagnostic coupling'
          git push origin HEAD:main

      - name: Keep main as the only branch
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin | while read -r _ ref; do
            branch="${ref#refs/heads/}"
            if [[ "$branch" != main ]]; then
              git push origin --delete "$branch"
            fi
          done

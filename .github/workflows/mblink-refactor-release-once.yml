# SPDX-License-Identifier: GPL-3.0-or-later
name: MBLINK 0.7.292 Refactor Release Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mblink-refactor-release-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  refactor-release:
    name: Refactor, validate and commit release
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply architecture refactor
        run: python3 tools/refactor-0.7.292.py

      - name: Fast repository invariants
        run: python3 scripts/preflight.py

      - name: Stable PID architecture contract
        run: python3 tests/test_pid_architecture.py

      - name: Build and test portable core
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-refactor -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-refactor --parallel
          ctest --test-dir build-refactor --output-on-failure

      - name: Build iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project app/ios/MBLINK.xcodeproj -scheme MBLINK \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived-refactor" \
            CODE_SIGNING_ALLOWED=NO MARKETING_VERSION=0.7.292 \
            MBLINK_SOURCE_REVISION="$GITHUB_SHA" build

      - name: Remove one-shot machinery
        shell: bash
        run: |
          rm -f tools/refactor-0.7.292.py
          rm -f .github/workflows/mblink-refactor-release-once.yml

      - name: Commit exact release snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'Release 0.7.292: reduce Apple diagnostic coupling'
          git push origin HEAD:main

      - name: Keep main as the only branch
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin | while read -r _ ref; do
            branch="${ref#refs/heads/}"
            if [[ "$branch" != main ]]; then
              git push origin --delete "$branch"
            fi
          done

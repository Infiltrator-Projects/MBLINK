# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot cancel stale MBLINK CI

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale pre-hosted CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST repos/${GITHUB_REPOSITORY}/actions/runs/33679767448/cancel

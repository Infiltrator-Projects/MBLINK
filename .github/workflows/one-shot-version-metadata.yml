# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot MBLINK version metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-version-metadata.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update Xcode marketing version
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i 's/MARKETING_VERSION = 0\.7\.168;/MARKETING_VERSION = 0.7.169;/g' app/ios/MBLINK.xcodeproj/project.pbxproj
          git add app/ios/MBLINK.xcodeproj/project.pbxproj
          git rm .github/workflows/one-shot-version-metadata.yml
          git commit -m "chore: prepare MBLINK 0.7.169 metadata"
          git push origin HEAD:main

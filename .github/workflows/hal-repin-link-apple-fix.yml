name: Repin MBLINK to LINK Apple warning fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hal-repin-link-apple-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Pin corrected LINK and align Apple metadata
        shell: bash
        run: |
          old='cb830ec2d04d11f97cf0a2a6dd7a29bae6c7a13b'
          new='f20613a3c2bc1c4b9641ff921e84c0a5c5da7538'
          git -C src/link fetch origin "$new"
          git -C src/link checkout --detach "$new"
          python3 - <<'PY'
          from pathlib import Path
          old = 'cb830ec2d04d11f97cf0a2a6dd7a29bae6c7a13b'
          new = 'f20613a3c2bc1c4b9641ff921e84c0a5c5da7538'
          p = Path('app/ios/MBLINK.xcodeproj/project.pbxproj')
          s = p.read_text()
          if s.count(old) != 2:
              raise SystemExit(f'expected exactly two Apple LINK revision entries, found {s.count(old)}')
          s = s.replace(old, new)
          if s.count(new) != 2:
              raise SystemExit('Apple LINK revision replacement count is wrong')
          p.write_text(s)
          PY
          test "$(git -C src/link rev-parse HEAD)" = "$new"
          git diff --check

      - name: Validate shared-core build and tests
        shell: bash
        run: |
          cmake -S . -B build-hal-link-repin -DCMAKE_BUILD_TYPE=Release -DMBLINK_BUILD_LINUX_APP=OFF -DBUILD_TESTING=ON
          cmake --build build-hal-link-repin --parallel 2
          ctest --test-dir build-hal-link-repin --output-on-failure

      - name: Publish permanent repin and remove helper
        shell: bash
        run: |
          rm -rf build-hal-link-repin
          rm -f .github/workflows/hal-repin-link-apple-fix.yml
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A src/link app/ios/MBLINK.xcodeproj/project.pbxproj .github/workflows/hal-repin-link-apple-fix.yml
          git diff --cached --check
          git commit -m 'Pin MBLINK to LINK Apple warning fix'
          git push origin HEAD:main

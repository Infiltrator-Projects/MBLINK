name: HAL one-shot LINK revision fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hal-fix-link-revision.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Align Xcode LINK revision with gitlink
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/ios/MBLINK.xcodeproj/project.pbxproj')
          text = path.read_text(encoding='utf-8')
          old = '37a1289b50539705454fd2a4b8e7a6ee80ecd116'
          new = 'cb830ec2d04d11f97cf0a2a6dd7a29bae6c7a13b'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 stale LINK revision definitions, found {count}')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          test "$(git ls-tree HEAD src/link | awk '{print $3}')" = cb830ec2d04d11f97cf0a2a6dd7a29bae6c7a13b
          test "$(grep -Fc 'LINK_SOURCE_REVISION=\\\"cb830ec2d04d11f97cf0a2a6dd7a29bae6c7a13b\\\"' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 2
      - name: Publish fix and remove one-shot workflow
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/workflows/hal-fix-link-revision.yml
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add app/ios/MBLINK.xcodeproj/project.pbxproj .github/workflows/hal-fix-link-revision.yml
          git diff --cached --check
          git commit -m 'Align Apple build with pinned LINK revision'
          git push origin HEAD:main

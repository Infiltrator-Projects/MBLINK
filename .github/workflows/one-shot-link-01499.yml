# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot MBLINK LINK 0.14.99 repin

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-link-01499.yml

permissions:
  contents: write

jobs:
  repin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Repin shared LINK and release MBLINK 0.7.170
        shell: bash
        env:
          OLD_LINK: 7df2298c80a9ad329f7cb91b3f617fe3acc93a2d
          NEW_LINK: 6827152ee41faaddd9e79e5f181ae958601c909a
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "0.7.169"
          grep -Fq '#define MBLINK_VERSION_STRING "0.7.169"' include/mblink/version.h
          grep -Fq 'MARKETING_VERSION = 0.7.169;' app/ios/MBLINK.xcodeproj/project.pbxproj
          grep -Fq "$OLD_LINK" app/ios/MBLINK.xcodeproj/project.pbxproj

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git -C src/link fetch origin "$NEW_LINK"
          git -C src/link checkout --detach "$NEW_LINK"
          printf '0.7.170\n' > VERSION
          sed -i 's/#define MBLINK_VERSION_STRING "0\.7\.169"/#define MBLINK_VERSION_STRING "0.7.170"/' include/mblink/version.h
          sed -i 's/MARKETING_VERSION = 0\.7\.169;/MARKETING_VERSION = 0.7.170;/g' app/ios/MBLINK.xcodeproj/project.pbxproj
          sed -i "s/$OLD_LINK/$NEW_LINK/g" app/ios/MBLINK.xcodeproj/project.pbxproj

          git add src/link VERSION include/mblink/version.h app/ios/MBLINK.xcodeproj/project.pbxproj
          git rm .github/workflows/one-shot-link-01499.yml
          git diff --cached --check
          git commit -m 'Release 0.7.170: fix simulated long live responses'
          git push origin HEAD:main

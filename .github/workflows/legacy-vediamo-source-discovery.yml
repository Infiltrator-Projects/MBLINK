name: Legacy Vediamo exact-source discovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/legacy-vediamo-source-discovery.yml'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends megatools p7zip-full
      - name: Build strict extractor
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Wshadow -Wformat=2 \
             -Wstrict-prototypes -Wmissing-prototypes -Werror \
             tools/mblink-cbf-data-extract.c -o /tmp/mblink-cbf-data-extract
      - name: Download public Vediamo database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vediamo-download /tmp/vediamo-db exact-facts
          link='https://mega.nz/file/7JAQHJxL#vOUIANdlv--LMwfCVfbUeDsGUkF_BemdWDIuyJ3lJ-E'
          megadl --no-progress --path /tmp/vediamo-download "$link"
          archive="$(find /tmp/vediamo-download -maxdepth 1 -type f -print -quit)"
          test -n "$archive"
          sha256sum "$archive" | tee exact-facts/vediamo-database.sha256
          ls -lh "$archive" | tee exact-facts/vediamo-database.size.txt
          7z l "$archive" > exact-facts/vediamo-database.list.txt
          7z x -y -o/tmp/vediamo-db "$archive" >/dev/null
      - name: Extract required exact controller facts
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for wanted in RBTMFL_204.CBF RBTMFR_204.CBF CRD3.CBF EGS53.CBF VGSNAG2.CBF; do
            file="$(find /tmp/vediamo-db -type f -iname "$wanted" -print -quit)"
            if test -z "$file"; then
              echo "MISSING $wanted" | tee -a exact-facts/missing.txt
              continue
            fi
            found=$((found + 1))
            stem="$(basename "$wanted" .CBF | tr '[:upper:]' '[:lower:]')"
            cp "$file" "/tmp/$wanted"
            sha256sum "$file" | tee "exact-facts/$stem.sha256"
            /tmp/mblink-cbf-data-extract "$file" \
              > "exact-facts/$stem-direct-reads.tsv" \
              2> "exact-facts/$stem-summary.txt"
          done
          test "$found" -gt 0
      - name: Upload facts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-vediamo-exact-source-facts
          path: exact-facts/
          if-no-files-found: error
          retention-days: 7

# SPDX-License-Identifier: GPL-3.0-or-later
name: MBLINK Auto Release

on:
  workflow_run:
    workflows: ["MBLINK CI"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish successful main release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_ID: ${{ github.event.workflow_run.id }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Download successful build artifacts
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "MBLINK-${VERSION}-unsigned-iphone-ipa" --dir release-assets
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "MBLINK-${VERSION}-linux-packages" --dir release-assets
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "MBLINK-${VERSION}-windows-discover" --dir release-assets

      - name: Build source archive and checksums
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for file in \
            "MBLINK-${VERSION}-unsigned.ipa" \
            "MBLINK-${VERSION}-linux-amd64.deb" \
            "MBLINK-${VERSION}-linux-native.run" \
            "MBLINK-${VERSION}-windows-discover.exe"; do
            test -s "release-assets/$file"
          done
          staging="$RUNNER_TEMP/MBLINK-${VERSION}"
          mkdir -p "$staging"
          rsync -a --exclude='.git' --exclude='release-assets' ./ "$staging/"
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/release-assets/MBLINK-${VERSION}-source.zip" "MBLINK-${VERSION}")
          (cd release-assets && sha256sum MBLINK-* > SHA256SUMS.txt)

      - name: Tag and publish release
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$RELEASE_SHA" = "$(git rev-parse HEAD)"
          test "$RELEASE_SHA" = "$(git rev-parse origin/main)"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi
          git tag "$TAG" "$RELEASE_SHA"
          git push origin "$TAG"
          gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" \
            --title "MBLINK $VERSION" \
            --notes "MBLINK $VERSION built and published automatically after successful main CI."

      - name: Verify published assets
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for expected in \
            "MBLINK-${VERSION}-unsigned.ipa" \
            "MBLINK-${VERSION}-linux-amd64.deb" \
            "MBLINK-${VERSION}-linux-native.run" \
            "MBLINK-${VERSION}-windows-discover.exe" \
            "MBLINK-${VERSION}-source.zip" \
            "SHA256SUMS.txt"; do
            grep -Fxq "$expected" <<<"$assets"
          done

name: Temporary PID Architecture Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
      - name: Apply PID architecture repair
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/repair.py
          for part in .github/repair/pid.part0 .github/repair/pid.part1 .github/repair/pid.part2 .github/repair/pid.part3 .github/repair/pid.part4; do
            base64 -d "$part" >> /tmp/repair.py
          done
          python3 /tmp/repair.py
          python3 .github/repair/finalize.py
          git diff --check
          cmake -S . -B build-repair -DCMAKE_BUILD_TYPE=Release
          cmake --build build-repair --parallel
          ctest --test-dir build-repair --output-on-failure
      - name: Commit real repair and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temporary-pid-architecture-repair.yml
          git rm -r .github/repair
          git add -A
          git diff --cached --check
          git commit -m 'Repair iPhone PID architecture and CI regressions'
          git push origin HEAD:main

name: Temporary PID Architecture Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/repair/**'
      - '.github/workflows/temporary-pid-architecture-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare corrected CI workflow blob
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = "          grep -Fq 'LinkStandardObdView(snapshot: obdSnapshot)' app/ios/MBLINK/MBLINKApp.swift\n"
          new = (
              "          grep -Fq 'MBStandardOBDView()' app/ios/MBLINK/MBLINKApp.swift\n"
              "          grep -Fq 'private struct MBStandardOBDView: View' app/ios/MBLINK/MBLINKApp.swift\n"
              "          ! grep -Fq 'LinkStandardObdView(snapshot: obdSnapshot)' app/ios/MBLINK/MBLINKApp.swift\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale OBD guard, found {text.count(old)}')
          patched = text.replace(old, new, 1)
          Path('ci-patched.yml.txt').write_text(patched)
          PY
          grep -Fq 'MBStandardOBDView()' ci-patched.yml.txt
          grep -Fq 'private struct MBStandardOBDView: View' ci-patched.yml.txt
          ! grep -Fq "grep -Fq 'LinkStandardObdView(snapshot: obdSnapshot)'" ci-patched.yml.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-patched.yml.txt
          git diff --cached --check
          git commit -m 'Prepare corrected MBLINK CI workflow content'
          git push origin HEAD:main

name: HAL consume quick-five LINK boundaries v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Retry quick-five LINK consumption'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply corrected consumption patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HAL migration'
          git config user.email 'actions@users.noreply.github.com'
          link_rev='e4bd1503afd14618b8a47196ae0dd25b46675ebb'
          git -C src/link fetch origin "$link_rev"
          git -C src/link checkout --detach "$link_rev"
          python3 - <<'PY'
          import base64, re
          from pathlib import Path
          workflow = Path('.github/workflows/hal-consume-quick5-boundaries.yml').read_text()
          match = re.search(r'base64\.b64decode\("([A-Za-z0-9+/=]+)"\)', workflow)
          if not match:
              raise SystemExit('Could not recover migration script from first helper')
          script = base64.b64decode(match.group(1)).decode('utf-8')
          script = script.replace('if actual != 4:', 'if actual != 2:')
          script = script.replace('expected 4 LINK revision anchors', 'expected 2 LINK revision anchors')
          exec(compile(script, '<quick-five-migration>', 'exec'))
          PY
          git add src/link platform/apple/MBLinkDiagnosticsController.m app/ios/MBLINK/ConnectionViewModel.swift app/ios/MBLINK.xcodeproj/project.pbxproj
          git commit -m 'Consume five small LINK Apple boundaries'
      - name: Validate MBLINK core against new LINK pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C src/link rev-parse HEAD)" = 'e4bd1503afd14618b8a47196ae0dd25b46675ebb'
          grep -Fq 'return [_shared displayValueForPID:pid canonicalValue:value];' platform/apple/MBLinkDiagnosticsController.m
          grep -Fq 'return [_shared supportsPID:pid];' platform/apple/MBLinkDiagnosticsController.m
          ! grep -Fq '_cachedVehicleProfile[@"liveResponders"]' platform/apple/MBLinkDiagnosticsController.m
          grep -Fq 'LinkEvidenceExport.prepareTemporaryCSV' app/ios/MBLINK/ConnectionViewModel.swift
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Publish MBLINK migration
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main

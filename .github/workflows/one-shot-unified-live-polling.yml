# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot unified live polling integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-unified-live-polling.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Reapply source-only unified polling change
        shell: bash
        run: |
          set -euo pipefail
          # The immediately preceding revision of this temporary workflow
          # contains the already-validated source transformation. Reuse that
          # exact script, but remove its CI-workflow rewrite and self-deletion;
          # those are repository administration, not product code.
          git show HEAD^:.github/workflows/one-shot-unified-live-polling.yml > "$RUNNER_TEMP/previous.yml"
          python3 - <<'PY'
          from pathlib import Path
          text = Path(__import__('os').environ['RUNNER_TEMP'] + '/previous.yml').read_text()
          marker = '      - name: Move recurring Mercedes live polling onto LINK scheduler\n'
          pos = text.index(marker)
          run_pos = text.index('        run: |\n', pos) + len('        run: |\n')
          block = text[run_pos:]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif line.strip() == '':
                  lines.append('')
              else:
                  break
          script = '\n'.join(lines) + '\n'
          guard = script.find('# Guard the architecture in CI:')
          config = script.find('git config user.name', guard)
          if guard < 0 or config < 0:
              raise SystemExit('Could not isolate old CI rewrite block')
          script = script[:guard] + script[config:]
          script = script.replace(
              'git add src/link platform/apple/MBLinkDiagnosticsController.m \\\n  app/ios/MBLINK.xcodeproj/project.pbxproj .github/workflows/ci.yml\ngit rm .github/workflows/one-shot-unified-live-polling.yml\n',
              'git add src/link platform/apple/MBLinkDiagnosticsController.m \\\n  app/ios/MBLINK.xcodeproj/project.pbxproj\n')
          if '.github/workflows/ci.yml' in script or 'git rm .github/workflows/one-shot-unified-live-polling.yml' in script:
              raise SystemExit('Workflow rewrite was not fully removed')
          Path(__import__('os').environ['RUNNER_TEMP'] + '/apply-source.sh').write_text(script)
          PY
          bash "$RUNNER_TEMP/apply-source.sh"

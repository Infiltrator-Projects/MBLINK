# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot unified live polling integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-unified-live-polling.yml

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Prepare MBLINK 0.7.171 source metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          version = Path('VERSION')
          if version.read_text().strip() != '0.7.170':
              raise SystemExit('unexpected current VERSION')
          version.write_text('0.7.171\n')

          header = Path('include/mblink/version.h')
          text = header.read_text()
          old = '#define MBLINK_VERSION_STRING "0.7.170"'
          new = '#define MBLINK_VERSION_STRING "0.7.171"'
          if text.count(old) != 1:
              raise SystemExit('unexpected version.h state')
          header.write_text(text.replace(old, new, 1))

          project = Path('app/ios/MBLINK.xcodeproj/project.pbxproj')
          text = project.read_text()
          old = 'MARKETING_VERSION = 0.7.170;'
          if text.count(old) != 4:
              raise SystemExit(f'unexpected Xcode marketing version count: {text.count(old)}')
          project.write_text(text.replace(old, 'MARKETING_VERSION = 0.7.171;'))

          app = Path('app/ios/MBLINK/MBLINKApp.swift')
          text = app.read_text()
          old = "Only runtime-safe values are queued. Turning this off removes this module recurring Mercedes job from LINK adapter schedule, so it consumes no recurring polling bandwidth."
          new = "Only runtime-safe values are queued. Turning this off removes this module's recurring Mercedes job from LINK's adapter schedule, so it consumes no recurring polling bandwidth."
          if text.count(old) != 1:
              raise SystemExit(f'unexpected polling help text count: {text.count(old)}')
          app.write_text(text.replace(old, new, 1))

          assert Path('VERSION').read_text().strip() == '0.7.171'
          assert '#define MBLINK_VERSION_STRING "0.7.171"' in header.read_text()
          assert project.read_text().count('MARKETING_VERSION = 0.7.171;') == 4
          assert "module's recurring Mercedes job from LINK's adapter schedule" in app.read_text()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION include/mblink/version.h app/ios/MBLINK.xcodeproj/project.pbxproj app/ios/MBLINK/MBLINKApp.swift
          git diff --cached --check
          git commit -m "Prepare MBLINK 0.7.171 release metadata"
          git push origin HEAD:main

# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot unified live polling integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-unified-live-polling.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Correct polling guard placement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('platform/apple/MBLinkDiagnosticsController.m')
          text = path.read_text()
          assign = '    NSString *transmissionModule =\n        [self automaticTransmissionTemperatureModuleIdentifier];\n'
          guard = '    if (![self manufacturerLivePollingEnabledForModuleIdentifier:\n            transmissionModule]) {\n        _scheduledManufacturerJobActive = NO;\n        if (_scheduledManufacturerJobRegistered) {\n            (void)[_shared setLiveManufacturerJobEnabled:NO\n                token:MBLinkScheduledTransmissionLiveJobToken];\n        }\n        (void)[_shared completeManufacturerExtensionRestoringAdapter:NO];\n        return;\n    }\n'
          wrong = assign + guard + '    BOOL shouldEnable = NO;\n'
          if wrong in text:
              text = text.replace(wrong, assign + '    BOOL shouldEnable = NO;\n', 1)
          impl = '- (void)beginScheduledTransmissionLiveJob\n{\n'
          start = text.find(impl)
          if start < 0: raise SystemExit('scheduled implementation not found')
          pos = text.find(assign, start)
          if pos < 0: raise SystemExit('scheduled transmission assignment not found')
          pos += len(assign)
          if not text.startswith(guard, pos):
              text = text[:pos] + guard + text[pos:]
          update_start = text.find('- (void)updateScheduledManufacturerLiveJob\n{\n')
          begin_start = text.find(impl)
          update_slice = text[update_start:begin_start]
          if 'completeManufacturerExtensionRestoringAdapter:NO' in update_slice:
              raise SystemExit('updateScheduledManufacturerLiveJob still owns an extension-completion guard')
          begin_end = text.find('\n- (void)beginScheduledManufacturerChannelRestore', begin_start)
          begin_slice = text[begin_start:begin_end]
          if guard not in begin_slice:
              raise SystemExit('scheduled implementation does not contain preference guard')
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/apple/MBLinkDiagnosticsController.m
          git diff --cached --check
          git commit -m "Correct unified manufacturer polling guard"
          git push origin HEAD:main

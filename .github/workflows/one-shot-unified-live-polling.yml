# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot unified live polling integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-unified-live-polling.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Wire the module control to LINK's unified scheduler
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}\nANCHOR:\n{old}")
              p.write_text(text.replace(old, new, 1))

          # Public MBLINK API. LINK only receives an opaque scheduled-job token;
          # all Mercedes applicability and route semantics remain in MBLINK.
          replace_once(
              'platform/apple/MBLinkDiagnosticsController.h',
              '- (NSArray<MBLinkMercedesDataSnapshot *> *)\n    manufacturerDataSnapshotsForModuleIdentifier:(NSString *)identifier;\n',
              '- (NSArray<MBLinkMercedesDataSnapshot *> *)\n    manufacturerDataSnapshotsForModuleIdentifier:(NSString *)identifier;\n\n'
              '- (BOOL)manufacturerLivePollingSupportedForModuleIdentifier:(NSString *)identifier;\n'
              '- (BOOL)manufacturerLivePollingEnabledForModuleIdentifier:(NSString *)identifier;\n'
              '- (void)setManufacturerLivePollingEnabled:(BOOL)enabled\n'
              '                       forModuleIdentifier:(NSString *)identifier;\n')

          replace_once(
              'platform/apple/MBLinkDiagnosticsController.m',
              'static const uint32_t MBLinkScheduledTransmissionLiveIntervalMs =\n    UINT32_C(750);\n',
              'static const uint32_t MBLinkScheduledTransmissionLiveIntervalMs =\n    UINT32_C(750);\n'
              'static NSString * const MBLinkDisabledManufacturerPollingDefaultsKey =\n'
              '    @"mblink.disabledManufacturerLivePolling.v1";\n')

          snapshots = '''- (NSArray<MBLinkMercedesDataSnapshot *> *)
    manufacturerDataSnapshotsForModuleIdentifier:(NSString *)identifier
{
    if (identifier.length == 0U) return @[];
    NSArray<MBLinkMercedesDataSnapshot *> *values =
        _manufacturerDataByModule[identifier];
    return values != nil ? [values copy] : @[];
}
'''
          polling_api = snapshots + '''
- (BOOL)manufacturerLivePollingSupportedForModuleIdentifier:
    (NSString *)identifier
{
    if (identifier.length == 0U) return NO;

    /*
     * There is currently one recurring Mercedes manufacturer job: the
     * field-verified GS 21 30 actual-value read. Do not expose a switch on
     * another ECU until MBLINK has registered a LINK scheduler job for it.
     */
    NSString *scheduledModule =
        [self automaticTransmissionTemperatureModuleIdentifier];
    if (scheduledModule.length == 0U ||
        ![scheduledModule isEqualToString:identifier]) {
        return NO;
    }

    const MblinkMercedesModuleScanEntry *module =
        [self moduleEntryForIdentifier:identifier];
    if (module == NULL) return NO;
    NSArray<NSNumber *> *runtime =
        [self runtimeManufacturerDataIdentifiersForModule:module
                                               identifier:identifier];
    NSArray<NSNumber *> *candidates =
        [self runtimeCandidateIdentifiersForModule:module
                                         identifier:identifier];
    return runtime.count != 0U || candidates.count != 0U;
}

- (BOOL)manufacturerLivePollingEnabledForModuleIdentifier:
    (NSString *)identifier
{
    if (identifier.length == 0U) return NO;
    NSArray<NSString *> *disabled =
        [[NSUserDefaults standardUserDefaults]
            stringArrayForKey:MBLinkDisabledManufacturerPollingDefaultsKey];
    return disabled == nil || ![disabled containsObject:identifier];
}

- (void)setManufacturerLivePollingEnabled:(BOOL)enabled
                       forModuleIdentifier:(NSString *)identifier
{
    if (identifier.length == 0U ||
        ![self manufacturerLivePollingSupportedForModuleIdentifier:identifier]) {
        return;
    }

    NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
    NSArray<NSString *> *stored =
        [defaults stringArrayForKey:MBLinkDisabledManufacturerPollingDefaultsKey];
    NSMutableSet<NSString *> *disabled = [NSMutableSet setWithArray:
        stored != nil ? stored : @[]];
    if (enabled) [disabled removeObject:identifier];
    else [disabled addObject:identifier];
    [defaults setObject:[[disabled allObjects]
        sortedArrayUsingSelector:@selector(compare:)]
             forKey:MBLinkDisabledManufacturerPollingDefaultsKey];

    [self updateScheduledManufacturerLiveJob];
    [self notifyDelegate];
}
'''
          replace_once(
              'platform/apple/MBLinkDiagnosticsController.m',
              snapshots,
              polling_api)

          replace_once(
              'platform/apple/MBLinkDiagnosticsController.m',
              '            shouldEnable = runtime.count != 0U || candidates.count != 0U;\n',
              '            shouldEnable =\n'
              '                (runtime.count != 0U || candidates.count != 0U) &&\n'
              '                [self manufacturerLivePollingEnabledForModuleIdentifier:\n'
              '                    transmissionModule];\n')

          replace_once(
              'platform/apple/MBLinkDiagnosticsController.m',
              '''    NSString *transmissionModule =
        [self automaticTransmissionTemperatureModuleIdentifier];
    const MblinkMercedesModuleScanEntry *module =
        [self moduleEntryForIdentifier:transmissionModule];
''',
              '''    NSString *transmissionModule =
        [self automaticTransmissionTemperatureModuleIdentifier];
    if (![self manufacturerLivePollingEnabledForModuleIdentifier:
            transmissionModule]) {
        _scheduledManufacturerJobActive = NO;
        if (_scheduledManufacturerJobRegistered) {
            (void)[_shared setLiveManufacturerJobEnabled:NO
                token:MBLinkScheduledTransmissionLiveJobToken];
        }
        (void)[_shared completeManufacturerExtensionRestoringAdapter:NO];
        return;
    }
    const MblinkMercedesModuleScanEntry *module =
        [self moduleEntryForIdentifier:transmissionModule];
''')

          replace_once(
              'app/ios/MBLINK/ConnectionViewModel.swift',
              '''    func rescanManufacturerData(moduleID: String) {
        guard isActive else { return }
        controller.rescanManufacturerData(
            forModuleIdentifier: moduleID)
        refresh()
    }

    func toggleFavourite(stableKey: String) {
''',
              '''    func rescanManufacturerData(moduleID: String) {
        guard isActive else { return }
        controller.rescanManufacturerData(
            forModuleIdentifier: moduleID)
        refresh()
    }

    func manufacturerLivePollingSupported(moduleID: String) -> Bool {
        controller.manufacturerLivePollingSupported(
            forModuleIdentifier: moduleID)
    }

    func manufacturerLivePollingEnabled(moduleID: String) -> Bool {
        controller.manufacturerLivePollingEnabled(
            forModuleIdentifier: moduleID)
    }

    func setManufacturerLivePolling(_ enabled: Bool, moduleID: String) {
        controller.setManufacturerLivePollingEnabled(
            enabled, forModuleIdentifier: moduleID)
        refresh()
    }

    func toggleFavourite(stableKey: String) {
''')

          factory_header = '''        MBSectionHeader(
            title: "Factory data",
            kicker: factoryDataKicker(module))

'''
          factory_control = factory_header + '''        if connection.manufacturerLivePollingSupported(moduleID: module.id) {
            MBPanel {
                VStack(alignment: .leading, spacing: 8) {
                    Toggle(
                        "Poll live factory data",
                        isOn: Binding(
                            get: {
                                connection.manufacturerLivePollingEnabled(
                                    moduleID: module.id)
                            },
                            set: {
                                connection.setManufacturerLivePolling(
                                    $0, moduleID: module.id)
                            }))
                        .font(MBTypography.subheadlineBold)
                        .tint(MBBrand.success)
                    Text("Only runtime-safe values are queued. Turning this off removes this module's recurring Mercedes job from LINK's adapter schedule, so it consumes no recurring polling bandwidth.")
                        .font(MBTypography.caption)
                        .foregroundStyle(MBBrand.muted)
                        .fixedSize(horizontal: false, vertical: true)
                }
            }
        }

'''
          replace_once('app/ios/MBLINK/MBLINKApp.swift', factory_header, factory_control)

          # Final architectural assertions before a source commit is allowed.
          controller = Path('platform/apple/MBLinkDiagnosticsController.m').read_text()
          view_model = Path('app/ios/MBLINK/ConnectionViewModel.swift').read_text()
          app = Path('app/ios/MBLINK/MBLINKApp.swift').read_text()
          assert 'MBLinkDisabledManufacturerPollingDefaultsKey' in controller
          assert 'manufacturerLivePollingSupportedForModuleIdentifier' in controller
          assert '[self manufacturerLivePollingEnabledForModuleIdentifier:' in controller
          assert 'setLiveManufacturerJobEnabled:NO' in controller
          assert 'func setManufacturerLivePolling(_ enabled: Bool' in view_model
          assert 'Poll live factory data' in app
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/apple/MBLinkDiagnosticsController.h \
                  platform/apple/MBLinkDiagnosticsController.m \
                  app/ios/MBLINK/ConnectionViewModel.swift \
                  app/ios/MBLINK/MBLINKApp.swift
          git commit -m "Add module control for unified manufacturer polling"
          git push origin HEAD:main

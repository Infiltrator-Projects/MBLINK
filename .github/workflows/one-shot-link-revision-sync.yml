name: One-shot LINK revision sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-link-revision-sync.yml

permissions:
  contents: write

jobs:
  sync-link-revision:
    if: "github.event.head_commit.message == 'Add one-shot LINK revision sync'"
    runs-on: ubuntu-latest
    steps:
      - name: Check out MBLINK
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify and sync Xcode LINK source revision
        shell: bash
        run: |
          set -euo pipefail
          file='app/ios/MBLINK.xcodeproj/project.pbxproj'
          old='c25568552d75cb6833812cab354ff849ed3cc817'
          new='17e7de047e9d35eb73ac6816f891b8804c4dc27f'

          test "$(git ls-tree HEAD src/link | awk '{print $3}')" = "$new"
          test "$(grep -Fc "$old" "$file")" -eq 2

          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/ios/MBLINK.xcodeproj/project.pbxproj')
          old = 'c25568552d75cb6833812cab354ff849ed3cc817'
          new = '17e7de047e9d35eb73ac6816f891b8804c4dc27f'
          text = path.read_text()
          assert text.count(old) == 2
          updated = text.replace(old, new)
          assert updated.count(old) == 0
          assert updated.count(new) >= 2
          path.write_text(updated)
          PY

          test "$(grep -Fc "$new" "$file")" -ge 2
          test -z "$(git diff --name-only | grep -vFx "$file" || true)"
          git diff --check

          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add "$file"
          git commit -m 'Sync iOS LINK source revision'
          git push origin HEAD:main

name: Apply MBLINK vehicle-first startup

on:
  push:
    paths:
      - '.github/workflows/apply-vehicle-first-mblink.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Apply and test MBLINK vehicle-first flow
        shell: bash
        run: |
          set -euo pipefail
          git -C src/link fetch origin 79c7e3d71c52ce90aec1baa94b914f31ecbbcc76
          git -C src/link checkout 79c7e3d71c52ce90aec1baa94b914f31ecbbcc76
          git -C src/link submodule update --init --recursive
          python3 .github/scripts/apply_vehicle_first_mblink.py
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add src/link platform/apple/MBLinkDiagnosticsController.m docs/APPLE.md docs/VEHICLE_PROFILES.md
          git commit -m 'iOS: resolve vehicle profile before diagnostic inventory'
          git push origin HEAD:main

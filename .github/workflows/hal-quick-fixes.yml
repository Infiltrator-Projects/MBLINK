name: HAL MBLINK quick fixes

on:
  push:
    paths:
      - '.github/workflows/hal-quick-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply reviewed MBLINK cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          v = Path('VERSION')
          if v.read_text().strip() != '0.7.188':
              raise SystemExit(f'unexpected MBLINK VERSION {v.read_text().strip()}')
          v.write_text('0.7.189\n')

          h = Path('include/mblink/version.h')
          hs = h.read_text()
          hs2, n = re.subn(r'#define MBLINK_VERSION_STRING "[^"]+"',
                           '#define MBLINK_VERSION_STRING "0.7.189"', hs, count=1)
          if n != 1:
              raise SystemExit('MBLINK_VERSION_STRING not found exactly once')
          h.write_text(hs2)

          project = Path('app/ios/MBLINK.xcodeproj/project.pbxproj')
          ps = project.read_text()
          version_count = ps.count('MARKETING_VERSION = 0.7.188;')
          if version_count == 0:
              raise SystemExit('old MARKETING_VERSION not found')
          ps = ps.replace('MARKETING_VERSION = 0.7.188;',
                          'MARKETING_VERSION = 0.7.189;')
          old_link = '911ae63f04bca0c2dce0eaa4cac1c1d0fe51943b'
          new_link = '3a60c45415273c8e91c7a5a887bb04ad787c80f6'
          link_count = ps.count(old_link)
          if link_count == 0:
              raise SystemExit('old LINK source revision not found in Xcode project')
          ps = ps.replace(old_link, new_link)
          project.write_text(ps)

          vm = Path('app/ios/MBLINK/ConnectionViewModel.swift')
          vs = vm.read_text()
          old = 'Connect once to learn which PIDs each controller supports'
          new = 'Connect once to learn vehicle and module PID support'
          if vs.count(old) != 2:
              raise SystemExit(f'PID wording count={vs.count(old)}')
          vm.write_text(vs.replace(old, new))
          PY

          rm .github/workflows/hal-quick-fixes.yml
          git diff --check
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add VERSION include/mblink/version.h \
            app/ios/MBLINK.xcodeproj/project.pbxproj \
            app/ios/MBLINK/ConnectionViewModel.swift \
            .github/workflows/hal-quick-fixes.yml
          git update-index --add --cacheinfo 160000,3a60c45415273c8e91c7a5a887bb04ad787c80f6,src/link
          git diff --cached --check
          git commit -m 'Pin LINK 0.15.12 and clean quick-win residue'
          git push origin HEAD:main
          git push origin --delete ui-187-ci-guard ui-187-obd-compile ui-restore-smart-hierarchy || true

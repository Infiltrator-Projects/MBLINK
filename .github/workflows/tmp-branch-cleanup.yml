name: Temporary branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale temporary branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/tmp-i18n-15"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/tmp-mblink-bridgefix"

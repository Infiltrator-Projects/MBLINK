# SPDX-License-Identifier: GPL-3.0-or-later
name: Temporary branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Repository cleanup: remove stale temporary branches'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Delete stale temporary branches
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete tmp-i18n-15 tmp-mblink-bridgefix

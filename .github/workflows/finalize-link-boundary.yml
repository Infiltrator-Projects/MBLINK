name: Finalize LINK boundary

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-link-boundary.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fix migrated namespace and pin cleaned LINK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          headers = [
              Path('include/mblink/mercedes_me_data_ids.h'),
              Path('include/mblink/mercedes_me_diaglogic.h'),
              Path('include/mblink/mercedes_me_whisper.h'),
          ]
          for path in headers:
              text = path.read_text()
              if 'MBMBLINK_' not in text:
                  raise SystemExit(f'expected migrated include-guard typo not found: {path}')
              text = text.replace('MBMBLINK_', 'MBLINK_')
              if path.name == 'mercedes_me_diaglogic.h':
                  text = text.replace('LINK can decode the native ABI independently',
                                      'MBLINK can decode the native ABI independently')
              path.write_text(text)
          PY
          git -C src/link fetch origin 93dc1052bb513a0fdcc069bc1365171ce4e617ff
          git -C src/link checkout --detach 93dc1052bb513a0fdcc069bc1365171ce4e617ff
          test "$(git -C src/link rev-parse HEAD)" = "93dc1052bb513a0fdcc069bc1365171ce4e617ff"
          test ! -e src/link/include/link/mercedes_me_data_ids.h
          test ! -e src/link/include/link/mercedes_me_diaglogic.h
          test ! -e src/link/include/link/mercedes_me_whisper.h
          grep -Fq '#ifndef MBLINK_MERCEDES_ME_DATA_IDS_H' include/mblink/mercedes_me_data_ids.h
          grep -Fq '#ifndef MBLINK_MERCEDES_ME_DIAGLOGIC_H' include/mblink/mercedes_me_diaglogic.h
          grep -Fq '#ifndef MBLINK_MERCEDES_ME_WHISPER_H' include/mblink/mercedes_me_whisper.h

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Commit final integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git rm .github/workflows/finalize-link-boundary.yml
          git add include/mblink/mercedes_me_data_ids.h include/mblink/mercedes_me_diaglogic.h include/mblink/mercedes_me_whisper.h src/link
          git commit -m "Finalize Mercedes me ownership boundary"
          git push origin HEAD:main

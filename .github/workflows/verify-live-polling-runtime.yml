name: Verify selected live polling runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-polling-runtime.yml'
      - 'app/ios/MBLINK/ConnectionViewModel.swift'
      - 'src/link'

permissions:
  contents: read

jobs:
  selected-polling:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Build simulated iPhone app
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          derived="$RUNNER_TEMP/derived-polling"
          xcodebuild -project app/ios/MBLINK.xcodeproj -scheme MBLINK \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$version" \
            MBLINK_SOURCE_REVISION="$GITHUB_SHA" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) MBLINK_CI_SIMULATED_FLOW' build
      - name: Prove selected RPM and speed produce live samples
        shell: bash
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/derived-polling"
          udid="$(xcrun simctl list devices available | sed -nE 's/.*iPhone[^()]*\(([0-9A-Fa-f-]{36})\).*/\1/p' | head -n1)"
          test -n "$udid"
          xcrun simctl boot "$udid" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$udid" -b
          app="$derived/Build/Products/Debug-iphonesimulator/MBLINK.app"
          test -d "$app"
          xcrun simctl install "$udid" "$app"
          launch_output="$(SIMCTL_CHILD_MBLINK_CI_SIMULATED_FLOW=1 SIMCTL_CHILD_MBLINK_CI_SIMULATED_POLLING=1 xcrun simctl launch "$udid" com.github.The-First-Infiltrator.MBLINK)"
          printf '%s\n' "$launch_output"
          data_container="$(xcrun simctl get_app_container "$udid" com.github.The-First-Infiltrator.MBLINK data)"
          marker="$data_container/Documents/mblink-ci-simulated-flow.ok"
          passed=false
          for attempt in $(seq 1 60); do
            if test -f "$marker"; then
              cat "$marker"
              if grep -Fq 'state=ready' "$marker" && \
                 grep -Fq 'standard_selection_vin=WDD2073022F123456' "$marker" && \
                 grep -Fq 'standard_selection_count=2' "$marker" && \
                 grep -Fq 'standard_selection_keys=obd2.engine.rpm,obd2.vehicle.speed' "$marker" && \
                 grep -Fq 'standard_selection_scoped=true' "$marker" && \
                 grep -Eq '^recorded_samples=[1-9][0-9]*$' "$marker"; then
                passed=true
                break
              fi
            fi
            sleep 1
          done
          if test "$passed" != true; then
            echo 'Selected Standard OBD PIDs did not produce completed live samples.' >&2
            test -f "$marker" && cat "$marker" || true
            exit 1
          fi
          xcrun simctl terminate "$udid" com.github.The-First-Infiltrator.MBLINK || true

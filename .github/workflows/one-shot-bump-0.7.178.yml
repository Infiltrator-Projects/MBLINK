# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot bump MBLINK 0.7.178

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    if: github.event.head_commit.message == 'Stage MBLINK 0.7.178 bump'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Bump all product version surfaces and trigger release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          version = Path('VERSION')
          version.write_text('0.7.178\n')

          header = Path('include/mblink/version.h')
          text = header.read_text()
          old = '#define MBLINK_VERSION_STRING "0.7.177"'
          new = '#define MBLINK_VERSION_STRING "0.7.178"'
          if text.count(old) != 1:
              raise SystemExit('unexpected MBLINK version header state')
          header.write_text(text.replace(old, new, 1))

          project = Path('app/ios/MBLINK.xcodeproj/project.pbxproj')
          text = project.read_text()
          old = 'MARKETING_VERSION = 0.7.177;'
          new = 'MARKETING_VERSION = 0.7.178;'
          count = text.count(old)
          if count != 4:
              raise SystemExit(f'expected 4 Xcode marketing versions, found {count}')
          project.write_text(text.replace(old, new))
          PY
          test "$(tr -d '[:space:]' < VERSION)" = '0.7.178'
          grep -Fq '#define MBLINK_VERSION_STRING "0.7.178"' include/mblink/version.h
          test "$(grep -Fc 'MARKETING_VERSION = 0.7.178;' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 4
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add VERSION include/mblink/version.h app/ios/MBLINK.xcodeproj/project.pbxproj
          git commit -m 'Release 0.7.178: Mercedes cousin dashboard'
          git push origin HEAD:main

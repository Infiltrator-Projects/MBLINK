name: Temporary MBLINK alert localisation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-localise-alert.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/tmp-localise-alert.py
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-localise-alert.yml scripts/tmp-localise-alert.py
          git add app/ios/MBLINK/ConnectionViewModel.swift
          git commit -m "Localise iPhone connection chooser"
          git push --force origin HEAD:refs/heads/tmp-mblink-alert-language

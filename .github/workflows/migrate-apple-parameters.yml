# SPDX-License-Identifier: GPL-3.0-or-later
name: Diagnose Apple parameter migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-apple-parameters.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Run diagnostics and publish result
        shell: bash
        run: |
          set -uo pipefail
          result="docs/APPLE-PARAMETER-VALIDATION.txt"
          : > "$result"
          echo "validated_head=$GITHUB_SHA" >> "$result"

          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release >"$RUNNER_TEMP/cmake-configure.log" 2>&1
          configure_status=$?
          echo "cmake_configure=$configure_status" >> "$result"

          build_status=99
          ctest_status=99
          if [ "$configure_status" -eq 0 ]; then
            cmake --build build --parallel 2 >"$RUNNER_TEMP/cmake-build.log" 2>&1
            build_status=$?
            echo "cmake_build=$build_status" >> "$result"
            if [ "$build_status" -eq 0 ]; then
              ctest --test-dir build --output-on-failure >"$RUNNER_TEMP/ctest.log" 2>&1
              ctest_status=$?
            fi
          fi
          echo "ctest=$ctest_status" >> "$result"

          for configuration in Debug Release; do
            log="$RUNNER_TEMP/xcode-${configuration}.log"
            xcodebuild \
              -project app/ios/MBLINK.xcodeproj \
              -scheme MBLINK \
              -configuration "$configuration" \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO \
              build >"$log" 2>&1
            status=$?
            echo "xcode_${configuration}=$status" >> "$result"
            if [ "$status" -ne 0 ]; then
              echo "--- xcode ${configuration} diagnostics ---" >> "$result"
              grep -E '(^|: )(error:|warning:)|:[0-9]+:[0-9]+: (error|warning):' "$log" | tail -n 120 >> "$result" || true
            fi
          done

          if [ "$configure_status" -ne 0 ]; then
            echo "--- cmake configure tail ---" >> "$result"
            tail -n 120 "$RUNNER_TEMP/cmake-configure.log" >> "$result" || true
          elif [ "$build_status" -ne 0 ]; then
            echo "--- cmake build tail ---" >> "$result"
            tail -n 160 "$RUNNER_TEMP/cmake-build.log" >> "$result" || true
          elif [ "$ctest_status" -ne 0 ]; then
            echo "--- ctest output ---" >> "$result"
            tail -n 200 "$RUNNER_TEMP/ctest.log" >> "$result" || true
          fi

          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add "$result"
          git commit -m "ci: record Apple parameter validation diagnostics"
          git push origin HEAD:main

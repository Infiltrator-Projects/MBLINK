# SPDX-License-Identifier: GPL-3.0-or-later
name: HAL CI ownership anchor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add CI ownership anchor helper'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Document LINK-owned profile field
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('platform/apple/MBLinkDiagnosticsController.m')
          text = p.read_text()
          marker = '- (void)saveCurrentVehicleProfile\n{\n'
          if text.count(marker) != 1:
              raise SystemExit('saveCurrentVehicleProfile marker mismatch')
          replacement = marker + '    /* LINK owns liveResponders; MBLINK deliberately does not copy or rewrite it. */\n'
          p.write_text(text.replace(marker, replacement, 1))
          PY
          grep -Fq 'LINK owns liveResponders; MBLINK deliberately does not copy or rewrite it.' platform/apple/MBLinkDiagnosticsController.m
          ! grep -Fq '_cachedVehicleProfile[@"liveResponders"]' platform/apple/MBLinkDiagnosticsController.m
      - name: Publish ownership documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HAL migration'
          git config user.email 'actions@users.noreply.github.com'
          git add platform/apple/MBLinkDiagnosticsController.m
          git commit -m 'Document LINK-owned responder profile field'
          git push origin HEAD:main

# SPDX-License-Identifier: GPL-3.0-or-later
name: HAL quick wins

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply guarded quick fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "0.7.190"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one guarded match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "app/ios/MBLINK/MBLINKApp.swift",
              'Text("Open the controller/PID manager to choose the SAE PIDs actually advertised by each controller, including from a saved VIN profile while disconnected.")',
              'Text("Open PID Setup to choose vehicle-wide SAE PIDs and documented Mercedes data for each discovered controller, including from a saved VIN profile while disconnected.")',
          )

          replace_once(
              "app/ios/MBLINK/MBLINKApp.swift",
              '''Text(connection.isActive
                                 ? "Live polling will begin when the read-only module and fault census finishes."
                                 : "Connect to the vehicle to populate dashboard measurements.")''',
              '''Text(connection.isActive
                                 ? (connection.isReady
                                    ? "No selected dashboard values are available yet. Enable polling in PID Setup and choose supported dashboard measurements in Settings."
                                    : "Dashboard values will appear after the read-only module and fault census finishes and for measurements you have enabled.")
                                 : "Connect to the vehicle to populate dashboard measurements.")''',
          )

          replace_once(
              "tests/test_pid_architecture.py",
              '''MODEL = (ROOT / "app/ios/MBLINK/ConnectionViewModel.swift").read_text(
              encoding="utf-8"
          )
          CONTRACT =''',
              '''MODEL = (ROOT / "app/ios/MBLINK/ConnectionViewModel.swift").read_text(
              encoding="utf-8"
          )
          CONTROLLER = (ROOT / "platform/apple/MBLinkDiagnosticsController.m").read_text(
              encoding="utf-8"
          )
          CONTRACT =''',
          )

          replace_once(
              "tests/test_pid_architecture.py",
              '''require(
              "Mercedes choices remain VIN-and-module scoped" in CONTRACT_WORDS,
              "the canonical architecture contract must state Mercedes selection scope",
          )

          print("MBLINK PID/module architecture verified")''',
              '''require(
              "Mercedes choices remain VIN-and-module scoped" in CONTRACT_WORDS,
              "the canonical architecture contract must state Mercedes selection scope",
          )
          require(
              "controller.mercedesModuleSnapshots.map" in MODEL,
              "every retained Mercedes/OBD module snapshot must remain visible to the Swift model",
          )
          require(
              "for (responderKey, pids) in responderPIDs" in MODEL
              and "where !seenResponderKeys.contains(responderKey)" in MODEL,
              "saved VIN profiles must retain standards responders even before Mercedes identity exists",
          )
          require(
              "for (uint32_t responseID = UINT32_C(0x7e8);" in CONTROLLER
              and "responseID <= UINT32_C(0x7ef);" in CONTROLLER
              and "Live responder observed · module fault state not established" in CONTROLLER,
              "live 0x7E8-0x7EF OBD responders must remain in the module map when manufacturer probing is quiet",
          )
          require(
              "controller.isActive ? activeVehicleVIN : selectedVehicleVIN" in MODEL,
              "live VIN must remain authoritative over a previously selected offline profile",
          )
          require(
              "let modules = vehicles[vin] as? [String: Any]" in MODEL
              and "modules[moduleID] = Array(selection).sorted()" in MODEL
              and "vehicles[vin] = modules" in MODEL,
              "Mercedes polling selections must remain scoped by VIN and module",
          )
          require(
              "Unknown or unresolved modules may still appear in the module list." in CONTRACT_WORDS
              and "They must not be assigned invented semantics." in CONTRACT_WORDS,
              "unknown modules must remain visible without invented PID meanings",
          )
          require(
              "SAE PIDs actually advertised by each controller" not in APP
              and "vehicle-wide SAE PIDs and documented Mercedes data" in APP,
              "module-screen PID Setup wording must match the vehicle-wide SAE architecture",
          )
          require(
              "Live polling will begin when the read-only module and fault census finishes." not in APP
              and "No selected dashboard values are available yet." in APP,
              "dashboard empty-state copy must not imply polling starts automatically",
          )

          print("MBLINK PID/module architecture verified")''',
          )

          version_header = Path("include/mblink/version.h")
          header_text = version_header.read_text(encoding="utf-8")
          if header_text.count('MBLINK_VERSION_STRING "0.7.190"') != 1:
              raise SystemExit("version.h guard failed")
          version_header.write_text(
              header_text.replace('MBLINK_VERSION_STRING "0.7.190"', 'MBLINK_VERSION_STRING "0.7.191"'),
              encoding="utf-8",
          )

          project = Path("app/ios/MBLINK.xcodeproj/project.pbxproj")
          project_text = project.read_text(encoding="utf-8")
          old = "MARKETING_VERSION = 0.7.190;"
          if project_text.count(old) != 4:
              raise SystemExit(f"Xcode marketing-version guard failed: {project_text.count(old)} matches")
          project.write_text(project_text.replace(old, "MARKETING_VERSION = 0.7.191;"), encoding="utf-8")

          Path("VERSION").write_text("0.7.191\n", encoding="utf-8")
          PY

          python3 tests/test_pid_architecture.py
          git diff --check
          grep -Fq '#define MBLINK_VERSION_STRING "0.7.191"' include/mblink/version.h
          test "$(grep -Fc 'MARKETING_VERSION = 0.7.191;' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 4
          test "$(tr -d '[:space:]' < VERSION)" = "0.7.191"

      - name: Commit quick fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ios/MBLINK/MBLINKApp.swift tests/test_pid_architecture.py VERSION include/mblink/version.h app/ios/MBLINK.xcodeproj/project.pbxproj
          git commit -m "Fix quick PID UI and regression guards"
          git push origin HEAD:main

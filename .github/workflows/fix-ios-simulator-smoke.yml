# SPDX-License-Identifier: GPL-3.0-or-later
name: Fix iOS simulator smoke

on:
  push:
    paths:
      - '.github/workflows/fix-ios-simulator-smoke.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Repair launch readiness gate and clean helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path(".github/workflows/ci.yml"); s=p.read_text(); old="          xcrun simctl boot \"$udid\" >/dev/null 2>&1 || true\n          booted=false\n          for attempt in $(seq 1 90); do\n            if xcrun simctl list devices | grep -F \"$udid\" | grep -Fq \"(Booted)\"; then\n              booted=true\n              break\n            fi\n            sleep 1\n          done\n          test \"$booted\" = true\n"; new="          xcrun simctl boot \"$udid\" >/dev/null 2>&1 || true\n          # Device state can report Booted before SpringBoard and app services are launch-ready.\n          xcrun simctl bootstatus \"$udid\" -b\n"; assert old in s, "expected simulator boot gate not found"; p.write_text(s.replace(old,new,1))'
          rm -f .github/workflows/diagnose-simulated-flow.yml .github/workflows/fix-ios-simulator-smoke.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          git diff --cached --check
          git commit -m 'Fix iOS simulator diagnostic smoke readiness race'
          git push origin HEAD:main

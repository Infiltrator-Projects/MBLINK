name: HAL fix saved responder bridge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hal-fix-profile-responders-call.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix saved responder Swift bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/ios/MBLINK/ConnectionViewModel.swift')
          s = p.read_text()
          old = 'for responder in LinkVehicleProfileStandardResponders(profile as NSDictionary) {'
          new = 'for responder in LinkVehicleProfileStandardResponders(profile) {'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one obsolete NSDictionary responder call, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          grep -Fq 'for responder in LinkVehicleProfileStandardResponders(profile) {' app/ios/MBLINK/ConnectionViewModel.swift
          rm -f apple-ci-error-extract.txt

      - name: Publish source fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add -A app/ios/MBLINK/ConnectionViewModel.swift apple-ci-error-extract.txt .github/workflows/hal-fix-profile-responders-call.yml
          git rm .github/workflows/hal-fix-profile-responders-call.yml
          git diff --cached --check
          git commit -m "Fix Apple saved responder profile bridge"
          git push origin HEAD:main

# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply exact vehicle state fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: run exact vehicle state fix source-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply source patch only
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_vehicle_state_fix.py
          git restore --source=HEAD -- .github/workflows/ci.yml
          git restore --source=HEAD -- .github/workflows/apply-vehicle-state-fix.yml
          git restore --source=HEAD -- .github/scripts/apply_vehicle_state_fix.py
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add app/ios/MBLINK/ConnectionViewModel.swift
          git diff --cached --check
          git commit -m 'iOS: make current vehicle state deterministic'
          git push origin HEAD:main

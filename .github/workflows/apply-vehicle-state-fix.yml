# SPDX-License-Identifier: GPL-3.0-or-later
name: Apply exact vehicle state fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MBLINK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply exact state machine
        run: python3 .github/scripts/apply_vehicle_state_fix.py
      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --check
          git commit -m 'iOS: make current vehicle state deterministic'
          git push origin HEAD:main

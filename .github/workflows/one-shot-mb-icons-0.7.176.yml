name: One-shot MBLINK Mercedes navigation icons 0.7.176

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-mb-icons-0.7.176.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          submodules: false
      - name: Wire Mercedes navigation artwork through LINK 0.15.2
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init src/link
          git -C src/link fetch origin 37a1289b50539705454fd2a4b8e7a6ee80ecd116
          git -C src/link checkout --detach 37a1289b50539705454fd2a4b8e7a6ee80ecd116
          python3 - <<'PY'
          from pathlib import Path

          icon_names = [
              'nav-vehicle.png',
              'nav-errors.png',
              'nav-table.png',
              'nav-dashboard.png',
              'nav-graph.png',
              'nav-tests.png',
              'nav-services.png',
              'nav-log.png',
              'nav-settings.png',
          ]
          for name in icon_names:
              p = Path('app/linux/assets/mercedes-adapter') / name
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f'Missing navigation artwork: {p}')

          resources = Path('app/linux/mblink.gresource.xml')
          s = resources.read_text()
          marker = '    <file alias="mblink-emblem.png">assets/mblink-emblem.png</file>\n'
          if s.count(marker) != 1:
              raise SystemExit('Unexpected MBLINK gresource layout')
          asset_lines = ''.join(
              f'    <file alias="{name}">assets/mercedes-adapter/{name}</file>\n'
              for name in icon_names)
          resources.write_text(s.replace(marker, marker + asset_lines, 1))

          main = Path('app/linux/main.c')
          s = main.read_text()
          callback = (
              '\nstatic const char *mblink_navigation_icon_resource(size_t section, void *opaque)\n'
              '{\n'
              '    (void)opaque;\n'
              '    switch ((LinkWorkspaceSection)section) {\n'
              '    case LINK_WORKSPACE_VEHICLE:\n'
              '        return "/com/github/Infiltrator-Projects/MBLINK/nav-vehicle.png";\n'
              '    case LINK_WORKSPACE_FAULTS:\n'
              '        return "/com/github/Infiltrator-Projects/MBLINK/nav-errors.png";\n'
              '    case LINK_WORKSPACE_TABLE:\n'
              '        return "/com/github/Infiltrator-Projects/MBLINK/nav-table.png";\n'
              '    case LINK_WORKSPACE_DASHBOARD:\n'
              '        return "/com/github/Infiltrator-Projects/MBLINK/nav-dashboard.png";\n'
              '    case LINK_WORKSPACE_GRAPHS:\n'
              '        return "/com/github/Infiltrator-Projects/MBLINK/nav-graph.png";\n'
              '    case LINK_WORKSPACE_TESTS:\n'
              '        return "/com/github/Infiltrator-Projects/MBLINK/nav-tests.png";\n'
              '    case LINK_WORKSPACE_SERVICES:\n'
              '        return "/com/github/Infiltrator-Projects/MBLINK/nav-services.png";\n'
              '    case LINK_WORKSPACE_LOG:\n'
              '        return "/com/github/Infiltrator-Projects/MBLINK/nav-log.png";\n'
              '    case LINK_WORKSPACE_SETTINGS:\n'
              '        return "/com/github/Infiltrator-Projects/MBLINK/nav-settings.png";\n'
              '    default:\n'
              '        return NULL;\n'
              '    }\n'
              '}\n\n')
          needle = 'int main(int argc, char **argv)\n{'
          if s.count(needle) != 1:
              raise SystemExit('Unexpected MBLINK Linux main entry point')
          s = s.replace(needle, callback + needle, 1)
          desc = '    descriptor.emblem_resource = "/com/github/Infiltrator-Projects/MBLINK/mblink-emblem.png";\n'
          if s.count(desc) != 1:
              raise SystemExit('Unexpected MBLINK GTK descriptor')
          s = s.replace(
              desc,
              desc + '    descriptor.navigation_icon_resource = mblink_navigation_icon_resource;\n',
              1)
          main.write_text(s)

          version = Path('VERSION')
          if version.read_text().strip() != '0.7.175':
              raise SystemExit(f'Unexpected VERSION: {version.read_text()!r}')
          version.write_text('0.7.176\n')

          vh = Path('include/mblink/version.h')
          s = vh.read_text()
          old_version = '#define MBLINK_VERSION_STRING "0.7.175"'
          if s.count(old_version) != 1:
              raise SystemExit('Unexpected MBLINK version header')
          vh.write_text(s.replace(
              old_version,
              '#define MBLINK_VERSION_STRING "0.7.176"',
              1))

          project = Path('app/ios/MBLINK.xcodeproj/project.pbxproj')
          s = project.read_text()
          if s.count('MARKETING_VERSION = 0.7.175;') != 4:
              raise SystemExit('Unexpected MARKETING_VERSION state')
          s = s.replace(
              'MARKETING_VERSION = 0.7.175;',
              'MARKETING_VERSION = 0.7.176;')
          old_link = '756f736cbbbbcbeaaae1b23f3f7c648ee1afb3e9'
          new_link = '37a1289b50539705454fd2a4b8e7a6ee80ecd116'
          if s.count(old_link) != 2:
              raise SystemExit(
                  f'Expected 2 Xcode LINK pins, found {s.count(old_link)}')
          project.write_text(s.replace(old_link, new_link))
          PY
          git rm .github/workflows/one-shot-mb-icons-0.7.176.yml
          git diff --check
          test "$(tr -d '[:space:]' < VERSION)" = '0.7.176'
          test "$(git -C src/link rev-parse HEAD)" = '37a1289b50539705454fd2a4b8e7a6ee80ecd116'
          grep -Fq 'navigation_icon_resource = mblink_navigation_icon_resource' app/linux/main.c
          grep -Fq 'nav-vehicle.png' app/linux/mblink.gresource.xml
          test "$(grep -Fc 'MARKETING_VERSION = 0.7.176;' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 4
          test "$(grep -Fc '37a1289b50539705454fd2a4b8e7a6ee80ecd116' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release 0.7.176: add Mercedes Adapter navigation icons'
          git push origin HEAD:main

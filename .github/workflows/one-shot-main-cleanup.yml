# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot MBLINK main cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-main-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Align MBLINK with fixed LINK and remove obsolete branches
        shell: bash
        env:
          OLD_LINK: 5de5299cfb8ddd680cc0ca07026e091d795f9424
          NEW_LINK: 7df2298c80a9ad329f7cb91b3f617fe3acc93a2d
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git -C src/link fetch origin "$NEW_LINK"
          git -C src/link checkout --detach "$NEW_LINK"
          sed -i "s/$OLD_LINK/$NEW_LINK/g" app/ios/MBLINK.xcodeproj/project.pbxproj

          git add src/link app/ios/MBLINK.xcodeproj/project.pbxproj
          git rm .github/workflows/one-shot-main-cleanup.yml
          git commit -m "fix: pin verified LINK simulator correction"
          git push origin HEAD:main

          git push origin --delete \
            fix/simulated-diagnostic-flow \
            fix/simulator-link-revision-metadata \
            release/0.7.168

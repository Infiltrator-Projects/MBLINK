name: One-shot format quick UI cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-format-quick-ui.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Normalize quick-cleanup Swift indentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/ios/MBLINK/MBLINKApp.swift')
          s = p.read_text()

          start = s.index('    private var primaryGrid: some View {')
          support = s.index('    private var supportingTools: some View {', start)
          primary = '\n'.join([
              '    private var primaryGrid: some View {',
              '        LinkDiagnosticGrid {',
              '            LinkTaskTile(.vehicle) { MBVehicleView() }',
              '            LinkTaskTile(.errors) { MBFaultsView() }',
              '            LinkTaskTile(.dashboard) { MBDashboardView() }',
              '            LinkTaskTile(.table) { MBDataTableView() }',
              '            LinkTaskTile(.graph) { MBGraphsView() }',
              '        }',
              '    }',
              '',
          ]) + '\n'
          s = s[:start] + primary + s[support:]

          g0 = s.index('                                    if let minimum = parameter.history.min(),')
          g1 = s.index('                                    if parameter.history.count > 1 {', g0)
          stats = '\n'.join([
              '                                    if let minimum = parameter.history.min(),',
              '                                       let maximum = parameter.history.max() {',
              '                                        HStack(spacing: 14) {',
              '                                            Text("MIN \\(minimum.formatted()) \\(parameter.suffix)")',
              '                                            Text("MAX \\(maximum.formatted()) \\(parameter.suffix)")',
              '                                            Spacer()',
              '                                            Text("\\(parameter.history.count) samples")',
              '                                        }',
              '                                        .font(MBTypography.caption2Bold)',
              '                                        .foregroundStyle(MBBrand.muted)',
              '                                    }',
          ]) + '\n'
          s = s[:g0] + stats + s[g1:]

          p.write_text(s)
          PY
          git diff --check
          grep -Fq '        LinkDiagnosticGrid {' app/ios/MBLINK/MBLINKApp.swift
          grep -Fq '                                       let maximum = parameter.history.max() {' app/ios/MBLINK/MBLINKApp.swift
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/ios/MBLINK/MBLINKApp.swift
          git commit -m 'Finish quick UI cleanup formatting'
          git push origin HEAD:main

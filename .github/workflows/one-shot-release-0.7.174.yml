# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot MBLINK 0.7.174 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-release-0.7.174.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump and release MBLINK 0.7.174
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = '0.7.173'
          new = '0.7.174'

          version = Path('VERSION')
          if version.read_text().strip() != old:
              raise SystemExit(f'Unexpected VERSION: {version.read_text()!r}')
          version.write_text(new + '\n')

          header = Path('include/mblink/version.h')
          s = header.read_text()
          needle = f'#define MBLINK_VERSION_STRING "{old}"'
          if s.count(needle) != 1:
              raise SystemExit('Unexpected MBLINK version header state')
          header.write_text(s.replace(needle, f'#define MBLINK_VERSION_STRING "{new}"', 1))

          project = Path('app/ios/MBLINK.xcodeproj/project.pbxproj')
          s = project.read_text()
          needle = f'MARKETING_VERSION = {old};'
          count = s.count(needle)
          if count != 4:
              raise SystemExit(f'Expected 4 MARKETING_VERSION entries, found {count}')
          project.write_text(s.replace(needle, f'MARKETING_VERSION = {new};'))
          PY
          grep -Fq '.link-nav-row:selected { background: rgba(32,187,211,0.16)' app/linux/style.c
          grep -Fq '.link-status-online { background: rgba(32,187,211,0.12)' app/linux/style.c
          grep -Fq '.link-link-button { background: #58d7e7;' app/linux/style.c
          grep -Fq '.link-nav-row:nth-child(6) { margin-top: 14px; }' app/linux/style.c
          git rm .github/workflows/one-shot-release-0.7.174.yml
          git diff --check
          test "$(tr -d '[:space:]' < VERSION)" = '0.7.174'
          grep -Fq '#define MBLINK_VERSION_STRING "0.7.174"' include/mblink/version.h
          test "$(grep -Fc 'MARKETING_VERSION = 0.7.174;' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION include/mblink/version.h app/ios/MBLINK.xcodeproj/project.pbxproj .github/workflows/one-shot-release-0.7.174.yml
          git commit -m 'Release 0.7.174: mirror UI polish on Linux'
          git push origin HEAD:main

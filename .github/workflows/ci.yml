# SPDX-License-Identifier: GPL-3.0-or-later
name: MBLink CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mblink-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight / repository invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Cheap fail-fast checks
        run: python3 scripts/preflight.py

      - name: Stable PID architecture contract
        run: python3 tests/test_pid_architecture.py

      - id: meta
        name: Read product version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  portable-core:
    name: Linux / C11
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build --build-config Release --output-on-failure
      - run: python3 tests/test_whisper_recover.py

      - name: Seal qualified core candidate
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          out="$RUNNER_TEMP/qualified-core"
          source_root=$(mktemp -d)
          staging="$source_root/MBLink-$version"
          trap 'rm -rf "$source_root"' EXIT
          mkdir -p "$out" "$staging"
          git archive HEAD | tar -x -C "$staging"
          export ARCHIVE_ROOT="$staging"
          git submodule foreach --recursive 'mkdir -p "$ARCHIVE_ROOT/$displaypath"; git archive HEAD | tar -x -C "$ARCHIVE_ROOT/$displaypath"'
          (cd "$source_root" && zip -qry "$out/MBLink-$version-source.zip" "MBLink-$version")
          unzip -tq "$out/MBLink-$version-source.zip"

          printf '%s\n' "$GITHUB_SHA" > "$out/SOURCE_COMMIT-core"
          (cd "$out" && sha256sum MBLink-* > SHA256SUMS-core)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-core
          path: ${{ runner.temp }}/qualified-core/*
          if-no-files-found: error
          retention-days: 30

  sanitizers:
    name: Linux / ASan + UBSan
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DMBLINK_ENABLE_SANITIZERS=ON
      - run: cmake --build build-sanitized --parallel
      - run: ctest --test-dir build-sanitized --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  linux-app:
    name: Package Linux release
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake dpkg-dev libgtk-4-dev libbluetooth-dev \
            libusb-1.0-0-dev pkg-config xvfb xauth

      - name: Build and verify Linux app
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DMBLINK_BUILD_LINUX_APP=ON \
            -DMBLINK_BUILD_PROFILE=generic \
            -DBUILD_TESTING=OFF
          cmake --build build-linux --parallel
          ldd ./build-linux/mblink-linux | grep -F 'libusb-1.0.so' >/dev/null
          grep -aF 'OP2:Tactrix OpenPort 2.0' ./build-linux/mblink-linux >/dev/null
          ./build-linux/mblink-linux --ui-settings-verify
          GTK_A11Y=none timeout 60s xvfb-run -a \
            ./build-linux/mblink-linux --replay-c207-verify
          GTK_A11Y=none G_DEBUG=fatal-warnings timeout 60s xvfb-run -a \
            ./build-linux/mblink-linux --ui-navigation-stress

      - name: Sanitized GTK navigation soak
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-linux-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DMBLINK_BUILD_LINUX_APP=ON \
            -DMBLINK_ENABLE_SANITIZERS=ON \
            -DMBLINK_BUILD_PROFILE=generic \
            -DBUILD_TESTING=OFF
          cmake --build build-linux-sanitized --parallel --target mblink-linux
          GTK_A11Y=none \
            ASAN_OPTIONS=detect_leaks=0:halt_on_error=1:abort_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 90s xvfb-run -a ./build-linux-sanitized/mblink-linux \
            --ui-navigation-stress

      - name: Package DEB and native RUN
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/cpack"
          cpack --config build-linux/CPackConfig.cmake -G DEB -B "$RUNNER_TEMP/cpack"
          deb_src="$(find "$RUNNER_TEMP/cpack" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb_src"
          dpkg-deb -c "$deb_src" | grep -F './usr/lib/udev/rules.d/60-mblink-openport2.rules' >/dev/null
          dpkg-deb -c "$deb_src" | grep -F './usr/share/doc/mblink/copyright' >/dev/null
          dpkg-deb -f "$deb_src" Depends | grep -E '(^|, )libusb-1\.0-0([ (]|,|$)' >/dev/null
          install -m 0644 "$deb_src" "$RUNNER_TEMP/release/MBLink-${VERSION}-linux-amd64.deb"

          scripts/build-native-installer.sh "$RUNNER_TEMP/release/MBLink-${VERSION}-linux-native.run"
          "$RUNNER_TEMP/release/MBLink-${VERSION}-linux-native.run" --help >/dev/null
          native_deb="$RUNNER_TEMP/mblink_${VERSION}+native1_amd64.deb"
          "$RUNNER_TEMP/release/MBLink-${VERSION}-linux-native.run" \
            --build-only --output "$native_deb"
          test "$(dpkg-deb -f "$native_deb" Package)" = mblink
          test "$(dpkg-deb -f "$native_deb" Version)" = "${VERSION}+native1"
          dpkg-deb -c "$native_deb" | grep -F './usr/lib/udev/rules.d/60-mblink-openport2.rules' >/dev/null
          dpkg-deb -f "$native_deb" Depends | grep -E '(^|, )libusb-1\.0-0([ (]|,|$)' >/dev/null

      - name: Seal the qualified Linux packages
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/release/SOURCE_COMMIT-linux"
          (cd "$RUNNER_TEMP/release" && sha256sum MBLink-* > SHA256SUMS-linux)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualified-linux
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  windows:
    name: Package Windows release
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Build MBLink Discover
        shell: powershell
        run: |
          cmake -S . -B build-win32 -A Win32 -DCMAKE_BUILD_TYPE=Release `
            -DMBLINK_BUILD_WINDOWS_DISCOVER=ON -DBUILD_TESTING=OFF
          cmake --build build-win32 --config Release --target mblink-discover --parallel

      - name: Verify and stage executable
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe is unavailable' }
          $dumpbin = (& $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find 'VC\Tools\MSVC\**\bin\Hostx64\x86\dumpbin.exe' | Select-Object -First 1)
          if (-not $dumpbin -or -not (Test-Path $dumpbin)) { throw 'Unable to locate dumpbin.exe' }

          $exe = (Resolve-Path 'build-win32/Release/mblink-discover.exe').Path
          $deps = (& $dumpbin /DEPENDENTS $exe | Out-String)
          foreach ($dll in @('VCRUNTIME140.dll','VCRUNTIME140_1.dll','MSVCP140.dll','ucrtbased.dll')) {
            if ($deps -match [regex]::Escape($dll)) {
              throw "Unexpected dynamic runtime dependency: $dll"
            }
          }
          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductVersion -notlike '${{ needs.preflight.outputs.version }}*') {
            throw "Wrong ProductVersion: $($info.ProductVersion)"
          }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) { throw 'Executable has no associated icon' }
          $icon.Dispose()

          & 'src/link/platform/windows/smoke-launch.ps1' `
            -Executable $exe -ExpectedTitle 'MBLink Discover'

          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item $exe "release-assets/MBLink-${{ needs.preflight.outputs.version }}-windows-discover.exe"

      - name: Seal the qualified Windows executable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'MBLink-${{ needs.preflight.outputs.version }}-windows-discover.exe'
          $hash = (Get-FileHash "release-assets/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content release-assets/SHA256SUMS-windows -Encoding ascii -NoNewline
          $env:GITHUB_SHA | Set-Content release-assets/SOURCE_COMMIT-windows -Encoding ascii -NoNewline

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualified-windows
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  apple-ios:
    name: Apple / C11 + iOS simulator
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build and test portable C11 core on macOS
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build build-macos --config Release --parallel
          ctest --test-dir build-macos --build-config Release --output-on-failure

      - name: Verify manufacturer freshness, retained startup data and CSV evidence
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang -fobjc-arc -Wall -Wextra -Werror \
            -Iinclude -Isrc/link/include -Isrc/link/src/infiltratr-common/include \
            tests/apple/ManufacturerSnapshotRegression.m -framework Foundation \
            -o "$RUNNER_TEMP/mblink-manufacturer-snapshot-test"
          "$RUNNER_TEMP/mblink-manufacturer-snapshot-test"

      - name: Build iOS simulator Debug
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          xcodebuild -project app/ios/MBLINK.xcodeproj -scheme MBLINK \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived-simulator-Debug" \
            CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$VERSION" \
            MBLINK_SOURCE_REVISION="$GITHUB_SHA" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) MBLINK_CI_SIMULATED_FLOW' build

      - name: Launch iOS simulated diagnostic flow
        shell: bash
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/derived-simulator-Debug"
          udid="$(xcrun simctl list devices available \
            | sed -nE 's/.*iPhone[^()]*\(([0-9A-Fa-f-]{36})\).*/\1/p' \
            | head -n1)"
          test -n "$udid"
          xcrun simctl boot "$udid" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$udid" -b
          app="$derived/Build/Products/Debug-iphonesimulator/MBLINK.app"
          test -d "$app"
          xcrun simctl install "$udid" "$app"
          launch_output="$(SIMCTL_CHILD_MBLINK_CI_SIMULATED_FLOW=1 \
            SIMCTL_CHILD_MBLINK_CI_SIMULATED_POLLING=1 \
            SIMCTL_CHILD_MBLINK_CI_PERSIST_SIMULATED_PROFILE=1 \
            xcrun simctl launch "$udid" com.github.The-First-Infiltrator.MBLINK)"
          printf '%s\n' "$launch_output"
          printf '%s\n' "$launch_output" | grep -Fq 'com.github.The-First-Infiltrator.MBLINK'

          data_container="$(xcrun simctl get_app_container "$udid" com.github.The-First-Infiltrator.MBLINK data)"
          marker="$data_container/Documents/mblink-ci-simulated-flow.ok"
          snapshot="$RUNNER_TEMP/mblink-ci-simulated-flow.snapshot"
          flow_ready=false
          for attempt in $(seq 1 60); do
            if test -f "$marker"; then
              marker_snapshot="$(cat "$marker")"
              printf '%s\n' "$marker_snapshot" > "$snapshot"
              cat "$snapshot"
              if grep -Fq 'state=ready' "$snapshot" && \
                 grep -Fq 'vin=WDD2073022F123456' "$snapshot" && \
                 grep -Fq 'fault_status=Complete ·' "$snapshot" && \
                 grep -Fq 'stored_codes=P0401,P0101' "$snapshot" && \
                 grep -Fq 'standard_selection_count=3' "$snapshot" && \
                 grep -Fq 'standard_selection_keys=obd2.engine.rpm,obd2.fuel.tank_level,obd2.vehicle.speed' "$snapshot" && \
                 grep -Fq 'standard_selection_scoped=true' "$snapshot" && \
                 grep -Fq 'unavailable_fuel_observed=true' "$snapshot" && \
                 grep -Fq 'live_polling_verified=true' "$snapshot" && \
                 grep -Fq 'live_profile_verified=true' "$snapshot" && \
                 grep -Fq 'module_count=4' "$snapshot" && \
                 grep -Eq '^transmission_catalogue_count=[1-9][0-9]*$' "$snapshot" && \
                 grep -Eq '^esp_catalogue_count=[0-9]+$' "$snapshot" && \
                 grep -Eq '^orc_catalogue_count=[0-9]+$' "$snapshot" && \
                 grep -Fq 'uds_service_catalogue_count=27' "$snapshot" && \
                 grep -Fq 'uds_dtc_report_catalogue_count=27' "$snapshot" && \
                 grep -Eq '^recorded_samples=[1-9][0-9]*$' "$snapshot"; then
                flow_ready=true
                break
              fi
              grep -Fq 'state=failed' "$snapshot" && break || true
            fi
            sleep 1
          done
          if test "$flow_ready" != true; then
            echo '::error::Simulated diagnostic flow did not reach live-ready state.'
            test ! -f "$marker" || cat "$marker"
            xcrun simctl spawn "$udid" log show --last 2m --style compact \
              --predicate 'process == "MBLink" AND (messageType == error OR messageType == fault)' || true
            exit 1
          fi
          xcrun simctl terminate "$udid" com.github.The-First-Infiltrator.MBLINK

          saved_marker="$data_container/Documents/mblink-ci-saved-pid-profile.ok"
          saved_snapshot_file="$RUNNER_TEMP/mblink-ci-saved-pid-profile.snapshot"
          rm -f "$saved_marker"
          SIMCTL_CHILD_MBLINK_CI_SAVED_PID_RESTORE=1 \
            xcrun simctl launch "$udid" com.github.The-First-Infiltrator.MBLINK
          saved_ready=false
          for attempt in $(seq 1 20); do
            if test -f "$saved_marker"; then
              saved_snapshot="$(cat "$saved_marker")"
              printf '%s\n' "$saved_snapshot" > "$saved_snapshot_file"
              cat "$saved_snapshot_file"
              if grep -Fq 'state=ready' "$saved_snapshot_file" && \
                 grep -Fq 'active=false' "$saved_snapshot_file" && \
                 grep -Fq 'selected_vin=WDD2073022F123456' "$saved_snapshot_file" && \
                 grep -Fq 'profile_module_count=4' "$saved_snapshot_file" && \
                 grep -Fq 'display_selection_verified=true' "$saved_snapshot_file" && \
                 grep -Eq '^transmission_catalogue_count=[1-9][0-9]*$' "$saved_snapshot_file" && \
                 grep -Eq '^esp_catalogue_count=[0-9]+$' "$saved_snapshot_file" && \
                 grep -Eq '^orc_catalogue_count=[0-9]+$' "$saved_snapshot_file"; then
                saved_ready=true
                break
              fi
            fi
            sleep 1
          done
          if test "$saved_ready" != true; then
            echo '::error::Saved C207 PID catalogues did not survive a cold app launch.'
            test ! -f "$saved_marker" || cat "$saved_marker"
            exit 1
          fi
          xcrun simctl terminate "$udid" com.github.The-First-Infiltrator.MBLINK
      - name: Build unsigned device IPA
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/derived-device"
          xcodebuild -project app/ios/MBLINK.xcodeproj -scheme MBLINK \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            MARKETING_VERSION="$VERSION" MBLINK_SOURCE_REVISION="$REVISION" build
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$derived/Build/Products/Release-iphoneos/MBLINK.app" \
            "$RUNNER_TEMP/package/Payload/MBLINK.app"
          (cd "$RUNNER_TEMP/package" && \
            zip -qry "$RUNNER_TEMP/MBLink-${VERSION}-unsigned.ipa" Payload)
          unzip -tq "$RUNNER_TEMP/MBLink-${VERSION}-unsigned.ipa"

      - name: Seal the qualified iPhone package
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/qualified-iphone"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/MBLink-${{ needs.preflight.outputs.version }}-unsigned.ipa" "$out/"
          printf '%s\n' "$GITHUB_SHA" > "$out/SOURCE_COMMIT-iphone"
          (cd "$out" && shasum -a 256 MBLink-* > SHA256SUMS-iphone)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-iphone
          path: ${{ runner.temp }}/qualified-iphone/*
          if-no-files-found: error
          retention-days: 30

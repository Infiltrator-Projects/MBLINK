# SPDX-License-Identifier: GPL-3.0-or-later
name: MBLINK CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-core:
    name: linux-native / C11
    runs-on: linux-native
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Verify dependency ownership and exact recursive gitlinks
        shell: bash
        run: |
          set -euo pipefail
          gitlinks="$(git ls-files --stage | awk '$1 == "160000" { print $4 }' | sort)"
          test "$gitlinks" = "src/link"
          test ! -e src/infiltratr-common
          status="$(git submodule status --recursive)"
          if grep -Eq '^[+-U]' <<<"$status"; then
            printf '%s\n' "$status" >&2
            echo 'Recursive submodule checkout does not match the committed gitlinks.' >&2
            exit 1
          fi
          test -f src/link/VERSION
          test -f src/link/src/infiltratr-common/VERSION
          grep -q 'src/uds/uds_services.c' src/link/CMakeLists.txt
          grep -q 'link_uds_standard_service_count' src/link/src/uds/uds_services.c
          grep -Fq '#include "../link/src/uds/uds_services.c"' src/uds/uds.c
          grep -q 'link_elm327_parser_feed' src/link/src/elm327/elm327.c
          grep -q 'link_elm327_can_decode_pdu' src/link/src/elm327/can.c
          grep -q 'link_elm327_session_begin' src/link/src/elm327/session.c
          grep -q 'link_obd2_decode_live_pid' src/link/src/obd2/obd2.c
          grep -q 'link_uds_decode_response' src/link/src/uds/uds.c
          grep -q 'link_diagnostic_flow_next_action' src/link/src/core/diagnostic_flow.c
          grep -q 'return link_elm327_parser_feed' src/elm327/elm327.c
          grep -q 'return link_elm327_can_decode_pdu' src/elm327/can.c
          grep -q 'return link_elm327_session_begin' src/elm327/session.c
          grep -q 'link_diagnostic_flow_accept_response' src/link/platform/apple/LinkDiagnosticsController.m
          grep -q 'LinkDiagnosticsController' platform/apple/MBLinkDiagnosticsController.m
          grep -q 'mblink_mercedes_kwp_dtc_find' platform/apple/MBLinkDiagnosticsController.m
          grep -q 'link_diagnostic_flow_resume_after_manufacturer' src/link/platform/apple/LinkDiagnosticsController.m
          grep -q 'link_telemetry_recorder_continue' src/link/platform/apple/LinkDiagnosticsController.m
          grep -Fq 'LinkProbeTimeoutSeconds = 5.0' src/link/platform/apple/LinkBLETransport.m
          grep -q 'src/core/diagnostic_flow.c' src/core/mblink.c
          ! grep -q 'MBLinkDiagnosticsPhase' platform/apple/MBLinkDiagnosticsController.m
          test "$(grep -Fc 'if ([self beginCachedVehicleProfileRefresh]) return;' platform/apple/MBLinkDiagnosticsController.m)" -ge 2
          grep -Fq 'standard OBD VIN %@ retained' platform/apple/MBLinkDiagnosticsController.m
          grep -Fq 'link_obd2_is_negative_response' src/link/src/core/diagnostic_flow.c
          test "$(wc -c < src/obd2/obd2.c)" -lt 1024
          test "$(wc -c < src/uds/uds.c)" -lt 2048
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: Local Linux / ASan + UBSan
    runs-on: linux-native
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DMBLINK_ENABLE_SANITIZERS=ON
      - run: cmake --build build-sanitized --parallel
      - run: ctest --test-dir build-sanitized --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  linux-app:
    name: Linux / GTK4 app
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake dpkg-dev libgtk-4-dev libbluetooth-dev libusb-1.0-0-dev pkg-config xvfb xauth
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DMBLINK_BUILD_LINUX_APP=ON -DMBLINK_BUILD_PROFILE=generic -DBUILD_TESTING=OFF
      - run: cmake --build build-linux --parallel
      - name: Verify native Tactrix provider is linked
        shell: bash
        run: |
          set -euo pipefail
          ldd ./build-linux/mblink-linux | grep -F 'libusb-1.0.so' >/dev/null
          grep -aF 'OP2:Tactrix OpenPort 2.0' ./build-linux/mblink-linux >/dev/null
      - name: Verify independent display preferences
        shell: bash
        run: |
          set -euo pipefail
          ./build-linux/mblink-linux --ui-settings-verify | tee "$RUNNER_TEMP/settings-verify.log"
          grep -Fq 'MBLINK settings verified: 8 independent measurement preferences' "$RUNNER_TEMP/settings-verify.log"

      - name: Verify offline C207 replay reaches visible ORC fault
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/c207-replay.log"
          timeout 20s xvfb-run -a ./build-linux/mblink-linux --replay-c207-verify | tee "$log"
          grep -Fq 'MBLINK replay verified: ORC seatbelt/airbag fault B00013 visible' "$log"
      - name: Stress disconnected sidebar navigation
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/navigation-stress.log"
          GTK_A11Y=none G_DEBUG=fatal-warnings timeout 20s xvfb-run -a ./build-linux/mblink-linux --ui-navigation-stress | tee "$log"
          grep -Fq 'LINK GTK timed navigation stress verified:' "$log"
          grep -Fq 'sidebar selections while disconnected with main-loop interleaving' "$log"
      - name: Sanitized GTK navigation soak
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-linux-sanitized             -DCMAKE_BUILD_TYPE=Debug             -DCMAKE_INSTALL_PREFIX=/usr             -DMBLINK_BUILD_LINUX_APP=ON             -DMBLINK_ENABLE_SANITIZERS=ON             -DMBLINK_BUILD_PROFILE=generic             -DBUILD_TESTING=OFF
          cmake --build build-linux-sanitized --parallel --target mblink-linux
          log="$RUNNER_TEMP/navigation-sanitized.log"
          GTK_A11Y=none           ASAN_OPTIONS=detect_leaks=0:halt_on_error=1:abort_on_error=1           UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1           timeout 25s xvfb-run -a ./build-linux-sanitized/mblink-linux --ui-navigation-stress | tee "$log"
          grep -Fq 'LINK GTK timed navigation stress verified:' "$log"
      - name: Verify canonical MB Corpo typography roles
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '.link-brand { color: #eef1f3; font-family: \"MB Corpo A Title Cond WEB\"; font-weight: 400; }' app/linux/main.c
          test "$(grep -Fc 'MB Corpo A Title Cond WEB' app/linux/main.c)" -eq 1
          grep -Fq '.link-section-title { color: #e7ebee; font-family: \"MB Corpo S Title WEB\"; font-weight: 700; }' app/linux/main.c
          grep -Fq '.link-card-title { color: #eef1f3; font-family: \"MB Corpo S Title WEB\"; font-size: 20px; font-weight: 700; }' app/linux/main.c
          grep -Fq '.link-detail-value { color: #eef1f3; font-family: \"MB Corpo S Title WEB\"; font-weight: 700; }' app/linux/main.c
          grep -Fq 'window *, popover, popover * { font-family: \"MB Corpo S Title WEB\"; }' app/linux/main.c
          grep -Fq 'button, button *, .link-toolbar-button, .link-toolbar-button *, .link-link-button, .link-link-button *, .link-save-session-button, .link-save-session-button *, .link-about-button, .link-about-button * { font-family: \"MB Corpo S Title WEB\"; font-weight: 700; }' app/linux/main.c
          grep -Fq 'dropdown, dropdown *, .link-adapter-combo, .link-adapter-combo *, popover, popover * { font-family: \"MB Corpo S Title WEB\"; font-weight: 400; }' app/linux/main.c
          grep -Fq 'entry, entry *, textview, textview *, textview text, .monospace, .monospace *, .link-terminal, .link-terminal *, .link-log, .link-log * { font-family: \"MB Corpo S Title WEB\"; font-weight: 400; }' app/linux/main.c
          grep -Fq '.link-toolbar-button, .link-toolbar-button * { font-family: \"MB Corpo S Title WEB\"; font-weight: 700; }' app/linux/main.c
          grep -Fq 'static let title3 = bold(20, relativeTo: .title3)' app/ios/MBLINK/MBLINKApp.swift
          grep -Fq 'static let title2 = bold(22, relativeTo: .title2)' app/ios/MBLINK/MBLINKApp.swift
          test "$(grep -Fc 'MBTypography.display(' app/ios/MBLINK/MBLINKApp.swift)" -eq 1
          grep -Fq '.font(MBTypography.display(29, relativeTo: .title))' app/ios/MBLINK/MBLINKApp.swift
      - name: Verify Linux About and branding
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'mblink_linux_show_about' app/linux/main.c
          grep -Fq 'gtk_window_set_default_size(GTK_WINDOW(widget), 560, 560);' app/linux/about-dialog.c
          grep -Fq 'gtk_widget_set_size_request(widget, 520, 500);' app/linux/about-dialog.c
          grep -Fq 'gtk_widget_add_css_class(widget, "mblink-about-dialog");' app/linux/about-dialog.c
          grep -Fq '.mblink-about-dialog stackswitcher button' app/linux/main.c
          grep -Fq '.mblink-about-dialog scrolledwindow { min-width: 500px; min-height: 300px; }' app/linux/main.c
          grep -Fq '.link-toolbar-button { min-height: 40px; padding: 7px 14px; }' app/linux/main.c
          grep -Fq 'static const char mblink_metrics_css[] =' app/linux/main.c
          grep -Fq 'runtime_css = g_strconcat(mblink_css, mblink_metrics_css, NULL);' app/linux/main.c
          grep -Fq 'g_free(runtime_css);' app/linux/main.c
          grep -Fq 'descriptor.use_client_side_titlebar = true;' app/linux/main.c
          grep -Fq '.link-titlebar-label { font-family: \"MB Corpo S Title WEB\"; font-size: 14px; font-weight: 700; }' app/linux/main.c
          grep -Fq '.link-device-row { min-height: 46px; }' app/linux/main.c
          grep -Fq '.link-toolbar-label { min-width: 64px; font-size: 14px; font-weight: 700; opacity: 1; }' app/linux/main.c
          grep -Fq '.link-adapter-combo { min-height: 44px; }' app/linux/main.c
          grep -Fq 'bool use_client_side_titlebar;' src/link/platform/linux/link-gtk-shell.h
          grep -Fq 'gtk_window_set_titlebar(shell->window, titlebar);' src/link/platform/linux/link-gtk-shell.c
          grep -Fq 'mblink_project_info()' app/linux/about-dialog.c
          grep -Fq 'info->copyright_text' app/linux/about-dialog.c
          grep -Fq 'mblink_linux_build_label(info->build_profile)' app/linux/about-dialog.c
          grep -Fq 'Generic / APT package' app/linux/about-dialog.c
          grep -Fq 'Native / local machine compile' app/linux/about-dialog.c
          test -s app/linux/assets/mblink-emblem.png
      - name: Package DEB and native RUN
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/cpack"
          cpack --config build-linux/CPackConfig.cmake -G DEB -B "$RUNNER_TEMP/cpack"
          deb_src="$(find "$RUNNER_TEMP/cpack" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb_src"
          dpkg-deb -c "$deb_src" | grep -F './usr/lib/udev/rules.d/60-mblink-openport2.rules' >/dev/null
          dpkg-deb -c "$deb_src" | grep -F './usr/share/doc/mblink/copyright' >/dev/null
          dpkg-deb -f "$deb_src" Depends | grep -E '(^|, )libusb-1\.0-0([ (]|,|$)' >/dev/null
          install -m 0644 "$deb_src" "$RUNNER_TEMP/release/MBLINK-${VERSION}-linux-amd64.deb"
          scripts/build-native-installer.sh "$RUNNER_TEMP/release/MBLINK-${VERSION}-linux-native.run"
          "$RUNNER_TEMP/release/MBLINK-${VERSION}-linux-native.run" --help >/dev/null
          native_deb="$RUNNER_TEMP/mblink_${VERSION}+native1_amd64.deb"
          "$RUNNER_TEMP/release/MBLINK-${VERSION}-linux-native.run" --build-only --output "$native_deb"
          test "$(dpkg-deb -f "$native_deb" Package)" = mblink
          test "$(dpkg-deb -f "$native_deb" Version)" = "${VERSION}+native1"
          dpkg-deb -c "$native_deb" | grep -F './usr/lib/udev/rules.d/60-mblink-openport2.rules' >/dev/null
          dpkg-deb -f "$native_deb" Depends | grep -E '(^|, )libusb-1\.0-0([ (]|,|$)' >/dev/null
          dpkg --compare-versions "${VERSION}+native1" gt "${VERSION}"
          test -s "$RUNNER_TEMP/release/MBLINK-${VERSION}-linux-amd64.deb"
          test -s "$RUNNER_TEMP/release/MBLINK-${VERSION}-linux-native.run"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MBLINK-${{ steps.version.outputs.version }}-linux-packages
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  windows-discover:
    name: Windows / MBLINK Discover build-verified
    runs-on: [self-hosted, Windows, ARM64, infiltrator-windows-arm64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Verify shared modern Windows shell and canonical icon source
        shell: pwsh
        run: |
          $icon = 'app/ios/MBLINK/Assets.xcassets/AppIcon.appiconset/AppIcon-60@3x.png'
          if (-not (Test-Path $icon)) { throw 'Canonical MBLINK AppIcon PNG is missing' }
          $ui = 'src/link/platform/windows/link-discover-ui.c'
          foreach ($needle in @('create_main_menu','IDM_HELP_ABOUT','TaskDialogIndirect','InitCommonControlsEx','LINK_PRODUCT_WEBSITE')) {
            if (-not (Select-String -Path $ui -SimpleMatch $needle -Quiet)) { throw "Missing shared Windows feature: $needle" }
          }
          if (-not (Test-Path 'src/link/platform/windows/smoke-launch.ps1')) { throw 'Missing launch smoke test' }
          if (Test-Path 'app/windows/mblink.ico') { throw 'Independent MBLINK ICO must not be maintained' }
          if (Test-Path 'app/windows/mblink.rc') { throw 'Independent MBLINK RC must not be maintained' }
      - name: Configure Win32 build
        shell: pwsh
        run: cmake -S . -B build-win32 -A Win32 -DCMAKE_BUILD_TYPE=Release -DMBLINK_BUILD_WINDOWS_DISCOVER=ON -DBUILD_TESTING=OFF
      - name: Build MBLINK Discover
        shell: pwsh
        run: cmake --build build-win32 --config Release --target mblink-discover --parallel
      - name: Reject dynamic Visual C++ runtime dependencies
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe is unavailable' }
          $dumpbin = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x86\dumpbin.exe' | Select-Object -First 1)
          if (-not $dumpbin -or -not (Test-Path $dumpbin)) { throw 'Unable to locate dumpbin.exe' }
          $deps = (& $dumpbin /DEPENDENTS build-win32/Release/mblink-discover.exe | Out-String)
          Write-Host $deps
          foreach ($dll in @('VCRUNTIME140.dll','VCRUNTIME140_1.dll','MSVCP140.dll','ucrtbased.dll')) {
            if ($deps -match [regex]::Escape($dll)) { throw "Unexpected dynamic runtime dependency: $dll" }
          }
      - name: Verify embedded version metadata and icon
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build-win32/Release/mblink-discover.exe').Path
          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductVersion -notlike '${{ steps.version.outputs.version }}*') { throw "Wrong ProductVersion: $($info.ProductVersion)" }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) { throw 'Executable has no associated icon' }
          $icon.Dispose()
      - name: Stage Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item build-win32/Release/mblink-discover.exe "release-assets/MBLINK-${{ steps.version.outputs.version }}-windows-discover.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MBLINK-${{ steps.version.outputs.version }}-windows-discover
          path: release-assets/MBLINK-${{ steps.version.outputs.version }}-windows-discover.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  windows-release-launch:
    name: Windows / release GUI launch verification
    needs: [windows-discover]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MBLINK-${{ steps.version.outputs.version }}-windows-discover
          path: release-assets
      - name: Prove release EXE launches
        shell: pwsh
        run: |
          & 'src/link/platform/windows/smoke-launch.ps1' -Executable "release-assets/MBLINK-${{ steps.version.outputs.version }}-windows-discover.exe" -ExpectedTitle 'MBLINK Discover'

  apple-ios:
    name: Apple / C11 + iOS Debug + iOS Release + IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          project_versions="$(grep -E '^[[:space:]]*MARKETING_VERSION = ' app/ios/MBLINK.xcodeproj/project.pbxproj | sed -E 's/.*= ([^;]+);/\1/' | sort -u)"
          test "$project_versions" = "$version"
          status="$(git submodule status --recursive)"
          ! grep -Eq '^[+-U]' <<<"$status"
          grep -Fq '#include "../link/src/uds/uds_services.c"' src/uds/uds.c
          grep -q 'link_diagnostic_flow_accept_response' src/link/platform/apple/LinkDiagnosticsController.m
          grep -q 'LinkDiagnosticsController' platform/apple/MBLinkDiagnosticsController.m
          grep -q 'mblink_mercedes_kwp_dtc_find' platform/apple/MBLinkDiagnosticsController.m
          grep -q 'link_diagnostic_flow_resume_after_manufacturer' src/link/platform/apple/LinkDiagnosticsController.m
          grep -q 'didReceiveFlowEvent' platform/apple/MBLinkDiagnosticsController.m
          grep -Fq 'mblink_mercedes_module_scan_begin_mobile_census(&_mercedesModuleScan)' platform/apple/MBLinkDiagnosticsController.m
          ! grep -Fq 'mblink_mercedes_module_scan_begin(&_mercedesModuleScan)' platform/apple/MBLinkDiagnosticsController.m
          grep -Fq 'MBLINK_MERCEDES_MODULE_SCAN_MOBILE_CENSUS' include/mblink/mercedes_module_scan.h
          grep -Fq 'mblink_mercedes_module_scan_begin_cached' platform/apple/MBLinkDiagnosticsController.m
          grep -Fq 'MBLinkVehicleProfileSchemaVersion = 4' platform/apple/MBLinkDiagnosticsController.m
          grep -Fq 'mblink.vehicleProfiles.v1' platform/apple/MBLinkDiagnosticsController.m
          grep -Fq 'flowConfig.preserve_live_response_headers = true;' platform/apple/MBLinkDiagnosticsController.m
          grep -Fq 'flowConfig.preserve_pid_discovery_response_headers = true;' platform/apple/MBLinkDiagnosticsController.m
          grep -Fq 'link_obd2_decode_live_pid_responders' src/link/src/obd2/obd2.c
          grep -Fq 'LinkResponderTelemetryStore' src/link/platform/apple/LinkDiagnosticsController.m
          grep -Fq 'mercedesModuleSnapshots' platform/apple/MBLinkDiagnosticsController.m
          grep -Fq 'observedPIDsForResponderCANIdentifier' platform/apple/MBLinkDiagnosticsController.m
          grep -Fq 'liveResponders' platform/apple/MBLinkDiagnosticsController.m
          grep -Fq 'record_responder_sample_named' src/link/platform/apple/LinkDiagnosticsController.m
          grep -Fq 'dashboardParameters' app/ios/MBLINK/ConnectionViewModel.swift
          grep -Fq 'mblink_obd2_pid_definition_count()' app/ios/MBLINK/ConnectionViewModel.swift
          grep -Fq 'standardDataSnapshot' app/ios/MBLINK/ConnectionViewModel.swift
          grep -Fq 'LINK_DIAGNOSTIC_FLOW_EVENT_LIVE_STRUCTURED' platform/apple/MBLinkDiagnosticsController.m
          grep -Fq 'mblink_obd2_pid_definition_count()' app/linux/main.c
          grep -Fq 'decoded_sample_valid[256]' app/linux/main.c
          grep -Fq 'LINK_DIAGNOSTIC_FLOW_EVENT_LIVE_STRUCTURED' app/linux/main.c
          grep -Fq 'link_structured_telemetry_store_record' src/link/platform/apple/LinkDiagnosticsController.m
          grep -Fq 'link_telemetry_recorder_record_structured_pid_named' src/link/platform/apple/LinkDiagnosticsController.m
          grep -Fq 'event->responder_decoded.count' platform/apple/MBLinkDiagnosticsController.m
          grep -Fq 'LINK_UDS_DTC_REPORT_SUBFUNCTION_COUNT 27U' src/link/include/link/uds_dtc.h
          grep -Fq 'mblink_uds_dtc_report_definition_count' include/mblink/uds_dtc.h
          grep -Fq 'LINK_SCHEDULER_MAX_ITEMS 256U' src/link/include/link/scheduler.h
          grep -Fq 'ECU evidence' app/ios/MBLINK/MBLINKApp.swift
          grep -Fq 'MBModuleDetailView' app/ios/MBLINK/MBLINKApp.swift
          grep -Fq 'Mercedes module census' app/ios/MBLINK/MBLINKApp.swift
          grep -Fq 'LINK_ADAPTER_KIND_MERCEDES_ME_NATIVE' src/link/include/link/transport.h
          link_version="$(tr -d '[:space:]' < src/link/VERSION)"
          grep -Fq "#define LINK_VERSION_STRING \"$link_version\"" src/link/include/link/version.h
          grep -Fq 'LINK_MERCEDES_ME_NUS_SERVICE_UUID' src/link/include/link/mercedes_me_adapter.h
          grep -Fq 'LINK_MERCEDES_ME_REFERENCE_CLASSIC_CONNECT_TIMEOUT_MS 44000U' src/link/include/link/mercedes_me_adapter.h
          grep -Fq 'link_mercedes_me_adapter_family_from_name' src/link/src/core/mercedes_me_adapter.c
          grep -Fq '#include "../link/src/core/mercedes_me_adapter.c"' src/core/mblink.c
          grep -Fq '#include "../link/src/core/mercedes_me_native_protocol.c"' src/core/mblink.c
          grep -Fq '#include "../link/src/core/mercedes_me_data_ids.c"' src/core/mblink.c
          grep -Fq '#include "../link/src/core/mercedes_me_diaglogic.c"' src/core/mblink.c
          grep -Fq '#include "../link/src/core/mercedes_me_whisper.c"' src/core/mblink.c
          ! grep -Fq 'MBLINK_IMPLEMENTATION_REVISION' src/core/mblink.c
          ! grep -Fq 'MBLINK_EMBEDDED_LINK_VERSION' src/core/mblink.c
          grep -Fq '#define MBLINK_EMBEDDED_LINK_REVISION' src/core/mblink.c
          link_gitlink="$(git ls-tree HEAD src/link | awk '{print $3}')"
          test -n "$link_gitlink"
          grep -Fq "\"$link_gitlink\"" src/core/mblink.c
          grep -Fq '#include "../link/src/core/diagnostic_request.c"' src/core/mblink.c
          grep -Fq '#include "../link/src/core/mercedes_me_diagnostic.c"' src/core/mblink.c
          grep -Fq '#include "link/version.h"' src/link/src/core/telemetry.c
          ! grep -Fq 'LINK_TELEMETRY_LINK_VERSION' src/link/src/core/telemetry.c
          ! grep -Fq '"0.14.26"' src/link/src/core/telemetry.c
          grep -Fq 'docs/MERCEDES-ME-ADAPTER-INTEROP.md' src/link/README.md
          grep -Fq 'link_linux_serial_probe_adapter' src/link/platform/linux/link-gtk-shell.c
          grep -Fq 'native protocol capture' src/link/platform/linux/link-gtk-shell.c
          grep -Fq 'ExternalAccessory/ExternalAccessory.h' src/link/platform/apple/LinkBLETransport.m
          grep -Fq 'Bluetooth Classic Mercedes adapter' src/link/platform/apple/LinkBLETransport.m
          grep -Fq 'ExternalAccessory.framework in Frameworks' app/ios/MBLINK.xcodeproj/project.pbxproj
          grep -Fq 'transport.isNativeAdapter' src/link/platform/apple/LinkDiagnosticsController.m
          grep -Fq 'NATIVE_RX' src/link/platform/apple/LinkDiagnosticsController.m
          grep -Fq 'MERCEDES ME ADAPTER · NATIVE' app/linux/main.c
          grep -Fq 'Transmission ECU candidate (7E1/7E9 EOBD responder)' include/mblink/mercedes_module_scan.h
          grep -Fq '"audio-headunit", "Audio 20 / COMAND head unit"' include/mblink/mercedes_module_catalog.h
          grep -Fq '"belt-pretensioner-left"' include/mblink/mercedes_module_catalog.h
          grep -Fq '"seat-driver"' include/mblink/mercedes_module_catalog.h
          grep -Fq 'vehicleProfileStatusText' app/ios/MBLINK/ConnectionViewModel.swift
          grep -Fq 'MercedesVehicleIdentity' app/ios/MBLINK/ConnectionViewModel.swift
          grep -Fq 'MBVehicleFactGrid' app/ios/MBLINK/MBLINKApp.swift
          ! grep -Fq 'Text(detail)' app/ios/MBLINK/MBLINKApp.swift
          grep -q 'Image("MBLINKEmblem")' app/ios/MBLINK/MBLINKApp.swift
          grep -Fq 'Copyright © 2026 Shannon Smith' app/ios/MBLINK.xcodeproj/project.pbxproj
      - name: Build and test portable C11 core on macOS
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build build-macos --config Release --parallel
          ctest --test-dir build-macos --build-config Release --output-on-failure
      - name: Build iOS simulator Debug and Release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for configuration in Debug Release; do
            xcodebuild -project app/ios/MBLINK.xcodeproj -scheme MBLINK \
              -configuration "$configuration" -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO \
              MARKETING_VERSION="$VERSION" MBLINK_SOURCE_REVISION="$GITHUB_SHA" build
          done
      - name: Build and package IPA
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/derived"
          xcodebuild -project app/ios/MBLINK.xcodeproj -scheme MBLINK -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            MARKETING_VERSION="$VERSION" MBLINK_SOURCE_REVISION="$GITHUB_SHA" build
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$derived/Build/Products/Release-iphoneos/MBLINK.app" "$RUNNER_TEMP/package/Payload/MBLINK.app"
          (cd "$RUNNER_TEMP/package" && zip -qry "$RUNNER_TEMP/MBLINK-${VERSION}-unsigned.ipa" Payload)
          unzip -tq "$RUNNER_TEMP/MBLINK-${VERSION}-unsigned.ipa"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MBLINK-${{ steps.version.outputs.version }}-unsigned-iphone-ipa
          path: ${{ runner.temp }}/MBLINK-${{ steps.version.outputs.version }}-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish complete atomic release
    needs: [portable-core, sanitizers, linux-app, windows-discover, windows-release-launch, apple-ios]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')
    runs-on: linux-native
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          link_version="$(tr -d '[:space:]' < src/link/VERSION)"
          common_version="$(tr -d '[:space:]' < src/link/src/infiltratr-common/VERSION)"
          subject="$(git log -1 --format=%s "$GITHUB_SHA")"
          if [[ "$subject" != "Release ${version}" && "$subject" != "Release ${version}:"* ]]; then
            echo "Release commit subject must begin with Release ${version}." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "link_version=$link_version" >> "$GITHUB_OUTPUT"
          echo "common_version=$common_version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MBLINK-${{ steps.release.outputs.version }}-unsigned-iphone-ipa
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MBLINK-${{ steps.release.outputs.version }}-linux-packages
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MBLINK-${{ steps.release.outputs.version }}-windows-discover
          path: release-assets
      - name: Verify release artifacts and build checksums
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for file in \
            "MBLINK-${VERSION}-unsigned.ipa" \
            "MBLINK-${VERSION}-linux-amd64.deb" \
            "MBLINK-${VERSION}-linux-native.run" \
            "MBLINK-${VERSION}-windows-discover.exe"; do
            test -s "release-assets/$file"
          done
          (cd release-assets && sha256sum MBLINK-* > SHA256SUMS.txt)
      - name: Stage complete draft and publish exact immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          LINK_VERSION: ${{ steps.release.outputs.link_version }}
          COMMON_VERSION: ${{ steps.release.outputs.common_version }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is no longer on main; refusing to publish." >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Release tag $TAG already exists; published releases are immutable." >&2
            exit 1
          fi
          release_state="$(gh release view "$TAG" \
            --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv' \
            2>/dev/null || true)"
          if [[ -n "$release_state" ]]; then
            IFS=$'\t' read -r is_draft target_commitish <<<"$release_state"
            if [[ "$is_draft" != "true" || "$target_commitish" != "$GITHUB_SHA" ]]; then
              echo "Release $TAG already exists; published releases are immutable." >&2
              exit 1
            fi
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft \
              --title "MBLINK $VERSION" \
              --notes "MBLINK $VERSION: complete launch-verified release on LINK $LINK_VERSION and Infiltratr Common $COMMON_VERSION, with the shared C11 diagnostic-flow controller and Mercedes extension hook, shared OBD-II/UDS/CAN-FD engines, shared Windows Discover shell, static Windows runtime and canonical MBLINK AppIcon branding."
          fi
          gh release upload "$TAG" release-assets/* --clobber
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for expected in \
            "MBLINK-${VERSION}-unsigned.ipa" \
            "MBLINK-${VERSION}-linux-amd64.deb" \
            "MBLINK-${VERSION}-linux-native.run" \
            "MBLINK-${VERSION}-windows-discover.exe" \
            "SHA256SUMS.txt"; do
            grep -Fxq "$expected" <<<"$assets"
          done
          gh release edit "$TAG" --draft=false
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"

      - name: Refresh and verify Infiltrator APT repository
        env:
          DISPATCH_TOKEN: ${{ secrets.APT_REPOSITORY_DISPATCH_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          VERSION: ${{ steps.release.outputs.version }}
          APP_ID: mblink
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DISPATCH_TOKEN:-}" ]]; then
            if ! GH_TOKEN="$DISPATCH_TOKEN" gh api \
              --method POST \
              repos/Infiltrator-Projects/Infiltrator-Repository/dispatches \
              -f event_type='application-release' \
              -f "client_payload[repository]=$GITHUB_REPOSITORY" \
              -f "client_payload[sha]=$RELEASE_SHA" >/dev/null; then
              echo "::warning::Immediate APT dispatch failed; waiting for the repository's five-minute safety refresh."
            fi
          else
            echo "::warning::Immediate APT dispatch token is unavailable; waiting for the repository's five-minute safety refresh."
          fi

          catalogue='https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json'
          for attempt in $(seq 1 72); do
            if curl -fsS --retry 2 --retry-delay 1 "$catalogue?release=$RELEASE_SHA&attempt=$attempt" \
              | python3 -c 'import json,sys; app=sys.argv[1]; version=sys.argv[2]; data=json.load(sys.stdin); raise SystemExit(0 if any(item.get("id") == app and str(item.get("version")) == version for item in data) else 1)' "$APP_ID" "$VERSION"; then
              echo "APT repository advertises $APP_ID $VERSION."
              exit 0
            fi
            echo "Waiting for APT publication of $APP_ID $VERSION ($attempt/72)..."
            sleep 10
          done

          echo "::error::GitHub release was published, but the central APT repository did not advertise $APP_ID $VERSION within 12 minutes."
          exit 1

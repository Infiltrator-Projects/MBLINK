# SPDX-License-Identifier: GPL-3.0-or-later
name: MBLINK CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-core:
    name: ${{ matrix.os }} / C11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: Ubuntu / ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DMBLINK_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-sanitized --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure

  linux-app:
    name: Linux / GTK4 app + release packages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Install GTK4 development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake dpkg-dev libgtk-4-dev pkg-config
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Configure Linux app
        run: cmake -S . -B build-linux-app -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DMBLINK_BUILD_LINUX_APP=ON -DBUILD_TESTING=OFF
      - name: Build Linux app
        run: cmake --build build-linux-app --target mblink-linux --parallel
      - name: Build and verify Debian package
        shell: bash
        env:
          MBLINK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/mblink-linux-release"
          cpack_dir="$RUNNER_TEMP/mblink-cpack"
          mkdir -p "$package_dir" "$cpack_dir"
          cpack --config build-linux-app/CPackConfig.cmake -G DEB -B "$cpack_dir"
          mapfile -t packages < <(find "$cpack_dir" -maxdepth 1 -type f -name '*.deb' -print)
          test "${#packages[@]}" -eq 1
          architecture="$(dpkg --print-architecture)"
          deb="$package_dir/MBLINK-${MBLINK_VERSION}-linux-${architecture}.deb"
          install -m 0644 "${packages[0]}" "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = 'mblink'
          test "$(dpkg-deb -f "$deb" Version)" = "$MBLINK_VERSION"
          dpkg-deb -c "$deb" > "$RUNNER_TEMP/mblink-deb-contents.txt"
          grep -q './usr/bin/mblink-linux' "$RUNNER_TEMP/mblink-deb-contents.txt"
          grep -q './usr/share/applications/com.github.The-First-Infiltrator.MBLINK.desktop' "$RUNNER_TEMP/mblink-deb-contents.txt"
      - name: Build and exercise native Linux builder
        shell: bash
        env:
          MBLINK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/mblink-linux-release"
          installer="$package_dir/MBLINK-${MBLINK_VERSION}-linux-native.run"
          scripts/build-native-installer.sh "$installer"
          "$installer" --help >/dev/null
          "$installer" --extract "$RUNNER_TEMP/mblink-native-source"
          test -f "$RUNNER_TEMP/mblink-native-source/src/link/VERSION"
          "$installer" --build-only --output "$RUNNER_TEMP/mblink-linux-native" --jobs 2
          test -x "$RUNNER_TEMP/mblink-linux-native"
      - name: Upload Linux release packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MBLINK-${{ steps.version.outputs.version }}-linux-packages
          path: |
            ${{ runner.temp }}/mblink-linux-release/MBLINK-${{ steps.version.outputs.version }}-linux-amd64.deb
            ${{ runner.temp }}/mblink-linux-release/MBLINK-${{ steps.version.outputs.version }}-linux-native.run
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  apple-ios:
    name: iOS / Xcode / ${{ matrix.configuration }}
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Verify version and shared ownership
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$(grep -c "MARKETING_VERSION = ${version};" app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 4
          test "$(tr -d '[:space:]' < src/infiltratr-common/VERSION)" = "1.10.0"
          test "$(tr -d '[:space:]' < src/link/VERSION)" = "0.6.0"
          grep -q 'set(MBLINK_LINK_COMMIT "bbb21785983f1d94483949d4a7c50adf80f4c4e7")' CMakeLists.txt
          test "$(git -C src/link rev-parse HEAD)" = "bbb21785983f1d94483949d4a7c50adf80f4c4e7"

          grep -q 'link_parameter_store_record' src/link/src/core/parameter.c
          grep -q 'LINK_PARAMETER_STORE_HISTORY_CAPACITY 1024U' src/link/include/link/parameter_store.h
          grep -q 'link_scheduler_add_parameter' src/link/src/core/scheduler.c
          grep -q 'LINK_SCHEDULER_MAX_ITEMS 64U' src/link/include/link/scheduler.h
          grep -q 'link_telemetry_store_record' src/link/src/core/telemetry.c
          grep -q '../link/src/core/parameter.c' src/core/mblink.c
          grep -q '../link/src/core/scheduler.c' src/core/mblink.c
          grep -q '../link/src/core/telemetry.c' src/core/mblink.c
          grep -q 'return link_parameter_' src/core/parameter.c
          grep -q 'link_scheduler_configure_standard_obd2_bits' src/core/scheduler.c
          grep -q 'link_telemetry_export_csv_named' src/core/telemetry_csv.c

          test ! -e src/core/isotp.c
          grep -q 'path = "../../src/link/src/core/isotp.c"' app/ios/MBLINK.xcodeproj/project.pbxproj
          grep -q 'mblink_elm327_parser_feed' platform/apple/MBLinkBLETransport.m
          grep -q 'mblink_scheduler_next' platform/apple/MBLinkDiagnosticsController.m
          grep -q 'mblink_telemetry_store_record' platform/apple/MBLinkDiagnosticsController.m
          grep -q 'mblink_parameter_obd2_definition_count' app/ios/MBLINK/ConnectionViewModel.swift
          grep -q 'Image("MBLINKEmblem")' app/ios/MBLINK/MBLINKApp.swift
          cmp -s app/ios/MBLINK/Assets.xcassets/AppIcon.appiconset/AppIcon-60@3x.png app/linux/assets/mblink-emblem.png
      - name: Build iPhone app for simulator
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/mblink-xcodebuild-${{ matrix.configuration }}.log"
          if ! xcodebuild -project app/ios/MBLINK.xcodeproj -scheme MBLINK -configuration "${{ matrix.configuration }}" -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build >"$log" 2>&1; then
            grep -E '(^|: )(error:|warning:)|:[0-9]+:[0-9]+: (error|warning):' "$log" | tail -n 120 || true
            exit 1
          fi
          tail -n 20 "$log"

  iphone-device-ipa:
    name: iPhone / unsigned device IPA
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build unsigned iPhone device app
        shell: bash
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/mblink-device-derived"
          log="$RUNNER_TEMP/mblink-xcodebuild-device.log"
          if ! xcodebuild -project app/ios/MBLINK.xcodeproj -scheme MBLINK -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build >"$log" 2>&1; then
            grep -E '(^|: )(error:|warning:)|:[0-9]+:[0-9]+: (error|warning):' "$log" | tail -n 120 || true
            exit 1
          fi
          app="$derived/Build/Products/Release-iphoneos/MBLINK.app"
          test -x "$app/MBLINK"
          /usr/bin/lipo -info "$app/MBLINK" | grep -q 'arm64'
      - name: Package unsigned IPA
        shell: bash
        env:
          MBLINK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/mblink-ipa"
          ipa="$RUNNER_TEMP/MBLINK-${MBLINK_VERSION}-unsigned.ipa"
          rm -rf "$package"
          mkdir -p "$package/Payload"
          /usr/bin/ditto "$RUNNER_TEMP/mblink-device-derived/Build/Products/Release-iphoneos/MBLINK.app" "$package/Payload/MBLINK.app"
          (cd "$package" && /usr/bin/zip -qry "$ipa" Payload)
          /usr/bin/unzip -tq "$ipa"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MBLINK-${{ steps.version.outputs.version }}-unsigned-iphone-ipa
          path: ${{ runner.temp }}/MBLINK-${{ steps.version.outputs.version }}-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish version release
    needs: [portable-core, sanitizers, linux-app, apple-ios, iphone-device-ipa]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "target=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Download unsigned IPA release asset
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: MBLINK-${{ steps.release.outputs.version }}-unsigned-iphone-ipa
          path: release-assets
      - name: Download Linux release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: MBLINK-${{ steps.release.outputs.version }}-linux-packages
          path: release-assets
      - name: Create or verify tag, GitHub Release and all assets
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TARGET: ${{ steps.release.outputs.target }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = process.env.RELEASE_VERSION;
            const tag = process.env.RELEASE_TAG;
            const target = process.env.RELEASE_TARGET;
            const assetNames = [
              `MBLINK-${version}-unsigned.ipa`,
              `MBLINK-${version}-linux-amd64.deb`,
              `MBLINK-${version}-linux-native.run`
            ];

            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (main.data.commit.sha !== target) return;

            let tagTarget = null;
            try {
              tagTarget = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })).data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            let release = null;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (tagTarget !== null && tagTarget !== target) {
              if (release !== null) return;
              throw new Error(`${tag} points to ${tagTarget}, expected ${target}`);
            }
            for (const name of assetNames) {
              if (!fs.existsSync(path.join(process.env.GITHUB_WORKSPACE, 'release-assets', name))) {
                throw new Error(`Missing release asset ${name}`);
              }
            }
            if (tagTarget === null) {
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: target });
            }
            if (release === null) {
              release = (await github.rest.repos.createRelease({ owner, repo, tag_name: tag, target_commitish: target, name: `MBLINK ${version}`, generate_release_notes: true, draft: false, prerelease: false })).data;
            }
            const existing = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id: release.id, per_page: 100 });
            for (const asset of existing) {
              if (assetNames.includes(asset.name)) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
            }
            for (const name of assetNames) {
              const data = fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'release-assets', name));
              await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id: release.id, name, data, headers: { 'content-type': 'application/octet-stream', 'content-length': data.length } });
            }

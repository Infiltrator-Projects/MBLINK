# SPDX-License-Identifier: GPL-3.0-or-later
name: MBLINK CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Rapid ordinary development pushes may cancel one another. Release commits use
# their own non-cancellable lane so publication cannot be interrupted by a newer
# development commit.
concurrency:
  group: mblink-ci-${{ github.ref }}-${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ') && 'release' || 'ordinary' }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')) }}

jobs:
  preflight:
    name: Preflight / repository invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          submodules: recursive
      - name: Cheap fail-fast checks
        run: python3 scripts/preflight.py
      - name: Stable PID architecture contract
        run: python3 tests/test_pid_architecture.py
      - id: meta
        name: Resolve CI mode
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          subject="$(git log -1 --format=%s HEAD)"
          is_release=false
          if [[ "$GITHUB_EVENT_NAME" == push ]] && \
             [[ "$subject" == "Release ${version}" || "$subject" == "Release ${version}:"* ]]; then
            is_release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "CI mode: $([[ "$is_release" == true ]] && echo release || echo development)"

  portable-core:
    name: Linux / C11
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build --build-config Release --output-on-failure
      - run: python3 tests/test_whisper_recover.py

  sanitizers:
    name: Linux / ASan + UBSan
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DMBLINK_ENABLE_SANITIZERS=ON
      - run: cmake --build build-sanitized --parallel
      - run: ctest --test-dir build-sanitized --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  linux-app:
    name: Linux / GTK4 app
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake dpkg-dev libgtk-4-dev libbluetooth-dev \
            libusb-1.0-0-dev pkg-config xvfb xauth
      - name: Configure and build Linux app
        run: |
          cmake -S . -B build-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DMBLINK_BUILD_LINUX_APP=ON \
            -DMBLINK_BUILD_PROFILE=generic \
            -DBUILD_TESTING=OFF
          cmake --build build-linux --parallel
      - name: Verify native Tactrix provider is linked
        shell: bash
        run: |
          set -euo pipefail
          ldd ./build-linux/mblink-linux | grep -F 'libusb-1.0.so' >/dev/null
          grep -aF 'OP2:Tactrix OpenPort 2.0' ./build-linux/mblink-linux >/dev/null
      - name: Verify independent display preferences
        shell: bash
        run: |
          set -euo pipefail
          ./build-linux/mblink-linux --ui-settings-verify | tee "$RUNNER_TEMP/settings-verify.log"
          grep -Fq 'MBLINK settings verified: 8 independent measurement preferences' "$RUNNER_TEMP/settings-verify.log"
      - name: Verify offline C207 replay reaches visible ORC fault
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/c207-replay.log"
          GTK_A11Y=none timeout 60s xvfb-run -a ./build-linux/mblink-linux --replay-c207-verify | tee "$log"
          grep -Fq 'MBLINK replay verified: ORC seatbelt/airbag fault B00013 visible' "$log"
      - name: Stress disconnected sidebar navigation
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/navigation-stress.log"
          GTK_A11Y=none G_DEBUG=fatal-warnings timeout 60s \
            xvfb-run -a ./build-linux/mblink-linux --ui-navigation-stress | tee "$log"
          grep -Fq 'LINK GTK timed navigation stress verified:' "$log"
          grep -Fq 'sidebar selections while disconnected with main-loop interleaving' "$log"
      - name: Sanitized GTK navigation soak
        if: needs.preflight.outputs.is_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-linux-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DMBLINK_BUILD_LINUX_APP=ON \
            -DMBLINK_ENABLE_SANITIZERS=ON \
            -DMBLINK_BUILD_PROFILE=generic \
            -DBUILD_TESTING=OFF
          cmake --build build-linux-sanitized --parallel --target mblink-linux
          log="$RUNNER_TEMP/navigation-sanitized.log"
          GTK_A11Y=none \
            ASAN_OPTIONS=detect_leaks=0:halt_on_error=1:abort_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            timeout 90s xvfb-run -a ./build-linux-sanitized/mblink-linux \
            --ui-navigation-stress | tee "$log"
          grep -Fq 'LINK GTK timed navigation stress verified:' "$log"
      - name: Package DEB and native RUN
        if: needs.preflight.outputs.is_release == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/cpack"
          cpack --config build-linux/CPackConfig.cmake -G DEB -B "$RUNNER_TEMP/cpack"
          deb_src="$(find "$RUNNER_TEMP/cpack" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb_src"
          dpkg-deb -c "$deb_src" | grep -F './usr/lib/udev/rules.d/60-mblink-openport2.rules' >/dev/null
          dpkg-deb -c "$deb_src" | grep -F './usr/share/doc/mblink/copyright' >/dev/null
          dpkg-deb -f "$deb_src" Depends | grep -E '(^|, )libusb-1\.0-0([ (]|,|$)' >/dev/null
          install -m 0644 "$deb_src" "$RUNNER_TEMP/release/MBLINK-${VERSION}-linux-amd64.deb"
          scripts/build-native-installer.sh "$RUNNER_TEMP/release/MBLINK-${VERSION}-linux-native.run"
          "$RUNNER_TEMP/release/MBLINK-${VERSION}-linux-native.run" --help >/dev/null
          native_deb="$RUNNER_TEMP/mblink_${VERSION}+native1_amd64.deb"
          "$RUNNER_TEMP/release/MBLINK-${VERSION}-linux-native.run" --build-only --output "$native_deb"
          test "$(dpkg-deb -f "$native_deb" Package)" = mblink
          test "$(dpkg-deb -f "$native_deb" Version)" = "${VERSION}+native1"
          dpkg-deb -c "$native_deb" | grep -F './usr/lib/udev/rules.d/60-mblink-openport2.rules' >/dev/null
          dpkg-deb -f "$native_deb" Depends | grep -E '(^|, )libusb-1\.0-0([ (]|,|$)' >/dev/null
          dpkg --compare-versions "${VERSION}+native1" gt "$VERSION"
      - name: Upload Linux release packages
        if: needs.preflight.outputs.is_release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MBLINK-${{ needs.preflight.outputs.version }}-linux-packages
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  windows-discover:
    name: Windows / MBLINK Discover build-verified
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Configure Win32 build
        shell: pwsh
        run: cmake -S . -B build-win32 -A Win32 -DCMAKE_BUILD_TYPE=Release -DMBLINK_BUILD_WINDOWS_DISCOVER=ON -DBUILD_TESTING=OFF
      - name: Build MBLINK Discover
        shell: pwsh
        run: cmake --build build-win32 --config Release --target mblink-discover --parallel
      - name: Prove executable launches
        shell: pwsh
        run: |
          & 'src/link/platform/windows/smoke-launch.ps1' -Executable 'build-win32/Release/mblink-discover.exe' -ExpectedTitle 'MBLINK Discover'
      - name: Verify release executable metadata
        if: needs.preflight.outputs.is_release == 'true'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe is unavailable' }
          $dumpbin = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x86\dumpbin.exe' | Select-Object -First 1)
          if (-not $dumpbin -or -not (Test-Path $dumpbin)) { throw 'Unable to locate dumpbin.exe' }
          $exe = (Resolve-Path 'build-win32/Release/mblink-discover.exe').Path
          $deps = (& $dumpbin /DEPENDENTS $exe | Out-String)
          foreach ($dll in @('VCRUNTIME140.dll','VCRUNTIME140_1.dll','MSVCP140.dll','ucrtbased.dll')) {
            if ($deps -match [regex]::Escape($dll)) { throw "Unexpected dynamic runtime dependency: $dll" }
          }
          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductVersion -notlike '${{ needs.preflight.outputs.version }}*') {
            throw "Wrong ProductVersion: $($info.ProductVersion)"
          }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) { throw 'Executable has no associated icon' }
          $icon.Dispose()
      - name: Stage Windows release executable
        if: needs.preflight.outputs.is_release == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item build-win32/Release/mblink-discover.exe "release-assets/MBLINK-${{ needs.preflight.outputs.version }}-windows-discover.exe"
      - name: Upload Windows release executable
        if: needs.preflight.outputs.is_release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MBLINK-${{ needs.preflight.outputs.version }}-windows-discover
          path: release-assets/MBLINK-${{ needs.preflight.outputs.version }}-windows-discover.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  apple-ios:
    name: Apple / C11 + iOS simulator
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Build and test portable C11 core on macOS
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build build-macos --config Release --parallel
          ctest --test-dir build-macos --build-config Release --output-on-failure
      - name: Build iOS simulator Debug
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          xcodebuild -project app/ios/MBLINK.xcodeproj -scheme MBLINK \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived-simulator-Debug" \
            CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$VERSION" \
            MBLINK_SOURCE_REVISION="$GITHUB_SHA" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) MBLINK_CI_SIMULATED_FLOW' build
      - name: Launch iOS simulated diagnostic flow
        shell: bash
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/derived-simulator-Debug"
          udid="$(xcrun simctl list devices available \
            | sed -nE 's/.*iPhone[^()]*\(([0-9A-Fa-f-]{36})\).*/\1/p' \
            | head -n1)"
          test -n "$udid"
          xcrun simctl boot "$udid" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$udid" -b
          app="$derived/Build/Products/Debug-iphonesimulator/MBLINK.app"
          test -d "$app"
          xcrun simctl install "$udid" "$app"
          launch_output="$(SIMCTL_CHILD_MBLINK_CI_SIMULATED_FLOW=1 \
            SIMCTL_CHILD_MBLINK_CI_SIMULATED_POLLING=1 \
            SIMCTL_CHILD_MBLINK_CI_PERSIST_SIMULATED_PROFILE=1 \
            xcrun simctl launch "$udid" com.github.The-First-Infiltrator.MBLINK)"
          printf '%s\n' "$launch_output"
          grep -Fq 'com.github.The-First-Infiltrator.MBLINK' <<<"$launch_output"
          data_container="$(xcrun simctl get_app_container "$udid" com.github.The-First-Infiltrator.MBLINK data)"
          marker="$data_container/Documents/mblink-ci-simulated-flow.ok"
          flow_ready=false
          for attempt in $(seq 1 60); do
            if test -f "$marker"; then
              cat "$marker"
              if grep -Fq 'state=ready' "$marker" && \
                 grep -Fq 'vin=WDD2073022F123456' "$marker" && \
                 grep -Fq 'fault_status=Complete ·' "$marker" && \
                 grep -Fq 'stored_codes=P0401,P0101' "$marker" && \
                 grep -Fq 'standard_selection_count=2' "$marker" && \
                 grep -Fq 'standard_selection_keys=obd2.engine.rpm,obd2.vehicle.speed' "$marker" && \
                 grep -Fq 'standard_selection_scoped=true' "$marker" && \
                 grep -Fq 'module_count=4' "$marker" && \
                 grep -Eq '^transmission_catalogue_count=[1-9][0-9]*$' "$marker" && \
                 grep -Eq '^esp_catalogue_count=[1-9][0-9]*$' "$marker" && \
                 grep -Eq '^orc_catalogue_count=[1-9][0-9]*$' "$marker" && \
                 grep -Eq '^recorded_samples=[1-9][0-9]*$' "$marker"; then
                flow_ready=true
                break
              fi
              grep -Fq 'state=failed' "$marker" && break || true
            fi
            sleep 1
          done
          if test "$flow_ready" != true; then
            echo '::error::Simulated diagnostic flow did not reach live-ready state.'
            test ! -f "$marker" || cat "$marker"
            xcrun simctl spawn "$udid" log show --last 2m --style compact \
              --predicate 'process == "MBLINK" AND (messageType == error OR messageType == fault)' || true
            exit 1
          fi
          xcrun simctl terminate "$udid" com.github.The-First-Infiltrator.MBLINK

          saved_marker="$data_container/Documents/mblink-ci-saved-pid-profile.ok"
          rm -f "$saved_marker"
          SIMCTL_CHILD_MBLINK_CI_SAVED_PID_RESTORE=1 \
            xcrun simctl launch "$udid" com.github.The-First-Infiltrator.MBLINK
          saved_ready=false
          for attempt in $(seq 1 20); do
            if test -f "$saved_marker"; then
              cat "$saved_marker"
              if grep -Fq 'state=ready' "$saved_marker" && \
                 grep -Fq 'active=false' "$saved_marker" && \
                 grep -Fq 'selected_vin=WDD2073022F123456' "$saved_marker" && \
                 grep -Fq 'profile_module_count=4' "$saved_marker" && \
                 grep -Fq 'display_selection_verified=true' "$saved_marker" && \
                 grep -Eq '^transmission_catalogue_count=[1-9][0-9]*$' "$saved_marker" && \
                 grep -Eq '^esp_catalogue_count=[1-9][0-9]*$' "$saved_marker" && \
                 grep -Eq '^orc_catalogue_count=[1-9][0-9]*$' "$saved_marker"; then
                saved_ready=true
                break
              fi
            fi
            sleep 1
          done
          if test "$saved_ready" != true; then
            echo '::error::Saved C207 PID catalogues did not survive a cold app launch.'
            test ! -f "$saved_marker" || cat "$saved_marker"
            exit 1
          fi
          xcrun simctl terminate "$udid" com.github.The-First-Infiltrator.MBLINK
      - name: Build iOS simulator Release
        if: needs.preflight.outputs.is_release == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          xcodebuild -project app/ios/MBLINK.xcodeproj -scheme MBLINK \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived-simulator-Release" \
            CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$VERSION" \
            MBLINK_SOURCE_REVISION="$GITHUB_SHA" build
      - name: Build and package IPA
        if: needs.preflight.outputs.is_release == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/derived"
          xcodebuild -project app/ios/MBLINK.xcodeproj -scheme MBLINK \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            MARKETING_VERSION="$VERSION" MBLINK_SOURCE_REVISION="$GITHUB_SHA" build
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$derived/Build/Products/Release-iphoneos/MBLINK.app" \
            "$RUNNER_TEMP/package/Payload/MBLINK.app"
          (cd "$RUNNER_TEMP/package" && zip -qry "$RUNNER_TEMP/MBLINK-${VERSION}-unsigned.ipa" Payload)
          unzip -tq "$RUNNER_TEMP/MBLINK-${VERSION}-unsigned.ipa"
      - name: Upload iOS release package
        if: needs.preflight.outputs.is_release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MBLINK-${{ needs.preflight.outputs.version }}-unsigned-iphone-ipa
          path: ${{ runner.temp }}/MBLINK-${{ needs.preflight.outputs.version }}-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish complete atomic release
    needs: [preflight, portable-core, sanitizers, linux-app, windows-discover, apple-ios]
    if: needs.preflight.outputs.is_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          link_version="$(tr -d '[:space:]' < src/link/VERSION)"
          common_version="$(tr -d '[:space:]' < src/link/src/infiltratr-common/VERSION)"
          subject="$(git log -1 --format=%s "$GITHUB_SHA")"
          if [[ "$subject" != "Release ${version}" && "$subject" != "Release ${version}:"* ]]; then
            echo "Release commit subject must begin with Release ${version}." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "link_version=$link_version" >> "$GITHUB_OUTPUT"
          echo "common_version=$common_version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MBLINK-${{ steps.release.outputs.version }}-unsigned-iphone-ipa
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MBLINK-${{ steps.release.outputs.version }}-linux-packages
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MBLINK-${{ steps.release.outputs.version }}-windows-discover
          path: release-assets
      - name: Verify release artifacts and build checksums
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for file in \
            "MBLINK-${VERSION}-unsigned.ipa" \
            "MBLINK-${VERSION}-linux-amd64.deb" \
            "MBLINK-${VERSION}-linux-native.run" \
            "MBLINK-${VERSION}-windows-discover.exe"; do
            test -s "release-assets/$file"
          done
          (cd release-assets && sha256sum MBLINK-* > SHA256SUMS.txt)
      - name: Stage complete draft and publish exact immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          LINK_VERSION: ${{ steps.release.outputs.link_version }}
          COMMON_VERSION: ${{ steps.release.outputs.common_version }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is no longer on main; refusing to publish." >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Release tag $TAG already exists; published releases are immutable." >&2
            exit 1
          fi
          release_state="$(gh release view "$TAG" \
            --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv' \
            2>/dev/null || true)"
          if [[ -n "$release_state" ]]; then
            IFS=$'\t' read -r is_draft target_commitish <<<"$release_state"
            if [[ "$is_draft" != true || "$target_commitish" != "$GITHUB_SHA" ]]; then
              echo "Release $TAG already exists; published releases are immutable." >&2
              exit 1
            fi
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft \
              --title "MBLINK $VERSION" \
              --notes "MBLINK $VERSION: complete launch-verified release on LINK $LINK_VERSION and Infiltratr Common $COMMON_VERSION."
          fi
          gh release upload "$TAG" release-assets/* --clobber
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for expected in \
            "MBLINK-${VERSION}-unsigned.ipa" \
            "MBLINK-${VERSION}-linux-amd64.deb" \
            "MBLINK-${VERSION}-linux-native.run" \
            "MBLINK-${VERSION}-windows-discover.exe" \
            "SHA256SUMS.txt"; do
            grep -Fxq "$expected" <<<"$assets"
          done
          gh release edit "$TAG" --draft=false
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
      - name: Refresh and verify Infiltrator APT repository
        env:
          DISPATCH_TOKEN: ${{ secrets.APT_REPOSITORY_DISPATCH_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          VERSION: ${{ steps.release.outputs.version }}
          APP_ID: mblink
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DISPATCH_TOKEN:-}" ]]; then
            if ! GH_TOKEN="$DISPATCH_TOKEN" gh api \
              --method POST \
              repos/Infiltrator-Projects/Infiltrator-Repository/dispatches \
              -f event_type='application-release' \
              -f "client_payload[repository]=$GITHUB_REPOSITORY" \
              -f "client_payload[sha]=$RELEASE_SHA" >/dev/null; then
              echo "::warning::Immediate APT dispatch failed; waiting for the repository's safety refresh."
            fi
          else
            echo "::warning::Immediate APT dispatch token is unavailable; waiting for the repository's safety refresh."
          fi
          catalogue='https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json'
          for attempt in $(seq 1 6); do
            if curl -fsS --retry 2 --retry-delay 1 "$catalogue?release=$RELEASE_SHA&attempt=$attempt" \
              | python3 -c 'import json,sys; app=sys.argv[1]; version=sys.argv[2]; data=json.load(sys.stdin); raise SystemExit(0 if any(item.get("id") == app and str(item.get("version")) == version for item in data) else 1)' "$APP_ID" "$VERSION"; then
              echo "APT repository advertises $APP_ID $VERSION."
              exit 0
            fi
            echo "Waiting for APT publication of $APP_ID $VERSION ($attempt/6)..."
            sleep 10
          done
          echo "::warning::GitHub release is published; central APT catalogue propagation is still pending."

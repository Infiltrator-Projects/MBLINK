# SPDX-License-Identifier: GPL-3.0-or-later
name: MBLINK CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LINK_VERSION: 0.7.1
  LINK_COMMIT: 4c75618da2085ecd09e8110f2883decf9b2162f9

jobs:
  portable-core:
    name: ${{ matrix.os }} / C11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: Verify dependency ownership
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t gitlinks < <(git ls-files --stage | awk '$1 == "160000" { print $4 }' | sort)
          test "${gitlinks[*]}" = "src/link"
          test ! -e src/infiltratr-common
          test "$(tr -d '[:space:]' < src/link/VERSION)" = "$LINK_VERSION"
          test "$(git -C src/link rev-parse HEAD)" = "$LINK_COMMIT"
          test "$(tr -d '[:space:]' < src/link/src/infiltratr-common/VERSION)" = "1.10.0"
          grep -q 'link_elm327_parser_feed' src/link/src/elm327/elm327.c
          grep -q 'link_elm327_can_decode_pdu' src/link/src/elm327/can.c
          grep -q 'link_elm327_session_begin' src/link/src/elm327/session.c
          grep -q 'return link_elm327_parser_feed' src/elm327/elm327.c
          grep -q 'return link_elm327_can_decode_pdu' src/elm327/can.c
          grep -q 'return link_elm327_session_begin' src/elm327/session.c
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: Ubuntu / ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DMBLINK_ENABLE_SANITIZERS=ON
      - run: cmake --build build-sanitized --parallel
      - run: ctest --test-dir build-sanitized --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  linux-app:
    name: Linux / GTK4 + DEB + RUN
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake dpkg-dev libgtk-4-dev pkg-config
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DMBLINK_BUILD_LINUX_APP=ON -DBUILD_TESTING=OFF
      - run: cmake --build build-linux --parallel
      - name: Verify Linux About
        shell: bash
        run: |
          grep -q 'mblink_linux_show_about' app/linux/main.c
          grep -q 'Copyright © 2026 Shannon Smith' app/linux/about-dialog.c
          grep -q 'gdk_texture_new_from_resource' app/linux/about-dialog.c
      - name: Package DEB and native RUN
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/cpack"
          cpack --config build-linux/CPackConfig.cmake -G DEB -B "$RUNNER_TEMP/cpack"
          deb_src="$(find "$RUNNER_TEMP/cpack" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb_src"
          install -m 0644 "$deb_src" "$RUNNER_TEMP/release/MBLINK-${VERSION}-linux-amd64.deb"
          scripts/build-native-installer.sh "$RUNNER_TEMP/release/MBLINK-${VERSION}-linux-native.run"
          "$RUNNER_TEMP/release/MBLINK-${VERSION}-linux-native.run" --help >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MBLINK-${{ steps.version.outputs.version }}-linux-packages
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          compression-level: 0

  apple-ios:
    name: iOS / Xcode / ${{ matrix.configuration }}
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test "$(tr -d '[:space:]' < src/link/VERSION)" = "$LINK_VERSION"
          test "$(git -C src/link rev-parse HEAD)" = "$LINK_COMMIT"
          grep -q '../link/src/core/transport.c' src/core/mblink.c
          grep -q '../link/src/elm327/elm327.c' src/core/mblink.c
          grep -q '../link/src/elm327/can.c' src/core/mblink.c
          grep -q '../link/src/elm327/probe.c' src/core/mblink.c
          grep -q '../link/src/elm327/session.c' src/core/mblink.c
          grep -q 'Image("MBLINKEmblem")' app/ios/MBLINK/MBLINKApp.swift
          grep -q 'Copyright © 2026 Shannon Smith' app/ios/MBLINK.xcodeproj/project.pbxproj
      - name: Build simulator
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          xcodebuild -project app/ios/MBLINK.xcodeproj -scheme MBLINK \
            -configuration "${{ matrix.configuration }}" -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" build

  iphone-device-ipa:
    name: iPhone / unsigned device IPA
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and package IPA
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/derived"
          xcodebuild -project app/ios/MBLINK.xcodeproj -scheme MBLINK -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            MARKETING_VERSION="$VERSION" build
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$derived/Build/Products/Release-iphoneos/MBLINK.app" "$RUNNER_TEMP/package/Payload/MBLINK.app"
          (cd "$RUNNER_TEMP/package" && zip -qry "$RUNNER_TEMP/MBLINK-${VERSION}-unsigned.ipa" Payload)
          unzip -tq "$RUNNER_TEMP/MBLINK-${VERSION}-unsigned.ipa"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MBLINK-${{ steps.version.outputs.version }}-unsigned-iphone-ipa
          path: ${{ runner.temp }}/MBLINK-${{ steps.version.outputs.version }}-unsigned.ipa
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish version release
    needs: [portable-core, sanitizers, linux-app, apple-ios, iphone-device-ipa]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: MBLINK-${{ steps.release.outputs.version }}-unsigned-iphone-ipa
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: MBLINK-${{ steps.release.outputs.version }}-linux-packages
          path: release-assets
      - name: Create exact tag and publish assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n1 "$TAG")" = "$GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" \
              --title "MBLINK $VERSION" \
              --notes "MBLINK $VERSION: shared automotive runtime through LINK 0.7.1."
          fi

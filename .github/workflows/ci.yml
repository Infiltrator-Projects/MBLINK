# SPDX-License-Identifier: GPL-3.0-or-later
name: MBLINK CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-core:
    name: ${{ matrix.os }} / C11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Verify dependency ownership and exact recursive gitlinks
        shell: bash
        run: |
          set -euo pipefail
          gitlinks="$(git ls-files --stage | awk '$1 == "160000" { print $4 }' | sort)"
          test "$gitlinks" = "src/link"
          test ! -e src/infiltratr-common
          status="$(git submodule status --recursive)"
          if grep -Eq '^[+-U]' <<<"$status"; then
            printf '%s\n' "$status" >&2
            echo 'Recursive submodule checkout does not match the committed gitlinks.' >&2
            exit 1
          fi
          test -f src/link/VERSION
          test -f src/link/src/infiltratr-common/VERSION
          grep -q 'src/uds/uds_services.c' src/link/CMakeLists.txt
          grep -q 'link_uds_standard_service_count' src/link/src/uds/uds_services.c
          grep -Fq '#include "../link/src/uds/uds_services.c"' src/uds/uds.c
          grep -q 'link_elm327_parser_feed' src/link/src/elm327/elm327.c
          grep -q 'link_elm327_can_decode_pdu' src/link/src/elm327/can.c
          grep -q 'link_elm327_session_begin' src/link/src/elm327/session.c
          grep -q 'link_obd2_decode_live_pid' src/link/src/obd2/obd2.c
          grep -q 'link_uds_decode_response' src/link/src/uds/uds.c
          grep -q 'link_diagnostic_flow_next_action' src/link/src/core/diagnostic_flow.c
          grep -q 'return link_elm327_parser_feed' src/elm327/elm327.c
          grep -q 'return link_elm327_can_decode_pdu' src/elm327/can.c
          grep -q 'return link_elm327_session_begin' src/elm327/session.c
          grep -q 'link_diagnostic_flow_accept_response' src/link/platform/apple/LinkDiagnosticsController.m
          grep -q 'LinkDiagnosticsController' platform/apple/MBLinkDiagnosticsController.m
          grep -q 'link_diagnostic_flow_resume_after_manufacturer' src/link/platform/apple/LinkDiagnosticsController.m
          grep -q 'src/core/diagnostic_flow.c' src/core/mblink.c
          ! grep -q 'MBLinkDiagnosticsPhase' platform/apple/MBLinkDiagnosticsController.m
          test "$(wc -c < src/obd2/obd2.c)" -lt 1024
          test "$(wc -c < src/uds/uds.c)" -lt 2048
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: Ubuntu / ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DMBLINK_ENABLE_SANITIZERS=ON
      - run: cmake --build build-sanitized --parallel
      - run: ctest --test-dir build-sanitized --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  linux-app:
    name: Linux / GTK4 + DEB + RUN
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake dpkg-dev libgtk-4-dev libbluetooth-dev libusb-1.0-0-dev pkg-config xvfb xauth
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DMBLINK_BUILD_LINUX_APP=ON -DMBLINK_BUILD_PROFILE=generic -DBUILD_TESTING=OFF
      - run: cmake --build build-linux --parallel
      - name: Verify native Tactrix provider is linked
        shell: bash
        run: |
          set -euo pipefail
          ldd ./build-linux/mblink-linux | grep -Fq 'libusb-1.0.so'
          strings ./build-linux/mblink-linux | grep -Fq 'OP2:Tactrix OpenPort 2.0'
      - name: Verify offline C207 replay reaches visible ORC fault
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/c207-replay.log"
          timeout 20s xvfb-run -a ./build-linux/mblink-linux --replay-c207-verify | tee "$log"
          grep -Fq 'MBLINK replay verified: ORC seatbelt/airbag fault B00013 visible' "$log"
      - name: Verify Linux About and branding
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'mblink_linux_show_about' app/linux/main.c
          grep -Fq 'Copyright © 2026 Shannon Smith' app/linux/about-dialog.c
          grep -Fq 'Generic / APT package' app/linux/about-dialog.c
          grep -Fq 'Native / local machine compile' app/linux/about-dialog.c
          test -s app/linux/assets/mblink-emblem.png
      - name: Package DEB and native RUN
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/cpack"
          cpack --config build-linux/CPackConfig.cmake -G DEB -B "$RUNNER_TEMP/cpack"
          deb_src="$(find "$RUNNER_TEMP/cpack" -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb_src"
          dpkg-deb -c "$deb_src" | grep -Fq './usr/lib/udev/rules.d/60-link-openport2.rules'
          dpkg-deb -f "$deb_src" Depends | grep -Eq '(^|, )libusb-1\.0-0([ (]|,|$)'
          install -m 0644 "$deb_src" "$RUNNER_TEMP/release/MBLINK-${VERSION}-linux-amd64.deb"
          scripts/build-native-installer.sh "$RUNNER_TEMP/release/MBLINK-${VERSION}-linux-native.run"
          "$RUNNER_TEMP/release/MBLINK-${VERSION}-linux-native.run" --help >/dev/null
          native_deb="$RUNNER_TEMP/mblink_${VERSION}+native1_amd64.deb"
          "$RUNNER_TEMP/release/MBLINK-${VERSION}-linux-native.run" --build-only --output "$native_deb"
          test "$(dpkg-deb -f "$native_deb" Package)" = mblink
          test "$(dpkg-deb -f "$native_deb" Version)" = "${VERSION}+native1"
          dpkg-deb -c "$native_deb" | grep -Fq './usr/lib/udev/rules.d/60-link-openport2.rules'
          dpkg-deb -f "$native_deb" Depends | grep -Eq '(^|, )libusb-1\.0-0([ (]|,|$)'
          dpkg --compare-versions "${VERSION}+native1" gt "${VERSION}"
          test -s "$RUNNER_TEMP/release/MBLINK-${VERSION}-linux-amd64.deb"
          test -s "$RUNNER_TEMP/release/MBLINK-${VERSION}-linux-native.run"
      - uses: actions/upload-artifact@v4
        with:
          name: MBLINK-${{ steps.version.outputs.version }}-linux-packages
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  windows-discover:
    name: Windows / MBLINK Discover launch-verified
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Verify shared modern Windows shell and canonical icon source
        shell: pwsh
        run: |
          $icon = 'app/ios/MBLINK/Assets.xcassets/AppIcon.appiconset/AppIcon-60@3x.png'
          if (-not (Test-Path $icon)) { throw 'Canonical MBLINK AppIcon PNG is missing' }
          $ui = 'src/link/platform/windows/link-discover-ui.c'
          foreach ($needle in @('create_main_menu','IDM_HELP_ABOUT','TaskDialogIndirect','InitCommonControlsEx','LINK_PRODUCT_WEBSITE')) {
            if (-not (Select-String -Path $ui -SimpleMatch $needle -Quiet)) { throw "Missing shared Windows feature: $needle" }
          }
          if (-not (Test-Path 'src/link/platform/windows/smoke-launch.ps1')) { throw 'Missing launch smoke test' }
          if (Test-Path 'app/windows/mblink.ico') { throw 'Independent MBLINK ICO must not be maintained' }
          if (Test-Path 'app/windows/mblink.rc') { throw 'Independent MBLINK RC must not be maintained' }
      - name: Configure Win32 build
        shell: pwsh
        run: cmake -S . -B build-win32 -A Win32 -DCMAKE_BUILD_TYPE=Release -DMBLINK_BUILD_WINDOWS_DISCOVER=ON -DBUILD_TESTING=OFF
      - name: Build MBLINK Discover
        shell: pwsh
        run: cmake --build build-win32 --config Release --target mblink-discover --parallel
      - name: Reject dynamic Visual C++ runtime dependencies
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe is unavailable' }
          $dumpbin = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x86\dumpbin.exe' | Select-Object -First 1)
          if (-not $dumpbin -or -not (Test-Path $dumpbin)) { throw 'Unable to locate dumpbin.exe' }
          $deps = (& $dumpbin /DEPENDENTS build-win32/Release/mblink-discover.exe | Out-String)
          Write-Host $deps
          foreach ($dll in @('VCRUNTIME140.dll','VCRUNTIME140_1.dll','MSVCP140.dll','ucrtbased.dll')) {
            if ($deps -match [regex]::Escape($dll)) { throw "Unexpected dynamic runtime dependency: $dll" }
          }
      - name: Prove the EXE launches
        shell: pwsh
        run: |
          & 'src/link/platform/windows/smoke-launch.ps1' -Executable 'build-win32/Release/mblink-discover.exe' -ExpectedTitle 'MBLINK Discover'
      - name: Verify embedded version metadata and icon
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build-win32/Release/mblink-discover.exe').Path
          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductVersion -notlike '${{ steps.version.outputs.version }}*') { throw "Wrong ProductVersion: $($info.ProductVersion)" }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) { throw 'Executable has no associated icon' }
          $icon.Dispose()
      - name: Stage Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item build-win32/Release/mblink-discover.exe "release-assets/MBLINK-${{ steps.version.outputs.version }}-windows-discover.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: MBLINK-${{ steps.version.outputs.version }}-windows-discover
          path: release-assets/MBLINK-${{ steps.version.outputs.version }}-windows-discover.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  apple-ios:
    name: iOS / Xcode / ${{ matrix.configuration }}
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status="$(git submodule status --recursive)"
          ! grep -Eq '^[+-U]' <<<"$status"
          grep -Fq '#include "../link/src/uds/uds_services.c"' src/uds/uds.c
          grep -q 'link_diagnostic_flow_accept_response' src/link/platform/apple/LinkDiagnosticsController.m
          grep -q 'LinkDiagnosticsController' platform/apple/MBLinkDiagnosticsController.m
          grep -q 'link_diagnostic_flow_resume_after_manufacturer' src/link/platform/apple/LinkDiagnosticsController.m
          grep -q 'Image("MBLINKEmblem")' app/ios/MBLINK/MBLINKApp.swift
          grep -Fq 'Copyright © 2026 Shannon Smith' app/ios/MBLINK.xcodeproj/project.pbxproj
      - name: Build simulator
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          xcodebuild -project app/ios/MBLINK.xcodeproj -scheme MBLINK \
            -configuration "${{ matrix.configuration }}" -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" build

  iphone-device-ipa:
    name: iPhone / unsigned device IPA
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and package IPA
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/derived"
          xcodebuild -project app/ios/MBLINK.xcodeproj -scheme MBLINK -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            MARKETING_VERSION="$VERSION" build
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$derived/Build/Products/Release-iphoneos/MBLINK.app" "$RUNNER_TEMP/package/Payload/MBLINK.app"
          (cd "$RUNNER_TEMP/package" && zip -qry "$RUNNER_TEMP/MBLINK-${VERSION}-unsigned.ipa" Payload)
          unzip -tq "$RUNNER_TEMP/MBLINK-${VERSION}-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: MBLINK-${{ steps.version.outputs.version }}-unsigned-iphone-ipa
          path: ${{ runner.temp }}/MBLINK-${{ steps.version.outputs.version }}-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish complete atomic release
    needs: [portable-core, sanitizers, linux-app, windows-discover, apple-ios, iphone-device-ipa]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          link_version="$(tr -d '[:space:]' < src/link/VERSION)"
          common_version="$(tr -d '[:space:]' < src/link/src/infiltratr-common/VERSION)"
          subject="$(git log -1 --format=%s "$GITHUB_SHA")"
          if [[ "$subject" != "Release ${version}" && "$subject" != "Release ${version}:"* ]]; then
            echo "Release commit subject must begin with Release ${version}." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "link_version=$link_version" >> "$GITHUB_OUTPUT"
          echo "common_version=$common_version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: MBLINK-${{ steps.release.outputs.version }}-unsigned-iphone-ipa
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: MBLINK-${{ steps.release.outputs.version }}-linux-packages
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: MBLINK-${{ steps.release.outputs.version }}-windows-discover
          path: release-assets
      - name: Build complete source archive and checksums
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for file in \
            "MBLINK-${VERSION}-unsigned.ipa" \
            "MBLINK-${VERSION}-linux-amd64.deb" \
            "MBLINK-${VERSION}-linux-native.run" \
            "MBLINK-${VERSION}-windows-discover.exe"; do
            test -s "release-assets/$file"
          done
          staging="$RUNNER_TEMP/MBLINK-${VERSION}"
          mkdir -p "$staging"
          rsync -a --exclude='.git' --exclude='release-assets' ./ "$staging/"
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/release-assets/MBLINK-${VERSION}-source.zip" "MBLINK-${VERSION}")
          (cd release-assets && sha256sum MBLINK-* > SHA256SUMS.txt)
      - name: Create exact tag and publish all assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          LINK_VERSION: ${{ steps.release.outputs.link_version }}
          COMMON_VERSION: ${{ steps.release.outputs.common_version }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Release tag $TAG already exists; published releases are immutable." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; published releases are immutable." >&2
            exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" \
            --title "MBLINK $VERSION" \
            --notes "MBLINK $VERSION: complete launch-verified release on LINK $LINK_VERSION and Infiltratr Common $COMMON_VERSION, with the shared C11 diagnostic-flow controller and Mercedes extension hook, shared OBD-II/UDS/CAN-FD engines, shared Windows Discover shell, static Windows runtime and canonical MBLINK AppIcon branding."
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for expected in \
            "MBLINK-${VERSION}-unsigned.ipa" \
            "MBLINK-${VERSION}-linux-amd64.deb" \
            "MBLINK-${VERSION}-linux-native.run" \
            "MBLINK-${VERSION}-windows-discover.exe" \
            "MBLINK-${VERSION}-source.zip" \
            "SHA256SUMS.txt"; do
            grep -Fxq "$expected" <<<"$assets"
          done

# SPDX-License-Identifier: GPL-3.0-or-later
name: MBLINK CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-core:
    name: ${{ matrix.os }} / C11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: Ubuntu / ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DMBLINK_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build-sanitized

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure

  linux-app:
    name: Linux / GTK4 app
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GTK4 development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev

      - name: Configure Linux app
        run: >-
          cmake -S . -B build-linux-app
          -DCMAKE_BUILD_TYPE=Release
          -DMBLINK_BUILD_LINUX_APP=ON
          -DBUILD_TESTING=OFF

      - name: Build Linux app
        run: cmake --build build-linux-app --target mblink-linux

  apple-ios:
    name: iOS / Xcode / ${{ matrix.configuration }}
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Xcode version metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          count="$(grep -c "MARKETING_VERSION = ${version};" app/ios/MBLINK.xcodeproj/project.pbxproj)"
          test "${count}" -eq 4

      - name: Verify Apple ELM parser boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'mblink_elm327_parser_feed' platform/apple/MBLinkBLETransport.m
          grep -q 'mblink_elm327_parser_finish' platform/apple/MBLinkBLETransport.m
          ! grep -q 'componentsSeparatedByCharactersInSet' platform/apple/MBLinkBLETransport.m

      - name: Verify C ownership boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'mblink_scheduler_next' platform/apple/MBLinkDiagnosticsController.m
          grep -q 'mblink_telemetry_store_record' platform/apple/MBLinkDiagnosticsController.m
          grep -q 'mblink_telemetry_recorder_record_sample' platform/apple/MBLinkDiagnosticsController.m
          grep -q 'mblink_telemetry_recorder_record_response' platform/apple/MBLinkDiagnosticsController.m

          test "$(grep -c 'uds.c in Sources' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 2
          grep -q 'path = "../../src/uds/uds.c"' app/ios/MBLINK.xcodeproj/project.pbxproj
          ! grep -q 'mblink/isotp.h' include/mblink/uds.h src/uds/uds.c

          test "$(grep -c 'mercedes.c in Sources' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 2
          grep -q 'path = "../../src/mercedes/mercedes.c"' app/ios/MBLINK.xcodeproj/project.pbxproj
          test "$(grep -c 'parameter.c in Sources' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 2
          grep -q 'path = "../../src/core/parameter.c"' app/ios/MBLINK.xcodeproj/project.pbxproj

          test "$(tr -d '[:space:]' < src/infiltratr-common/VERSION)" = "1.8.0"
          grep -q 'set(MBLINK_COMMON_COMMIT "318b1babc7343403ae5e222ea01235a0fc84d752")' CMakeLists.txt
          test "$(grep -c 'timing.c in Sources' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 1
          grep -q 'path = "../../src/infiltratr-common/src/timing.c"' app/ios/MBLINK.xcodeproj/project.pbxproj
          grep -q 'infiltratr_periodic_deadline_advance' src/core/scheduler.c

          grep -q 'mblink/parameter.h' app/ios/MBLINK/MBLINK-Bridging-Header.h
          grep -q 'mblink_parameter_obd2_definition_count' app/ios/MBLINK/ConnectionViewModel.swift
          grep -q 'diagnosticParameters' app/ios/MBLINK/ContentView.swift
          ! grep -q 'String(format:' app/ios/MBLINK/ContentView.swift
          ! grep -Eq 'hasRPM|hasEngineLoad|applyMeasurement|resetPublishedMeasurements' \
            platform/apple/MBLinkDiagnosticsController.h \
            platform/apple/MBLinkDiagnosticsController.m

          grep -q 'mblink_parameter_store_record' src/core/parameter.c
          grep -q 'MBLINK_PARAMETER_STORE_HISTORY_CAPACITY 1024U' include/mblink/parameter_store.h
          grep -q 'mblink_scheduler_add_parameter' src/core/scheduler.c
          grep -q 'MBLINK_SCHEDULER_MAX_ITEMS 64U' include/mblink/scheduler.h
          grep -q 'mblink-test-parameter-store' CMakeLists.txt
          grep -q 'mblink-test-scheduler-parameters' CMakeLists.txt

      - name: Build iPhone app for simulator
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/mblink-xcodebuild-${{ matrix.configuration }}.log"
          if ! xcodebuild \
            -project app/ios/MBLINK.xcodeproj \
            -scheme MBLINK \
            -configuration "${{ matrix.configuration }}" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build >"$log" 2>&1; then
            echo 'Xcode build failed. Compiler diagnostics:'
            grep -E '(^|: )(error:|warning:)|:[0-9]+:[0-9]+: (error|warning):' "$log" | tail -n 120 || true
            exit 1
          fi
          tail -n 20 "$log"

  iphone-device-ipa:
    name: iPhone / unsigned device IPA
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a plain X.Y.Z version; got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build unsigned iPhone device app
        shell: bash
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/mblink-device-derived"
          log="$RUNNER_TEMP/mblink-xcodebuild-device.log"

          if ! xcodebuild \
            -project app/ios/MBLINK.xcodeproj \
            -scheme MBLINK \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build >"$log" 2>&1; then
            echo 'Unsigned iPhone device build failed. Compiler diagnostics:'
            grep -E '(^|: )(error:|warning:)|:[0-9]+:[0-9]+: (error|warning):' "$log" | tail -n 120 || true
            exit 1
          fi

          app="$derived/Build/Products/Release-iphoneos/MBLINK.app"
          test -d "$app"
          test -x "$app/MBLINK"
          /usr/bin/lipo -info "$app/MBLINK" | grep -q 'arm64'
          tail -n 20 "$log"

      - name: Package unsigned IPA
        shell: bash
        env:
          MBLINK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/mblink-device-derived"
          package="$RUNNER_TEMP/mblink-ipa"
          ipa="$RUNNER_TEMP/MBLINK-${MBLINK_VERSION}-unsigned.ipa"

          rm -rf "$package"
          mkdir -p "$package/Payload"
          /usr/bin/ditto \
            "$derived/Build/Products/Release-iphoneos/MBLINK.app" \
            "$package/Payload/MBLINK.app"

          (
            cd "$package"
            /usr/bin/zip -qry "$ipa" Payload
          )

          test -s "$ipa"
          /usr/bin/unzip -tq "$ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MBLINK-${{ steps.version.outputs.version }}-unsigned-iphone-ipa
          path: ${{ runner.temp }}/MBLINK-${{ steps.version.outputs.version }}-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish version release
    needs: [portable-core, sanitizers, linux-app, apple-ios, iphone-device-ipa]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a plain X.Y.Z version; got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "target=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Download unsigned IPA release asset
        uses: actions/download-artifact@v4
        with:
          name: MBLINK-${{ steps.release.outputs.version }}-unsigned-iphone-ipa
          path: release-assets

      - name: Create or verify tag, GitHub Release and IPA asset
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TARGET: ${{ steps.release.outputs.target }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = process.env.RELEASE_VERSION;
            const tag = process.env.RELEASE_TAG;
            const target = process.env.RELEASE_TARGET;
            const assetName = `MBLINK-${version}-unsigned.ipa`;
            const assetPath = path.join(process.env.GITHUB_WORKSPACE,
                                        'release-assets', assetName);

            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (main.data.commit.sha !== target) {
              core.info(`Skipping stale successful run at ${target}; main is ${main.data.commit.sha}.`);
              return;
            }

            let tagTarget = null;
            try {
              const existingRef = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              tagTarget = existingRef.data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            let release = null;
            try {
              const response = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (release !== null && tagTarget === null) {
              core.setFailed(`${tag} has a GitHub Release but no matching tag ref.`);
              return;
            }
            if (tagTarget !== null && tagTarget !== target) {
              if (release !== null) {
                core.info(`${tag} is already released at ${tagTarget}; current main ${target} is post-release development, so no release action is required.`);
                return;
              }
              core.setFailed(`${tag} exists at ${tagTarget} without a matching GitHub Release. Repair the release state before continuing.`);
              return;
            }
            if (!fs.existsSync(assetPath)) {
              core.setFailed(`Expected IPA release asset is missing: ${assetPath}`);
              return;
            }

            if (tagTarget === null) {
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: target });
              tagTarget = target;
            }
            if (release === null) {
              const response = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: target,
                name: `MBLINK ${version}`,
                generate_release_notes: true,
                draft: false,
                prerelease: false
              });
              release = response.data;
              core.info(`Published ${release.html_url}`);
            } else {
              core.info(`${tag} already identifies this exact commit; checking release assets.`);
            }

            const assets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              { owner, repo, release_id: release.id, per_page: 100 }
            );
            if (assets.some(asset => asset.name === assetName)) {
              core.info(`${assetName} is already attached to ${tag}.`);
              return;
            }

            const data = fs.readFileSync(assetPath);
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: assetName,
              data,
              headers: {
                'content-type': 'application/octet-stream',
                'content-length': data.length
              }
            });
            core.info(`Attached ${assetName} to ${tag}.`);

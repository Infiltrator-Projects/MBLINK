# SPDX-License-Identifier: GPL-3.0-or-later
name: MBLINK CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-core:
    name: ${{ matrix.os }} / C11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: Ubuntu / ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DMBLINK_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build-sanitized

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure

  apple-ios:
    name: iOS / Xcode / ${{ matrix.configuration }}
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Xcode version metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          count="$(grep -c "MARKETING_VERSION = ${version};" app/ios/MBLINK.xcodeproj/project.pbxproj)"
          test "${count}" -eq 4

      - name: Verify Apple ELM parser boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'mblink_elm327_parser_feed' platform/apple/MBLinkBLETransport.m
          grep -q 'mblink_elm327_parser_finish' platform/apple/MBLinkBLETransport.m
          ! grep -q 'componentsSeparatedByCharactersInSet' platform/apple/MBLinkBLETransport.m

      - name: Verify C ownership boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'mblink_scheduler_next' platform/apple/MBLinkDiagnosticsController.m
          grep -q 'mblink_telemetry_store_record' platform/apple/MBLinkDiagnosticsController.m
          grep -q 'mblink_telemetry_recorder_record_sample' platform/apple/MBLinkDiagnosticsController.m
          grep -q 'mblink_telemetry_recorder_record_response' platform/apple/MBLinkDiagnosticsController.m

      - name: Build iPhone app for simulator
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/mblink-xcodebuild-${{ matrix.configuration }}.log"
          if ! xcodebuild \
            -project app/ios/MBLINK.xcodeproj \
            -scheme MBLINK \
            -configuration "${{ matrix.configuration }}" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build >"$log" 2>&1; then
            echo 'Xcode build failed. Compiler diagnostics:'
            grep -E '(^|: )(error:|warning:)|:[0-9]+:[0-9]+: (error|warning):' "$log" | tail -n 120 || true
            exit 1
          fi
          tail -n 20 "$log"

  iphone-device-ipa:
    name: iPhone / unsigned device IPA
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a plain X.Y.Z version; got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build unsigned iPhone device app
        shell: bash
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/mblink-device-derived"
          log="$RUNNER_TEMP/mblink-xcodebuild-device.log"

          if ! xcodebuild \
            -project app/ios/MBLINK.xcodeproj \
            -scheme MBLINK \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build >"$log" 2>&1; then
            echo 'Unsigned iPhone device build failed. Compiler diagnostics:'
            grep -E '(^|: )(error:|warning:)|:[0-9]+:[0-9]+: (error|warning):' "$log" | tail -n 120 || true
            exit 1
          fi

          app="$derived/Build/Products/Release-iphoneos/MBLINK.app"
          test -d "$app"
          test -x "$app/MBLINK"
          /usr/bin/lipo -info "$app/MBLINK" | grep -q 'arm64'
          tail -n 20 "$log"

      - name: Compile MBLINK app icon
        shell: bash
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/mblink-device-derived"
          app="$derived/Build/Products/Release-iphoneos/MBLINK.app"
          icon_set="app/ios/MBLINK/Assets.xcassets/AppIcon.appiconset"
          source_jpg="$icon_set/MBLINK-AppIcon-source.jpg"
          icon_png="$icon_set/MBLINK-AppIcon-1024.png"
          partial="$RUNNER_TEMP/mblink-appicon-info.plist"

          test -s "$source_jpg"
          /usr/bin/sips -s format png "$source_jpg" --out "$icon_png" >/dev/null

          width="$(/usr/bin/sips -g pixelWidth "$icon_png" | awk '/pixelWidth/ {print $2}')"
          height="$(/usr/bin/sips -g pixelHeight "$icon_png" | awk '/pixelHeight/ {print $2}')"
          test "$width" = 1024
          test "$height" = 1024

          /usr/bin/xcrun actool \
            app/ios/MBLINK/Assets.xcassets \
            --compile "$app" \
            --platform iphoneos \
            --minimum-deployment-target 17.0 \
            --target-device iphone \
            --app-icon AppIcon \
            --output-partial-info-plist "$partial" \
            --warnings \
            --notices

          APP_PATH="$app" PARTIAL_PLIST="$partial" /usr/bin/python3 - <<'PY'
          import os
          import plistlib

          app_plist = os.path.join(os.environ["APP_PATH"], "Info.plist")
          partial_plist = os.environ["PARTIAL_PLIST"]

          with open(app_plist, "rb") as handle:
              info = plistlib.load(handle)
          with open(partial_plist, "rb") as handle:
              icon_info = plistlib.load(handle)

          info.update(icon_info)
          with open(app_plist, "wb") as handle:
              plistlib.dump(info, handle, fmt=plistlib.FMT_BINARY)
          PY

          test -f "$app/Assets.car"
          /usr/bin/plutil -p "$app/Info.plist" | grep -q 'AppIcon'

      - name: Package unsigned IPA
        shell: bash
        env:
          MBLINK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/mblink-device-derived"
          package="$RUNNER_TEMP/mblink-ipa"
          ipa="$RUNNER_TEMP/MBLINK-${MBLINK_VERSION}-unsigned.ipa"

          rm -rf "$package"
          mkdir -p "$package/Payload"
          /usr/bin/ditto \
            "$derived/Build/Products/Release-iphoneos/MBLINK.app" \
            "$package/Payload/MBLINK.app"

          (
            cd "$package"
            /usr/bin/zip -qry "$ipa" Payload
          )

          test -s "$ipa"
          /usr/bin/unzip -tq "$ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MBLINK-${{ steps.version.outputs.version }}-unsigned-iphone-ipa
          path: ${{ runner.temp }}/MBLINK-${{ steps.version.outputs.version }}-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish version release
    needs: [portable-core, sanitizers, apple-ios]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a plain X.Y.Z version; got: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "target=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create missing tag and GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TARGET: ${{ steps.release.outputs.target }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = process.env.RELEASE_VERSION;
            const tag = process.env.RELEASE_TAG;
            const target = process.env.RELEASE_TARGET;

            const main = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: 'main'
            });
            if (main.data.commit.sha !== target) {
              core.info(`Skipping stale successful run at ${target}; main is ${main.data.commit.sha}.`);
              return;
            }

            try {
              const existingRelease = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`${tag} already has release ${existingRelease.data.html_url}; nothing to do.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            let tagExists = false;
            try {
              const existingRef = await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`
              });
              tagExists = true;
              if (existingRef.data.object.sha !== target) {
                core.setFailed(`${tag} exists at ${existingRef.data.object.sha} without a release; expected ${target}.`);
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (!tagExists) {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: target
              });
            }

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: target,
              name: `MBLINK ${version}`,
              generate_release_notes: true,
              draft: false,
              prerelease: false
            });

            core.info(`Published ${release.data.html_url}`);

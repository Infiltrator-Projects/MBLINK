# SPDX-License-Identifier: GPL-3.0-or-later
name: Final MBLINK dependency repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Repair product state and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          link_commit='08ba2b4148836df1c9d584456f280ec131ae6778'
          git -C src/link fetch origin "$link_commit"
          git -C src/link checkout "$link_commit"
          git submodule update --init --recursive

          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=None):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {count}')
              if count == 0:
                  raise SystemExit(f'{path}: missing {old!r}')
              p.write_text(s.replace(old, new))

          replace('CMakeLists.txt', 'set(MBLINK_LINK_VERSION "0.9.0")', 'set(MBLINK_LINK_VERSION "0.9.1")', 1)
          replace('CMakeLists.txt', 'set(MBLINK_LINK_COMMIT "669f030d58f7bb0f1fdd2d50ebea77fdf8ca1be2")', 'set(MBLINK_LINK_COMMIT "08ba2b4148836df1c9d584456f280ec131ae6778")', 1)
          replace('.github/workflows/ci.yml', 'LINK_VERSION: 0.9.0', 'LINK_VERSION: 0.9.1', 1)
          replace('.github/workflows/ci.yml', 'LINK_COMMIT: 669f030d58f7bb0f1fdd2d50ebea77fdf8ca1be2', 'LINK_COMMIT: 08ba2b4148836df1c9d584456f280ec131ae6778', 1)
          replace('.github/workflows/ci.yml', 'src/link/src/infiltratr-common/VERSION)" = "1.10.0"', 'src/link/src/infiltratr-common/VERSION)" = "1.11.0"', 1)
          replace('.github/workflows/ci.yml', 'release on LINK 0.9.0 with', 'release on LINK 0.9.1 with', 1)
          replace('app/ios/MBLINK.xcodeproj/project.pbxproj', 'MARKETING_VERSION = 0.7.20;', 'MARKETING_VERSION = 0.7.25;', 4)

          p = Path('README.md')
          s = p.read_text()
          s = s.replace('**Current release: 0.7.24.**', '**Current release: 0.7.25.**')
          s = s.replace('MBLINK pins LINK 0.7.5 at `src/link`. LINK owns and pins Infiltratr Common 1.10.0 beneath it;', 'MBLINK pins LINK 0.9.1 at `src/link`. LINK owns and pins Infiltratr Common 1.11.0 beneath it;')
          s = s.replace('LINK is the source of truth for the shared workspace, ISO-TP, byte-stream transport ABI, ELM327 framing/parser/initialisation, ELM-managed CAN, ELM session/probe, parameter/store/scheduler/telemetry runtime, Discover safety/evidence, and the native Windows OpenPort 2.0/J2534 scanner shell.', 'LINK is the source of truth for the shared workspace, ISO-TP, byte-stream transport ABI, ELM327 framing/parser/initialisation, ELM-managed CAN, ELM session/probe, parameter/store/scheduler/telemetry runtime, standard OBD-II, UDS, the portable diagnostic-flow controller, Discover safety/evidence, and the native Windows OpenPort 2.0/J2534 scanner shell.')
          s = s.replace('\nThe next shared migrations are standard OBD-II and UDS.\n', '\n')
          s = s.replace('LINK 0.7.5 supplies a modern native Windows shell', 'LINK 0.9.1 supplies a modern native Windows shell')
          p.write_text(s)

          p = Path('docs/COMMON-REUSE.md')
          if p.exists():
              p.write_text(p.read_text().replace('1.10.0', '1.11.0'))
          PY

          rm .github/workflows/zz-fix-final-windows.yml
          git add -A
          git diff --cached --check
          test "$(tr -d '[:space:]' < VERSION)" = '0.7.25'
          test "$(tr -d '[:space:]' < src/link/VERSION)" = '0.9.1'
          test "$(git -C src/link rev-parse HEAD)" = '08ba2b4148836df1c9d584456f280ec131ae6778'
          test "$(tr -d '[:space:]' < src/link/src/infiltratr-common/VERSION)" = '1.11.0'
          test "$(grep -c 'MARKETING_VERSION = 0.7.25;' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 4
          test ! -e .github/workflows/zz-fix-final-windows.yml
          git commit -m 'Repair MBLINK 0.7.25 on LINK 0.9.1'
          git push origin HEAD:main

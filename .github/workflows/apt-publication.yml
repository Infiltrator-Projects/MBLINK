# SPDX-License-Identifier: GPL-3.0-or-later
name: MBLINK APT Publication

on:
  workflow_run:
    workflows: ["MBLINK CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify-apt-publication:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Identify numbered release commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          subject="$(git log -1 --pretty=%s)"
          if [[ "$subject" != "Release $version"* ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Ordinary main commit; no APT publication is expected."
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify central APT catalogue propagation
        if: steps.release.outputs.eligible == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          APP_ID: mblink
        shell: bash
        run: |
          set -euo pipefail
          catalogue='https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json'
          for attempt in $(seq 1 72); do
            if curl -fsS --retry 2 --retry-delay 1 "$catalogue?version=$VERSION&attempt=$attempt" \
              | python3 -c 'import json,sys; app=sys.argv[1]; version=sys.argv[2]; data=json.load(sys.stdin); raise SystemExit(0 if any(item.get("id") == app and str(item.get("version")) == version for item in data) else 1)' "$APP_ID" "$VERSION"; then
              echo "APT repository advertises $APP_ID $VERSION."
              exit 0
            fi
            echo "Waiting for APT publication of $APP_ID $VERSION ($attempt/72)..."
            sleep 10
          done
          echo "::error::Central APT repository did not advertise $APP_ID $VERSION within 12 minutes of the completed release workflow."
          exit 1

name: Apply real-VIN polling handoff fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hal-polling-handoff-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Apply guarded MBLINK 0.7.193 fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/patches/hal_polling_handoff_fix.py
          git -C src/link fetch origin c25568552d75cb6833812cab354ff849ed3cc817
          git -C src/link checkout c25568552d75cb6833812cab354ff849ed3cc817
          test "$(git -C src/link rev-parse HEAD)" = c25568552d75cb6833812cab354ff849ed3cc817
          git add src/link
          git diff --check
          python3 tests/test_pid_architecture.py
          grep -Fq 'livePollingReadyRearmSignature' app/ios/MBLINK/ConnectionViewModel.swift
          grep -Fq 'if (!_shared.isActive || !_shared.isReady) return;' platform/apple/MBLinkDiagnosticsController.m
          grep -Fq 'SIMCTL_CHILD_MBLINK_CI_SIMULATED_POLLING=1' .github/workflows/ci.yml
          grep -Fq '0.7.193' VERSION include/mblink/version.h
          git rm .github/workflows/hal-polling-handoff-fix.yml .github/patches/hal_polling_handoff_fix.py
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add app/ios/MBLINK/ConnectionViewModel.swift platform/apple/MBLinkDiagnosticsController.m tests/test_pid_architecture.py .github/workflows/ci.yml app/ios/MBLINK.xcodeproj/project.pbxproj VERSION include/mblink/version.h src/link
          git commit -m 'Release 0.7.193: guarantee real-VIN polling handoff' -m 'Reapply the complete VIN-scoped polling selection once LINK has built the real live scheduler, re-arm the selection whenever its fingerprint changes, defer recurring Mercedes jobs until standard diagnostic readiness, pin LINK 0.15.16, and make selected RPM/speed live-sample production a permanent iOS CI gate.'
          git push origin HEAD:main

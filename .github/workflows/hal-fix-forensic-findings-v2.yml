# SPDX-License-Identifier: GPL-3.0-or-later
name: HAL forensic findings repair v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hal-fix-forensic-findings-v2.yml

permissions:
  contents: write

concurrency:
  group: hal-mblink-forensic-findings-repair-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply source and CI fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          header = Path('include/mblink/mercedes_transmission.h')
          text = header.read_text()
          anchor = '''bool mblink_mercedes_transmission_decode_live_2130(
              const uint8_t *data,
              size_t data_length,
              MblinkMercedesTransmissionLive2130 *decoded);
          '''
          addition = anchor + '''
          /**
           * True only for controller families where local identifier 0x30 is
           * documented as the transmission actual-values record decoded above.
           * UNKNOWN is deliberately false: route evidence may justify reading
           * 0x30, but it does not prove the controller family's semantics.
           */
          bool mblink_mercedes_transmission_family_uses_2130_actual_values(
              MblinkMercedesTransmissionFamily family);

          /**
           * Family-qualified 21 30 decoder. EGS52 requires the rich RLI-30
           * shape; VGS/NAG2 requires the compact actual-values shape. Other
           * families are rejected even if their namespace also contains 0x30.
           */
          bool mblink_mercedes_transmission_decode_live_2130_for_family(
              MblinkMercedesTransmissionFamily family,
              const uint8_t *data,
              size_t data_length,
              MblinkMercedesTransmissionLive2130 *decoded);
          '''
          if text.count(anchor) != 1:
              raise SystemExit('transmission header anchor mismatch')
          header.write_text(text.replace(anchor, addition, 1))

          source = Path('src/mercedes/transmission.c')
          text = source.read_text()
          compact_anchor = '''    value.actual_gear_code_available = data_length >= 4U;
              value.actual_gear_code = (uint8_t)(data[3] & UINT8_C(0x0f));

              *decoded = value;
          '''
          compact_new = '''    value.actual_gear_code_available = data_length >= 4U;
              value.actual_gear_code = (uint8_t)(data[3] & UINT8_C(0x0f));
              if (value.actual_gear_code > UINT8_C(14)) return false;

              *decoded = value;
          '''
          if text.count(compact_anchor) != 1:
              raise SystemExit('compact decoder anchor mismatch')
          text = text.replace(compact_anchor, compact_new, 1)

          marker = 'bool mblink_mercedes_transmission_decode_egs51_gs218(\n'
          family_impl = '''bool mblink_mercedes_transmission_family_uses_2130_actual_values(
              MblinkMercedesTransmissionFamily family)
          {
              return family == MBLINK_MERCEDES_TRANSMISSION_FAMILY_EGS52 ||
                     family == MBLINK_MERCEDES_TRANSMISSION_FAMILY_VGS_NAG2;
          }

          bool mblink_mercedes_transmission_decode_live_2130_for_family(
              MblinkMercedesTransmissionFamily family,
              const uint8_t *data,
              size_t data_length,
              MblinkMercedesTransmissionLive2130 *decoded)
          {
              if (!mblink_mercedes_transmission_family_uses_2130_actual_values(
                      family) || data == NULL || decoded == NULL) {
                  return false;
              }

              /* Local identifier numbers are family-scoped. Select semantics
               * from controller identity first, then validate response shape. */
              if (family == MBLINK_MERCEDES_TRANSMISSION_FAMILY_EGS52) {
                  if (data_length != 24U ||
                      !mblink_mercedes_transmission_decode_live_2130(
                          data, data_length, decoded)) {
                      return false;
                  }
                  return decoded->rich_layout;
              }

              if (data_length < 10U || data_length >= 24U ||
                  !mblink_mercedes_transmission_decode_live_2130(
                      data, data_length, decoded)) {
                  return false;
              }
              return !decoded->rich_layout;
          }

          '''
          if text.count(marker) != 1:
              raise SystemExit('family decoder insertion anchor mismatch')
          source.write_text(text.replace(marker, family_impl + marker, 1))

          tests = Path('tests/test_mercedes_transmission_core.inc')
          text = tests.read_text()
          compact_test_anchor = '''    CHECK(live.actual_gear_available && live.actual_gear_code == 6U);
              CHECK(!live.target_gear_available);

              uint8_t rich[24] = {0};
          '''
          compact_test_new = '''    CHECK(live.actual_gear_available && live.actual_gear_code == 6U);
              CHECK(!live.target_gear_available);

              CHECK(mblink_mercedes_transmission_family_uses_2130_actual_values(
                  MBLINK_MERCEDES_TRANSMISSION_FAMILY_EGS52));
              CHECK(mblink_mercedes_transmission_family_uses_2130_actual_values(
                  MBLINK_MERCEDES_TRANSMISSION_FAMILY_VGS_NAG2));
              CHECK(!mblink_mercedes_transmission_family_uses_2130_actual_values(
                  MBLINK_MERCEDES_TRANSMISSION_FAMILY_UNKNOWN));
              CHECK(!mblink_mercedes_transmission_family_uses_2130_actual_values(
                  MBLINK_MERCEDES_TRANSMISSION_FAMILY_ULTIMATE_NAG52));
              CHECK(mblink_mercedes_transmission_decode_live_2130_for_family(
                  MBLINK_MERCEDES_TRANSMISSION_FAMILY_VGS_NAG2,
                  data, sizeof(data), &live));
              CHECK(!live.rich_layout);
              CHECK(!mblink_mercedes_transmission_decode_live_2130_for_family(
                  MBLINK_MERCEDES_TRANSMISSION_FAMILY_EGS52,
                  data, sizeof(data), &live));
              CHECK(!mblink_mercedes_transmission_decode_live_2130_for_family(
                  MBLINK_MERCEDES_TRANSMISSION_FAMILY_ULTIMATE_NAG52,
                  data, sizeof(data), &live));
              CHECK(!mblink_mercedes_transmission_decode_live_2130_for_family(
                  MBLINK_MERCEDES_TRANSMISSION_FAMILY_UNKNOWN,
                  data, sizeof(data), &live));

              uint8_t rich[24] = {0};
          '''
          if text.count(compact_test_anchor) != 1:
              raise SystemExit('compact test anchor mismatch')
          text = text.replace(compact_test_anchor, compact_test_new, 1)
          rich_test_anchor = '''    CHECK(live.drive_program_code == 2U);

              rich[6] = UINT8_C(0xff);
          '''
          rich_test_new = '''    CHECK(live.drive_program_code == 2U);
              CHECK(mblink_mercedes_transmission_decode_live_2130_for_family(
                  MBLINK_MERCEDES_TRANSMISSION_FAMILY_EGS52,
                  rich, sizeof(rich), &live));
              CHECK(live.rich_layout);
              CHECK(!mblink_mercedes_transmission_decode_live_2130_for_family(
                  MBLINK_MERCEDES_TRANSMISSION_FAMILY_VGS_NAG2,
                  rich, sizeof(rich), &live));
              CHECK(!mblink_mercedes_transmission_decode_live_2130_for_family(
                  MBLINK_MERCEDES_TRANSMISSION_FAMILY_ULTIMATE_NAG52,
                  rich, sizeof(rich), &live));

              rich[6] = UINT8_C(0xff);
          '''
          if text.count(rich_test_anchor) != 1:
              raise SystemExit('rich test anchor mismatch')
          tests.write_text(text.replace(rich_test_anchor, rich_test_new, 1))

          objc = Path('platform/apple/MBLinkDiagnosticsController.m')
          text = objc.read_text()
          helper_anchor = '''static const char *
          MBLinkMercedesDataProfileKeyForModule(
          '''
          helper = '''/*
           * Exact-route evidence can authorise a safe 21 30 read while family
           * identity is unresolved. A positively identified incompatible family
           * wins over route coincidence; Ultimate NAG52 0x30 is clutch speeds.
           */
          static BOOL MBLinkTransmissionModuleSupportsCanonical2130(
              const MblinkMercedesModuleScanEntry *module)
          {
              if (!MBLinkMercedesModuleIsTransmissionController(module) ||
                  mblink_mercedes_module_scan_entry_protocol(module) !=
                      MBLINK_MERCEDES_DIAGNOSTIC_KWP2000) {
                  return NO;
              }

              const MblinkMercedesTransmissionFamily family =
                  MBLinkTransmissionFamilyForModule(module);
              if (family != MBLINK_MERCEDES_TRANSMISSION_FAMILY_UNKNOWN) {
                  return mblink_mercedes_transmission_family_uses_2130_actual_values(
                      family);
              }

              const size_t evidenceCount =
                  mblink_mercedes_route_evidence_identifier_count(
                      module->tx_can_id, module->rx_can_id, module->extended_id,
                      mblink_mercedes_module_scan_entry_protocol(module),
                      module->kind);
              for (size_t index = 0U; index < evidenceCount; ++index) {
                  const MblinkMercedesRouteEvidenceEntry *entry =
                      mblink_mercedes_route_evidence_identifier_at(
                          module->tx_can_id, module->rx_can_id,
                          module->extended_id,
                          mblink_mercedes_module_scan_entry_protocol(module),
                          module->kind, index);
                  if (entry != NULL && entry->live &&
                      entry->identifier == UINT16_C(0x30)) {
                      return YES;
                  }
              }
              return NO;
          }

          static BOOL MBLinkDecodeTransmissionLive2130(
              const MblinkMercedesModuleScanEntry *module,
              const uint8_t *data,
              size_t dataLength,
              MblinkMercedesTransmissionLive2130 *decoded)
          {
              if (!MBLinkTransmissionModuleSupportsCanonical2130(module))
                  return NO;
              const MblinkMercedesTransmissionFamily family =
                  MBLinkTransmissionFamilyForModule(module);
              if (family != MBLINK_MERCEDES_TRANSMISSION_FAMILY_UNKNOWN) {
                  return mblink_mercedes_transmission_decode_live_2130_for_family(
                      family, data, dataLength, decoded);
              }
              return mblink_mercedes_transmission_decode_live_2130(
                  data, dataLength, decoded);
          }

          '''
          if text.count(helper_anchor) != 1:
              raise SystemExit('Objective-C helper anchor mismatch')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          old_auto = '''        const MblinkMercedesTransmissionFamily family =
                      MBLinkTransmissionFamilyForModule(module);
                  if (mblink_mercedes_transmission_kwp_read_identifier_count_for_family(
                          family) != 0U) {
                      return MBLinkMercedesModuleIdentifier(module);
                  }
          '''
          new_auto = '''        if (MBLinkTransmissionModuleSupportsCanonical2130(module)) {
                      return MBLinkMercedesModuleIdentifier(module);
                  }
          '''
          if text.count(old_auto) != 1:
              raise SystemExit(f'automatic scheduler gate mismatch: {text.count(old_auto)}')
          text = text.replace(old_auto, new_auto, 1)

          decode_old = '''    MblinkMercedesTransmissionLive2130 decoded;
              if (!mblink_mercedes_transmission_decode_live_2130(
                      (const uint8_t *)rli30.rawData.bytes,
                      rli30.rawData.length, &decoded)) return @[];

              NSMutableArray<MBLinkTransmissionLiveValueSnapshot *> *values =
                  [[NSMutableArray alloc] init];
              NSString *quality = decoded.rich_layout
                  ? @"Mercedes GS 21 30 rich response · portable MBLINK decoder · response shape/evidence qualified; ECU family not inferred from route"
                  : @"Mercedes GS 21 30 compact response · portable MBLINK decoder · response shape/evidence qualified; ECU family not inferred from route";
          '''
          decode_new = '''    if (!MBLinkTransmissionModuleSupportsCanonical2130(module)) return @[];
              MblinkMercedesTransmissionLive2130 decoded;
              if (!MBLinkDecodeTransmissionLive2130(
                      module, (const uint8_t *)rli30.rawData.bytes,
                      rli30.rawData.length, &decoded)) return @[];

              const MblinkMercedesTransmissionFamily family =
                  MBLinkTransmissionFamilyForModule(module);
              NSString *qualification = family ==
                      MBLINK_MERCEDES_TRANSMISSION_FAMILY_UNKNOWN
                  ? @"family unresolved · exact-route vehicle-positive evidence"
                  : [NSString stringWithFormat:@"%@ family-qualified",
                      MBLinkStringFromCString(
                          mblink_mercedes_transmission_family_name(family))];
              NSString *quality = [NSString stringWithFormat:
                  @"Mercedes GS 21 30 %@ response · portable MBLINK decoder · %@",
                  decoded.rich_layout ? @"rich" : @"compact", qualification];
              const BOOL pollingEnabled =
                  [self manufacturerLivePollingSupportedForModuleIdentifier:
                      moduleIdentifier] &&
                  [self manufacturerLivePollingEnabledForModuleIdentifier:
                      moduleIdentifier];

              NSMutableArray<MBLinkTransmissionLiveValueSnapshot *> *values =
                  [[NSMutableArray alloc] init];
          '''
          if text.count(decode_old) != 1:
              raise SystemExit('live snapshot decoder anchor mismatch')
          text = text.replace(decode_old, decode_new, 1)
          if text.count('value.pollingEnabled = YES;') != 5:
              raise SystemExit(f'polling flag count mismatch: {text.count("value.pollingEnabled = YES;")}')
          text = text.replace('value.pollingEnabled = YES;',
                              'value.pollingEnabled = pollingEnabled;')
          objc.write_text(text)

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text()
          roadmap_anchor = '- live polling is explicit opt-in and persisted by stable parameter key, preventing the ELM/BLE link from being saturated by every supported PID by default.\n'
          roadmap_new = roadmap_anchor + '- recurring Mercedes GS `21 30` acquisition is serialized through LINK\'s single scheduler; known transmission families must match their own `0x30` semantics, while an unresolved family may use exact-route vehicle-positive evidence plus payload-shape validation without being falsely identified.\n'
          if text.count(roadmap_anchor) != 1:
              raise SystemExit('roadmap anchor mismatch')
          roadmap.write_text(text.replace(roadmap_anchor, roadmap_new, 1))

          ci = Path('.github/workflows/ci.yml').read_text()
          smoke_pattern = re.compile(
              r'''          xcrun simctl install "\$udid" "\$app"\n          launch_output="\$\(xcrun simctl launch "\$udid" com\.github\.The-First-Infiltrator\.MBLINK\)"\n.*?          xcrun simctl terminate "\$udid" com\.github\.The-First-Infiltrator\.MBLINK''',
              re.S)
          smoke_replacement = '''          xcrun simctl install "$udid" "$app"
              launch_output="$(SIMCTL_CHILD_MBLINK_CI_SIMULATED_FLOW=1 xcrun simctl launch "$udid" com.github.The-First-Infiltrator.MBLINK)"
              printf '%s\\n' "$launch_output"
              grep -Fq 'com.github.The-First-Infiltrator.MBLINK' <<<"$launch_output"
              data_container="$(xcrun simctl get_app_container "$udid" com.github.The-First-Infiltrator.MBLINK data)"
              marker="$data_container/Documents/mblink-ci-simulated-flow.ok"
              flow_ready=false
              for attempt in $(seq 1 60); do
                if test -f "$marker" && grep -Fq 'ready=true' "$marker" && grep -Fq 'vin=WDD2073022F123456' "$marker"; then
                  cat "$marker"
                  flow_ready=true
                  break
                fi
                sleep 1
              done
              test "$flow_ready" = true
              xcrun simctl terminate "$udid" com.github.The-First-Infiltrator.MBLINK'''
          ci, count = smoke_pattern.subn(smoke_replacement, ci, count=1)
          if count != 1:
              raise SystemExit(f'iOS simulator smoke replacement count {count}')

          if ci.count('for attempt in $(seq 1 72); do') != 1:
              raise SystemExit('APT poll loop anchor mismatch')
          ci = ci.replace('for attempt in $(seq 1 72); do',
                          'for attempt in $(seq 1 6); do', 1)
          error_line = 'echo "::error::GitHub release was published, but the central APT repository did not advertise $APP_ID $VERSION within 12 minutes."'
          if ci.count(error_line) != 1:
              raise SystemExit(f'APT error line mismatch: {ci.count(error_line)}')
          ci = ci.replace(error_line,
              'echo "::warning::GitHub release is published; central APT catalogue propagation is still pending and is checked independently by MBLINK APT Publication."', 1)
          marker_pos = ci.index('central APT catalogue propagation is still pending')
          exit_pos = ci.find('exit 1', marker_pos)
          if exit_pos < 0 or exit_pos - marker_pos > 400:
              raise SystemExit('APT exit 1 not found near warning')
          ci = ci[:exit_pos] + 'exit 0' + ci[exit_pos + len('exit 1'):]
          Path('.github/ci.proposed.yml').write_text(ci)

          for required in (
              'SIMCTL_CHILD_MBLINK_CI_SIMULATED_FLOW=1',
              'mblink-ci-simulated-flow.ok',
              'for attempt in $(seq 1 6); do',
              'central APT catalogue propagation is still pending'):
              if required not in ci:
                  raise SystemExit(f'proposed CI missing {required}')
          PY
          git diff --check

      - name: Build and test portable core
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build build-macos --parallel
          ctest --test-dir build-macos --output-on-failure

      - name: Build Apple Debug and Release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          for configuration in Debug Release; do
            xcodebuild -project app/ios/MBLINK.xcodeproj -scheme MBLINK \
              -configuration "$configuration" -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/derived-$configuration" \
              CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$VERSION" build
          done

      - name: Publish tested source fixes and proposed CI
        shell: bash
        run: |
          set -euo pipefail
          git add include/mblink/mercedes_transmission.h \
                  src/mercedes/transmission.c \
                  tests/test_mercedes_transmission_core.inc \
                  platform/apple/MBLinkDiagnosticsController.m \
                  docs/ROADMAP.md .github/ci.proposed.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden Mercedes transmission live polling"
          git push origin HEAD:main

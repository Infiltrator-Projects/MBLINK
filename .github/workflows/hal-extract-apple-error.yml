name: HAL extract Apple error

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hal-extract-apple-error.yml

permissions:
  actions: read
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract concise Apple compiler failure
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_JOB_ID: '101399137794'
        shell: bash
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/jobs/${FAILED_JOB_ID}/logs" > /tmp/apple-job.log
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/apple-job.log').read_text(errors='replace').splitlines()
          needles = (' error:', 'fatal error:', 'SwiftCompile', 'CompileSwift', 'Process completed with exit code')
          hits = [i for i, line in enumerate(lines) if any(n in line for n in needles)]
          selected = []
          seen = set()
          for i in hits:
              for j in range(max(0, i-8), min(len(lines), i+9)):
                  if j not in seen:
                      seen.add(j)
                      selected.append((j, lines[j]))
          selected.sort()
          out = '\n'.join(f'{i+1}: {line}' for i, line in selected)
          Path('apple-ci-error-extract.txt').write_text(out + '\n')
          if not out:
              raise SystemExit('No compiler/error markers found in prior Apple log')
          print(out[-12000:])
          PY

      - name: Publish extract and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add apple-ci-error-extract.txt
          git rm .github/workflows/hal-extract-apple-error.yml
          git commit -m "Capture Apple CI compiler failure"
          git push origin HEAD:main

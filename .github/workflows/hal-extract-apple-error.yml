name: HAL extract Apple error 2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hal-extract-apple-error.yml

permissions:
  actions: read
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract exact Apple compiler diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_JOB_ID: '101400126002'
        shell: bash
        run: |
          set -euo pipefail
          gh api --allow-escape-sequences -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/jobs/${FAILED_JOB_ID}/logs" > /tmp/apple-job.log
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/apple-job.log').read_text(errors='replace').splitlines()
          hits = [i for i,l in enumerate(lines) if (' error:' in l or 'fatal error:' in l)]
          if not hits:
              hits = [i for i,l in enumerate(lines) if 'BUILD FAILED' in l or 'Process completed with exit code' in l]
          chosen=[]; seen=set()
          for i in hits:
              for j in range(max(0,i-4), min(len(lines),i+7)):
                  if j not in seen:
                      seen.add(j); chosen.append((j,lines[j]))
          chosen.sort()
          out='\n'.join(f'{i+1}: {l}' for i,l in chosen)
          Path('apple-ci-error-extract.txt').write_text(out+'\n')
          print(out)
          PY

      - name: Publish extract and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add apple-ci-error-extract.txt
          git rm .github/workflows/hal-extract-apple-error.yml
          git commit -m "Capture next Apple CI compiler failure"
          git push origin HEAD:main

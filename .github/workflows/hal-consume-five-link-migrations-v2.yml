name: HAL consume five LINK migrations v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hal-consume-five-link-migrations-v2.yml

permissions:
  contents: write

jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Repin LINK and consume shared state
        shell: bash
        run: |
          set -euo pipefail
          LINK_SHA=9a64aacabb669d63f1797124b7147d7c502753c4
          git -C src/link fetch origin "$LINK_SHA"
          git -C src/link checkout "$LINK_SHA"

          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def class_block(text: str) -> str:
              return textwrap.indent(textwrap.dedent(text).strip() + "\n", "    ")

          cpath = Path("app/ios/MBLINK/ConnectionViewModel.swift")
          s = cpath.read_text()

          if "private let pidSelectionStore = LinkPIDSelectionStore" not in s:
              start = s.index("    private let vehicleProfileStore = LinkVehicleProfileStore(")
              end = s.index("    private var lastConnectionAlertText", start)
              block = class_block('''
              private let pidSelectionStore = LinkPIDSelectionStore(
                  productNamespace: "mblink",
                  legacyGlobalKey: "mblink.polling.enabledStableKeys.v2",
                  legacyVehicleKey: "mblink.pidSelectionsByVehicle.v1")
              ''')
              s = s[:end] + block + s[end:]

          s = s.replace(
              '    private static let pollingDefaultsKey = "mblink.polling.enabledStableKeys.v2"\n', '')
          s = re.sub(
              r'    private static let pidSelectionsByVehicleDefaultsKey =\n\s*"mblink\.pidSelectionsByVehicle\.v1"\n',
              '', s, count=1)

          old = "UserDefaults.standard.set(Array(enabledKeys).sorted(), forKey: Self.pollingDefaultsKey)"
          if old not in s:
              raise SystemExit("setPolling persistence marker missing")
          s = s.replace(old, "pidSelectionStore.setGlobalStableKeys(Array(enabledKeys).sorted())", 1)

          s, count = re.subn(
              r'    var interfaceLocaleIdentifier: String \{\n\s*MBInterfaceLanguage\.canonical\(selectedLanguageID\)\n    \}',
              class_block('''
              var interfaceLocaleIdentifier: String {
                  LinkInterfaceLanguage.canonical(
                      selectedLanguageID, aliases: mbLegacyLanguageAliases)
              }
              ''').rstrip(),
              s, count=1)
          if count != 1:
              raise SystemExit("interface locale replacement failed")

          start = s.index("    private func storedPIDSelectionsByVehicle()")
          end = s.index("    private func supportedStableKeys", start)
          s = s[:start] + s[end:]

          start = s.index("    private func modulePIDSelectionSet(moduleID: String) -> Set<String> {")
          end = s.index("    private func storeModulePIDSelection(", start)
          block = class_block('''
          private func modulePIDSelectionSet(moduleID: String) -> Set<String> {
              let supported = supportedStableKeys(moduleID: moduleID)
              guard !supported.isEmpty else { return [] }

              guard let vin = effectivePIDConfigurationVIN else {
                  return Set(pidSelectionStore.globalStableKeys).intersection(supported)
              }
              if pidSelectionStore.hasSelection(
                  forVIN: vin, controllerIdentifier: moduleID) {
                  return Set(pidSelectionStore.stableKeys(
                      forVIN: vin, controllerIdentifier: moduleID)).intersection(supported)
              }
              // A global legacy choice may seed only the exact responder that
              // advertised it; LINK owns persistence after that migration.
              return Set(pidSelectionStore.globalStableKeys).intersection(supported)
          }
          ''') + "\n"
          s = s[:start] + block + s[end:]

          start = s.index("    private func storeModulePIDSelection(")
          end = s.index("    private func applyConfiguredPollingForSelectedVehicle()", start)
          block = class_block('''
          private func storeModulePIDSelection(
              _ selection: Set<String>,
              moduleID: String
          ) {
              let boundedSelection =
                  selection.intersection(supportedStableKeys(moduleID: moduleID))

              guard let vin = effectivePIDConfigurationVIN else {
                  pidSelectionStore.setGlobalStableKeys(Array(boundedSelection).sorted())
                  return
              }

              pidSelectionStore.setStableKeys(
                  Array(boundedSelection).sorted(),
                  forVIN: vin,
                  controllerIdentifier: moduleID)
          }
          ''') + "\n"
          s = s[:start] + block + s[end:]

          s, count = re.subn(
              r'        UserDefaults\.standard\.set\(\n\s*Array\(selectedKeys\)\.sorted\(\), forKey: Self\.pollingDefaultsKey\)',
              '        pidSelectionStore.setGlobalStableKeys(Array(selectedKeys).sorted())',
              s, count=1)
          if count != 1:
              raise SystemExit("configured polling persistence replacement failed")

          start = s.index("    private func refreshSavedVehicleProfiles() {")
          end = s.index("    private func storedPollingKeys() -> Set<String> {", start)
          block = class_block('''
          private func refreshSavedVehicleProfiles() {
              var summaries = [SavedVehicleProfileSummary]()
              for profile in vehicleProfileStore.savedProfiles {
                  guard let vin = profile["vin"] as? String, vin.count == 17 else { continue }
                  let modules = profile["modules"] as? [[String: Any]] ?? []
                  let fallbackDisplayName =
                      decodeVehicleIdentity(vin: vin)?.model ?? "Mercedes-Benz vehicle"
                  if let summary = SavedVehicleProfileSummary(
                      profile: profile as NSDictionary,
                      moduleCount: modules.count,
                      fallbackDisplayName: fallbackDisplayName) {
                      summaries.append(summary)
                  }
              }
              savedVehicleProfiles = summaries.sorted {
                  ($0.updatedAt ?? .distantPast) > ($1.updatedAt ?? .distantPast)
              }

              if let selectedVehicleVIN,
                 savedVehicleProfiles.contains(where: { $0.vin == selectedVehicleVIN }) {
                  return
              }

              selectedVehicleVIN = nil
              vehicleProfileStore.clearSelectedVehicle()
          }
          ''') + "\n"
          s = s[:start] + block + s[end:]

          start = s.index("    private func storedPollingKeys() -> Set<String> {")
          end = s.index("    private func standardStableKey(for pid: UInt8) -> String {", start)
          block = class_block('''
          private func storedPollingKeys() -> Set<String> {
              if pidSelectionStore.hasGlobalSelection {
                  return Set(pidSelectionStore.globalStableKeys)
              }

              // One-time compatibility decision for the old automatic v1 set.
              // LINK owns all standard PID persistence after this point.
              let defaults = UserDefaults.standard
              var initial = Set<String>()
              if let legacyValues =
                  defaults.array(forKey: Self.legacyPollingDefaultsKey) as? [String] {
                  let legacy = Set(legacyValues)
                  if legacy != Self.legacyAutomaticPollingStableKeys {
                      initial = legacy
                  }
              }

              pidSelectionStore.setGlobalStableKeys(Array(initial).sorted())
              return initial
          }
          ''') + "\n"
          s = s[:start] + block + s[end:]

          s, count = re.subn(
              r'controller\.setSelectedLanguageTag\(\s*MBInterfaceLanguage\.canonical\(legacy\)\)',
              'controller.setSelectedLanguageTag(\n                LinkInterfaceLanguage.canonical(\n                    legacy, aliases: mbLegacyLanguageAliases))',
              s, count=1)
          if count != 1:
              raise SystemExit("legacy language migration replacement failed")

          forbidden = [
              "pollingDefaultsKey",
              "pidSelectionsByVehicleDefaultsKey",
              "storedPIDSelectionsByVehicle",
              'profile["liveResponders"]'
          ]
          for value in forbidden:
              if value in s:
                  raise SystemExit(f"local shared implementation still present: {value}")
          cpath.write_text(s)

          apath = Path("app/ios/MBLINK/MBLINKApp.swift")
          a = apath.read_text()
          start = a.index("struct MBInterfaceLanguage: Identifiable, Hashable {")
          end = a.index("private var mblinkAboutInfo:", start)
          replacement = textwrap.dedent('''
          let mbLegacyLanguageAliases: [String: String] = [
              "en": "en-AU",
              "de": "de-DE",
              "pl": "pl-PL"
          ]

          typealias MBInterfaceLanguage = LinkInterfaceLanguage

          ''')
          a = a[:start] + replacement + a[end:]
          if "struct MBInterfaceLanguage:" in a:
              raise SystemExit("local language catalogue still present")
          apath.write_text(a)

          ppath = Path("app/ios/MBLINK.xcodeproj/project.pbxproj")
          p = ppath.read_text()
          target = "9a64aacabb669d63f1797124b7147d7c502753c4"
          p, count = re.subn(
              r'(LINK_SOURCE_REVISION = )[0-9a-f]{40}(;)',
              rf'\g<1>{target}\g<2>', p)
          if count != 2:
              raise SystemExit(f"expected 2 LINK_SOURCE_REVISION entries, got {count}")
          ppath.write_text(p)
          PY

          git diff --check

      - name: Record repin before validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add src/link \
                  app/ios/MBLINK/ConnectionViewModel.swift \
                  app/ios/MBLINK/MBLINKApp.swift \
                  app/ios/MBLINK.xcodeproj/project.pbxproj
          git diff --cached --check
          git commit -m "Consume five small LINK migrations"
          test "$(git ls-tree HEAD src/link | awk '{print $3}')" = "9a64aacabb669d63f1797124b7147d7c502753c4"

      - name: Validate MBLINK shared core
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DBUILD_TESTING=ON
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          rm -rf build

      - name: Publish MBLINK migration
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main

name: Repin Apple LINK revision

on:
  push:
    paths:
      - '.github/workflows/repin-link-apple.yml'

permissions:
  contents: write

jobs:
  repin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Repin exact LINK revision used by Xcode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/ios/MBLINK.xcodeproj/project.pbxproj')
          text = path.read_text()
          old = 'a2e0fbea8378ac96b67f1868b875d1a3718f91f4'
          new = '79c7e3d71c52ce90aec1baa94b914f31ecbbcc76'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 Apple LINK pins, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add app/ios/MBLINK.xcodeproj/project.pbxproj
          git commit -m 'iOS: pin vehicle-first LINK release'
          git push origin HEAD:main

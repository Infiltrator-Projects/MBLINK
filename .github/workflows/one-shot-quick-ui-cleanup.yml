# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot MBLINK quick UI cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-quick-ui-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply five quick cleanups
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/ios/MBLINK/MBLINKApp.swift')
          s = path.read_text()

          # 1) Mercedes-me-style aqua is for active/live state only. Keep green
          # for successful/healthy diagnostic outcomes.
          anchor = '    static let line = Color(red: 0.24, green: 0.26, blue: 0.29)\n'
          assert anchor in s
          s = s.replace(anchor, anchor + '    static let active = Color(red: 0.00, green: 0.78, blue: 0.86)\n', 1)

          old = '''private struct MBStatusPill: View {
              let text: String
              let active: Bool

              var body: some View {
                  LinkStatusPill(text: text, active: active)
              }
          }
          '''
          new = '''private struct MBStatusPill: View {
              let text: String
              let active: Bool

              var body: some View {
                  HStack(spacing: 7) {
                      Circle()
                          .fill(active ? MBBrand.active : MBBrand.muted)
                          .frame(width: 7, height: 7)
                      Text(LocalizedStringKey(text))
                          .textCase(.uppercase)
                          .font(MBTypography.caption2Bold)
                          .tracking(0.8)
                          .lineLimit(1)
                  }
                  .foregroundStyle(MBBrand.silverBright)
                  .padding(.horizontal, 10)
                  .padding(.vertical, 7)
                  .background(Capsule().fill(MBBrand.panelRaised))
                  .overlay(Capsule().stroke(MBBrand.line, lineWidth: 1))
              }
          }
          '''
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('.foregroundStyle(connection.isReady ? MBBrand.success : MBBrand.silver)',
                        '.foregroundStyle(connection.isReady ? MBBrand.active : MBBrand.silver)', 1)
          s = s.replace('.tint(MBBrand.success)', '.tint(MBBrand.active)')

          # 2) Keep the home screen focused on the five jobs used during a live
          # diagnostic session; the remaining jobs stay one tap away below.
          p0 = s.index('    private var primaryGrid: some View {')
          p1 = s.index('    private var supportingTools: some View {', p0)
          s = s[:p0] + '''    private var primaryGrid: some View {
              LinkDiagnosticGrid {
                  LinkTaskTile(.vehicle) { MBVehicleView() }
                  LinkTaskTile(.errors) { MBFaultsView() }
                  LinkTaskTile(.dashboard) { MBDashboardView() }
                  LinkTaskTile(.table) { MBDataTableView() }
                  LinkTaskTile(.graph) { MBGraphsView() }
              }
          }

          ''' + s[p1:]

          t0 = s.index('    private var supportingTools: some View {')
          t1 = s.index('    private var connectionProgress: some View {', t0)
          supporting = '''    private var supportingTools: some View {
              VStack(alignment: .leading, spacing: 14) {
                  MBPanel {
                      VStack(alignment: .leading, spacing: 9) {
                          MBSectionHeader(title: "Vehicle setup", kicker: "Current / saved / new")
                          MBCompactLink(
                              "Saved Vehicles & PIDs",
                              "Load a saved VIN and configure each controller's advertised PIDs offline",
                              "list.bullet.rectangle.portrait.fill"
                          ) { MBPIDSetupView() }

                          Divider().overlay(MBBrand.line)

                          Button {
                              connection.connect()
                          } label: {
                              HStack(alignment: .center, spacing: 12) {
                                  Image(systemName: "plus.circle.fill")
                                      .font(MBTypography.title3)
                                      .foregroundStyle(MBBrand.silverBright)
                                      .frame(width: 30)
                                  VStack(alignment: .leading, spacing: 3) {
                                      Text("Add / Scan New Vehicle")
                                          .font(MBTypography.subheadlineBold)
                                          .foregroundStyle(MBBrand.silverBright)
                                      Text("Read the connected car's VIN; load its saved profile if known, otherwise create a new one")
                                          .font(MBTypography.caption)
                                          .foregroundStyle(MBBrand.muted)
                                          .fixedSize(horizontal: false, vertical: true)
                                  }
                                  Spacer()
                                  Image(systemName: "chevron.right")
                                      .foregroundStyle(MBBrand.muted)
                              }
                              .contentShape(Rectangle())
                          }
                          .buttonStyle(.plain)
                          .disabled(connection.isActive)
                          .opacity(connection.isActive ? 0.45 : 1.0)
                      }
                  }

                  MBSectionHeader(
                      title: "More diagnostics",
                      kicker: "Evidence, tests, services and preferences")
                  LinkDiagnosticGrid {
                      LinkTaskTile(.log) { MBEvidenceView() }
                      LinkTaskTile(.tests) { MBTestsView() }
                      LinkTaskTile(.services) { MBServicesView() }
                      LinkTaskTile(.settings) { MBSettingsView() }
                  }
              }
          }

          '''
          s = s[:t0] + supporting + s[t1:]

          # 3) The user explicitly does not want a 'show unavailable/unsupported'
          # preference. Unsupported catalogue rows remain out of the normal table.
          s = s.replace('    @AppStorage("mblink.showUnsupportedParameters.v2") private var showUnsupportedParameters = false\n', '', 1)
          old_filter = '''        connection.diagnosticParameters
                  .filter { showUnsupportedParameters || $0.isSupported || $0.isAvailable }
                  .sorted { $0.title < $1.title }
          '''
          new_filter = '''        connection.diagnosticParameters
                  .filter { $0.isSupported || $0.isAvailable }
                  .sorted { $0.title < $1.title }
          '''
          assert old_filter in s
          s = s.replace(old_filter, new_filter, 1)

          old_panel = '''                    MBPanel {
                          VStack(alignment: .leading, spacing: 9) {
                              Toggle("Show unsupported catalogue entries",
                                     isOn: $showUnsupportedParameters)
                                  .font(MBTypography.subheadlineBold)
                                  .foregroundStyle(MBBrand.silverBright)
                              Text("Not polled = supported by the vehicle but disabled. Waiting for sample = polling is enabled but no value has arrived yet. Not advertised = the vehicle did not report support for that PID.")
                                  .font(MBTypography.caption)
                                  .foregroundStyle(MBBrand.muted)
                                  .fixedSize(horizontal: false, vertical: true)
                          }
                      }

          '''
          assert old_panel in s
          s = s.replace(old_panel, '', 1)

          # 4) Give graph cards useful at-a-glance statistics without changing
          # telemetry or graph-selection behaviour.
          graph_anchor = '''                                    HStack {
                                          Text(LocalizedStringKey(parameter.title))
                                              .font(MBTypography.headline)
                                              .foregroundStyle(MBBrand.silverBright)
                                          Spacer()
                                          Text(parameter.formattedValue)
                                              .font(MBTypography.headline)
                                              .foregroundStyle(MBBrand.silverBright)
                                      }
                                      if parameter.history.count > 1 {
          '''
          graph_new = '''                                    HStack {
                                          Text(LocalizedStringKey(parameter.title))
                                              .font(MBTypography.headline)
                                              .foregroundStyle(MBBrand.silverBright)
                                          Spacer()
                                          Text(parameter.formattedValue)
                                              .font(MBTypography.headline)
                                              .foregroundStyle(MBBrand.silverBright)
                                      }
                                      if let minimum = parameter.history.min(),
                                         let maximum = parameter.history.max() {
                                          HStack(spacing: 14) {
                                              Text("MIN \\(minimum.formatted()) \\(parameter.suffix)")
                                              Text("MAX \\(maximum.formatted()) \\(parameter.suffix)")
                                              Spacer()
                                              Text("\\(parameter.history.count) samples")
                                          }
                                          .font(MBTypography.caption2Bold)
                                          .foregroundStyle(MBBrand.muted)
                                      }
                                      if parameter.history.count > 1 {
          '''
          assert graph_anchor in s
          s = s.replace(graph_anchor, graph_new, 1)

          path.write_text(s)
          PY

          # 5) Text-level regression checks for the quick cleanup.
          grep -Fq 'static let active = Color(red: 0.00, green: 0.78, blue: 0.86)' app/ios/MBLINK/MBLINKApp.swift
          grep -Fq 'title: "More diagnostics"' app/ios/MBLINK/MBLINKApp.swift
          ! grep -Fq 'Show unsupported catalogue entries' app/ios/MBLINK/MBLINKApp.swift
          grep -Fq 'Text("MIN \\(minimum.formatted()) \\(parameter.suffix)")' app/ios/MBLINK/MBLINKApp.swift
          test "$(grep -Fc 'LinkTaskTile(.services)' app/ios/MBLINK/MBLINKApp.swift)" -eq 1

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/ios/MBLINK/MBLINKApp.swift
          git commit -m 'Polish MBLINK quick UI cleanup'
          git push origin HEAD:main

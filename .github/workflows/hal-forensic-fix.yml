# SPDX-License-Identifier: GPL-3.0-or-later
# One-shot forensic fix. Workflow/helper cleanup is performed after the tested release lands.
name: HAL MBLINK forensic fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hal-forensic-fix.yml

permissions:
  contents: write

concurrency:
  group: hal-mblink-forensic-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Pin released LINK 0.15.3
        shell: bash
        run: |
          set -euo pipefail
          git -C src/link fetch origin 0ec3d2614c2aebd706d23655d993496acd7fc69f
          git -C src/link checkout --detach 0ec3d2614c2aebd706d23655d993496acd7fc69f
          git -C src/link submodule update --init --recursive
          test "$(tr -d '[:space:]' < src/link/VERSION)" = "0.15.3"

      - name: Apply and stage forensic fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/hal_forensic_fix.py
          # GITHUB_TOKEN cannot safely publish commits that add/modify/delete workflow files.
          # Keep workflow/helper plumbing at HEAD; publish only the tested product/source changes.
          git restore --source=HEAD -- .github/workflows/hal-forensic-fix.yml .github/workflows/ci.yml .github/hal_forensic_fix.py
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release 0.7.180: fix family-aware diagnostic decoding"

      - name: Build and test portable core
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build build-macos --parallel
          ctest --test-dir build-macos --output-on-failure

      - name: Build Apple Debug and Release
        shell: bash
        run: |
          set -euo pipefail
          for configuration in Debug Release; do
            xcodebuild -project app/ios/MBLINK.xcodeproj -scheme MBLINK \
              -configuration "$configuration" -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/derived-$configuration" \
              CODE_SIGNING_ALLOWED=NO MARKETING_VERSION=0.7.180 build
          done

      - name: Publish tested release commit to main
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main

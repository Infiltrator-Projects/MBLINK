# SPDX-License-Identifier: GPL-3.0-or-later
name: Prepare MBLINK 0.7.167 picker release

on:
  push:
    branches: [release-prep-0.7.167-picker]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'Prepare MBLINK 0.7.167 picker release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build exact release tree
        shell: bash
        run: |
          set -euo pipefail
          old='0.7.166'
          new='0.7.167'
          old_link='163997cb8edab1a81e6273b7c8022e0e305139d0'
          new_link='a2e0fbea8378ac96b67f1868b875d1a3718f91f4'

          test "$(tr -d '[:space:]' < VERSION)" = "$old"
          printf '%s\n' "$new" > VERSION
          sed -i "s/#define MBLINK_VERSION_STRING \"$old\"/#define MBLINK_VERSION_STRING \"$new\"/" include/mblink/version.h
          sed -i "s/MARKETING_VERSION = $old;/MARKETING_VERSION = $new;/g" app/ios/MBLINK.xcodeproj/project.pbxproj
          sed -i "s/$old_link/$new_link/g" app/ios/MBLINK.xcodeproj/project.pbxproj
          git update-index --cacheinfo 160000,$new_link,src/link

          test "$(grep -E '^[[:space:]]*MARKETING_VERSION = ' app/ios/MBLINK.xcodeproj/project.pbxproj | sed -E 's/.*= ([^;]+);/\1/' | sort -u)" = "$new"
          grep -Fq "#define MBLINK_VERSION_STRING \"$new\"" include/mblink/version.h
          test "$(grep -Fc "MARKETING_VERSION = $new;" app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 4
          test "$(grep -Fc "$new_link" app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 2
          test "$(git ls-files -s src/link | awk '{print $2}')" = "$new_link"

          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git rm .github/workflows/prepare-0.7.167-picker.yml
          git add VERSION include/mblink/version.h app/ios/MBLINK.xcodeproj/project.pbxproj
          git commit -m 'prep: MBLINK 0.7.167 picker release tree'
          git push origin HEAD:release-prep-0.7.167-picker

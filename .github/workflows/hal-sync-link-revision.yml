name: HAL sync LINK revision

on:
  push:
    paths:
      - '.github/workflows/hal-sync-link-revision.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronise LINK provenance and retrigger 0.7.179
        shell: bash
        run: |
          set -euo pipefail
          expected='e66c2d744b636996764a77b854681d764e8f25c3'
          actual="$(git ls-tree HEAD src/link | awk '{print $3}')"
          test "$actual" = "$expected"
          python3 - <<'PY'
          from pathlib import Path

          old = 'e4bd1503afd14618b8a47196ae0dd25b46675ebb'
          new = 'e66c2d744b636996764a77b854681d764e8f25c3'
          project = Path('app/ios/MBLINK.xcodeproj/project.pbxproj')
          text = project.read_text()
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected two old LINK revision entries, found {count}')
          project.write_text(text.replace(old, new))
          Path('VERSION').write_text('0.7.179\n\n')
          Path('.github/workflows/hal-sync-link-revision.yml').unlink()
          PY
          git diff --check
          test "$(tr -d '[:space:]' < VERSION)" = '0.7.179'
          test "$(grep -Fc 'e66c2d744b636996764a77b854681d764e8f25c3' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 2
          ! grep -Fq 'e4bd1503afd14618b8a47196ae0dd25b46675ebb' app/ios/MBLINK.xcodeproj/project.pbxproj
          git config user.name 'HAL migration bot'
          git config user.email 'actions@users.noreply.github.com'
          git add VERSION app/ios/MBLINK.xcodeproj/project.pbxproj .github/workflows/hal-sync-link-revision.yml
          git commit -m 'Release 0.7.179: sync LINK revision'
          git push origin HEAD:main

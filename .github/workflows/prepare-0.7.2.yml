# SPDX-License-Identifier: GPL-3.0-or-later
name: Prepare MBLINK 0.7.2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-0.7.2.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify validated 0.7.1 development baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.7.1"
          test "$(git -C src/infiltratr-common rev-parse HEAD)" = "a5b52f7ad62fcbb3462c496b7831e7f974161bcf"
          test "$(grep -c 'MARKETING_VERSION = 0.7.1;' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 4
          test ! -e .github/workflows/migrate-parameter-store.yml
          grep -q 'mblink_parameter_store_record' src/core/parameter.c
          grep -q 'mblink_scheduler_add_parameter' src/core/scheduler.c
          grep -q 'mblink-test-parameter-store' CMakeLists.txt
          grep -q 'mblink-test-scheduler-parameters' CMakeLists.txt
          ! grep -Eq 'hasRPM|hasEngineLoad|applyMeasurement|resetPublishedMeasurements' \
            platform/apple/MBLinkDiagnosticsController.h \
            platform/apple/MBLinkDiagnosticsController.m

      - name: Run complete portable C suite
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Set 0.7.2 version and release documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          pbx_path = Path('app/ios/MBLINK.xcodeproj/project.pbxproj')
          pbx = pbx_path.read_text(encoding='utf-8')
          if pbx.count('MARKETING_VERSION = 0.7.1;') != 4:
              raise SystemExit('expected exactly four Xcode 0.7.1 version entries')
          pbx_path.write_text(
              pbx.replace('MARKETING_VERSION = 0.7.1;',
                          'MARKETING_VERSION = 0.7.2;'), encoding='utf-8')
          Path('VERSION').write_text('0.7.2\n', encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old = ('**Pre-alpha. Latest completed maintenance milestone: 0.7.1 — pre-Mercedes '
                 'parameter and release hardening. Next feature milestone: 0.8 — Mercedes-Benz '
                 'C207 / OM651 engine diagnostics.**')
          new = ('**Pre-alpha. Latest completed maintenance milestone: 0.7.2 — shared live-data '
                 'model hardening. Next feature milestone: 0.8 — Mercedes-Benz C207 / OM651 '
                 'engine diagnostics.**')
          if readme.count(old) != 1:
              raise SystemExit('README status marker mismatch')
          readme = readme.replace(old, new, 1)
          needle = ('- protocol-neutral C diagnostic parameter descriptors with Infiltratr Common-backed scalar formatting for OBD-II and future manufacturer UDS live values;\n')
          addition = (needle +
              '- bounded protocol-neutral parameter state/history keyed by protocol, module and identifier;\n'
              '- 64-item live-data scheduler with full parameter keys plus compatibility wrappers for the current OBD-II session loop;\n')
          if readme.count(needle) != 1:
              raise SystemExit('README parameter capability marker mismatch')
          readme = readme.replace(needle, addition, 1)
          readme = readme.replace(
              '- SwiftUI diagnostic workspace with live data, table, dashboard, graphs and CSV export;\n',
              '- SwiftUI diagnostic workspace whose live data, table, dashboard and graphs consume the shared C parameter catalog, plus CSV export;\n',
              1)
          readme_path.write_text(readme, encoding='utf-8')

          roadmap_path = Path('docs/ROADMAP.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          top_old = ('**Completed through 0.7.1. Next feature milestone: 0.8 — '
                     'Mercedes-Benz C207 / OM651 engine diagnostics.**')
          top_new = ('**Completed through 0.7.2. Next feature milestone: 0.8 — '
                     'Mercedes-Benz C207 / OM651 engine diagnostics.**')
          if roadmap.count(top_old) != 1:
              raise SystemExit('ROADMAP status marker mismatch')
          roadmap = roadmap.replace(top_old, top_new, 1)
          row = '| 0.7 | Portable UDS response/session/timing engine, TesterPresent and caller-supplied DID definitions |\n'
          rows = (row +
              '| 0.7.1 | Common 1.7.0 adoption, iPhone Mercedes-source wiring and permanent IPA release assets |\n'
              '| 0.7.2 | Shared C live-data catalog, full-key parameter store and UDS-capable 64-item scheduler |\n')
          if roadmap.count(row) != 1:
              raise SystemExit('ROADMAP foundation row marker mismatch')
          roadmap = roadmap.replace(row, rows, 1)
          marker = '**Exit condition:** all portable, sanitizer, Linux, iOS Debug/Release and unsigned-device build gates pass on one exact 0.7.1 commit, and that exact release publishes its IPA as a Release asset.\n\n'
          section = marker + '''## 0.7.2 — shared live-data model hardening (complete)\n\n- drive iPhone Live Data, Table, Dashboard and Graphs from C-owned parameter names, units, stable keys and Common-backed formatting instead of a second Swift parameter table;\n- add a bounded 256-definition / 1024-sample protocol-neutral parameter store with full `{protocol,module,identifier}` keys, favourites, latest values and chronological history;\n- expand the scheduler to 64 items and give each item the same full parameter key, allowing future UDS DIDs from different modules without colliding;\n- retain explicit OBD-II scheduler wrappers and the proven OBD telemetry/CSV path while the generic store is integrated incrementally;\n- remove obsolete per-PID measurement publication properties from the Objective-C bridge.\n\nNo Mercedes manufacturer DID or ECU address is promoted by this release. Those remain 0.8 vehicle-validation work.\n\n**Exit condition:** C regression coverage includes the generic parameter catalog, store and keyed scheduler, and the generic iPhone presentation builds without the removed per-PID publication surface.\n\n'''
          if roadmap.count(marker) != 1:
              raise SystemExit('ROADMAP 0.7.1 exit marker mismatch')
          roadmap_path.write_text(roadmap.replace(marker, section, 1), encoding='utf-8')
          PY

          rm .github/workflows/prepare-0.7.2.yml
          test "$(cat VERSION)" = "0.7.2"
          test "$(grep -c 'MARKETING_VERSION = 0.7.2;' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 4

      - name: Commit prepared 0.7.2 identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add -A
          git diff --cached --check
          git commit -m "MBLINK 0.7.2: shared live-data model hardening"
          git push origin HEAD:main

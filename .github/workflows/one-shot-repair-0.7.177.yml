# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot repair MBLINK 0.7.177

on:
  push:
    paths:
      - .github/workflows/one-shot-repair-0.7.177.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Repair Linux CSS and iOS version metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          style = Path('app/linux/style.c')
          text = style.read_text()
          moved = '''    ".link-nav-icon { opacity: 0.92; margin-right: 2px; }"\n    ".link-nav-row:selected { background: rgba(0,173,239,0.075); border-color: rgba(0,173,239,0.48); }"\n    ".link-nav-row:selected .link-nav-icon { opacity: 1; }"\n    ".link-nav-row:selected .link-section-title { color: #00adef; }"\n    ".link-nav-row:selected .link-section-summary { color: #79cae8; }"\n    ".link-nav-row:nth-child(6) { margin-top: 18px; }"\n    ".link-status-online { background: rgba(0,173,239,0.10); border-color: rgba(0,173,239,0.46); color: #00adef; }"\n    ".link-status-offline { background: rgba(209,158,71,0.045); border-color: rgba(209,158,71,0.22); color: #c69a4c; }"\n    ".link-toolbar-button:hover, .link-save-session-button:hover, .link-about-button:hover { border-color: rgba(0,173,239,0.36); }"\n    "checkbutton:checked { color: #00adef; }"\n    ".state-warning { color: #d19e47; border-color: #72572f; }"\n    ".state-success { color: #63ab7c; border-color: #365f45; }"\n'''
          if moved not in text:
              raise SystemExit('expected Mercedes polish CSS block not found')
          text = text.replace(moved, '', 1)
          marker = 'static const char mblink_metrics_css[] =\n'
          if marker not in text:
              raise SystemExit('metrics CSS marker not found')
          text = text.replace(marker, marker + moved, 1)
          style.write_text(text)

          project = Path('app/ios/MBLINK.xcodeproj/project.pbxproj')
          pbx = project.read_text()
          old = 'MARKETING_VERSION = 0.7.176;'
          count = pbx.count(old)
          if count < 1:
              raise SystemExit('expected 0.7.176 MARKETING_VERSION entries not found')
          pbx = pbx.replace(old, 'MARKETING_VERSION = 0.7.177;')
          project.write_text(pbx)

          if Path('VERSION').read_text().strip() != '0.7.177':
              raise SystemExit('VERSION is not 0.7.177')
          if 'MBLINK_VERSION_STRING "0.7.177"' not in Path('include/mblink/version.h').read_text():
              raise SystemExit('version header is not 0.7.177')
          print(f'updated {count} Xcode MARKETING_VERSION entries')
          PY

          rm -f .github/workflows/one-shot-repair-0.7.177.yml
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add app/linux/style.c app/ios/MBLINK.xcodeproj/project.pbxproj .github/workflows/one-shot-repair-0.7.177.yml
          git commit -m 'Release 0.7.177: fix Linux CSS and iOS version metadata'
          git push origin HEAD:main

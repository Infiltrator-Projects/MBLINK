name: HAL stage Common 1.16.0 migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.event.head_commit.message == 'Retry MBLINK Common 1.16.0 migration staging'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Stage deterministic migration blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/hal
          cp .github/workflows/ci.yml .github/hal/ci-common-1-16.yml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/hal/ci-common-1-16.yml')
          text = p.read_text()
          old = 'src/link/platform/apple/LinkDiagnosticsController.m'
          new = 'src/link/platform/apple/LinkAppleTelemetryRecorder.inc'
          needles = [
              'link_telemetry_recorder_continue',
              'LinkResponderTelemetryStore',
              'record_responder_sample_named',
              'link_structured_telemetry_store_record',
              'link_telemetry_recorder_record_structured_pid_named',
              'NATIVE_RX',
          ]
          lines = text.splitlines(keepends=True)
          changed = 0
          for i, line in enumerate(lines):
              if any(needle in line for needle in needles) and old in line:
                  lines[i] = line.replace(old, new)
                  changed += 1
          if changed != 6:
              raise SystemExit(f'expected exactly 6 telemetry ownership guard replacements, got {changed}')
          p.write_text(''.join(lines))

          project = Path('app/ios/MBLINK.xcodeproj/project.pbxproj')
          staged = Path('.github/hal/project-common-1-16.pbxproj')
          project_text = project.read_text()
          old_sha = 'c25568552d75cb6833812cab354ff849ed3cc817'
          new_sha = '5e15038035b370d40aba6db792bda192926fb4a0'
          count = project_text.count(old_sha)
          if count == 0:
              raise SystemExit('old LINK source revision was not found in the Xcode project')
          staged_text = project_text.replace(old_sha, new_sha)
          if old_sha in staged_text or staged_text.count(new_sha) < count:
              raise SystemExit('LINK source revision staging failed')
          if 'MARKETING_VERSION = 0.7.194;' not in staged_text:
              raise SystemExit('unexpected MBLINK marketing version while staging migration')
          staged.write_text(staged_text)
          PY
          for needle in \
            link_telemetry_recorder_continue \
            LinkResponderTelemetryStore \
            record_responder_sample_named \
            link_structured_telemetry_store_record \
            link_telemetry_recorder_record_structured_pid_named \
            NATIVE_RX; do
            grep -F "$needle" .github/hal/ci-common-1-16.yml | grep -Fq 'src/link/platform/apple/LinkAppleTelemetryRecorder.inc'
          done
          grep -Fq '5e15038035b370d40aba6db792bda192926fb4a0' .github/hal/project-common-1-16.pbxproj
          ! grep -Fq 'c25568552d75cb6833812cab354ff849ed3cc817' .github/hal/project-common-1-16.pbxproj
          test "$(git status --short --untracked-files=all | awk '{print $2}' | sort)" = $'.github/hal/ci-common-1-16.yml\n.github/hal/project-common-1-16.pbxproj'
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add .github/hal/ci-common-1-16.yml .github/hal/project-common-1-16.pbxproj
          git commit -m 'Stage MBLINK Common 1.16.0 migration blobs'
          git push origin HEAD:main

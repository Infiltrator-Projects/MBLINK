# SPDX-License-Identifier: GPL-3.0-or-later
name: HAL one-shot forensic maintenance

on:
  push:
    branches: [hal/forensic-ui-0.7.287]

permissions:
  contents: write

jobs:
  patch-and-linux:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout recursively
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Apply forensic maintenance patch
        run: python3 scripts/hal-maintenance-patch.py
      - name: Validate repository invariants
        run: |
          python3 scripts/preflight.py
          python3 tests/test_pid_architecture.py
          test "$(cat VERSION)" = "0.7.287"
          test "$(cat src/link/VERSION)" = "0.15.91"
          test "$(cat src/link/src/infiltratr-common/VERSION)" = "1.19.38"
          ! grep -Fq 'font-size: 13px; }' app/linux/style.c
          ! grep -Fq 'font-size: 14px; }' app/linux/style.c
      - name: Build and test portable core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Build GTK face
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libbluetooth-dev libusb-1.0-0-dev pkg-config
          cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -DMBLINK_BUILD_LINUX_APP=ON -DMBLINK_BUILD_PROFILE=generic -DBUILD_TESTING=OFF
          cmake --build build-linux --parallel 2
      - name: Commit validated product tree
        run: |
          git config user.name "HAL maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Release 0.7.287: coalesce UI refresh and align InfiltratorOS styling"
          git push origin HEAD:${GITHUB_REF_NAME}

  validate-apple:
    needs: patch-and-linux
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validated branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hal/forensic-ui-0.7.287
          fetch-depth: 0
          submodules: recursive
      - name: Verify branch tip and dependency chain
        run: |
          test "$(cat VERSION)" = "0.7.287"
          test "$(cat src/link/VERSION)" = "0.15.91"
          test "$(cat src/link/src/infiltratr-common/VERSION)" = "1.19.38"
      - name: Build portable core on macOS
        run: |
          cmake -S . -B build-macos -DCMAKE_BUILD_TYPE=Release
          cmake --build build-macos --parallel 2
          ctest --test-dir build-macos --output-on-failure
      - name: Build iOS simulator Debug
        run: |
          xcodebuild -project app/ios/MBLINK.xcodeproj -scheme MBLINK \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived-simulator-Debug" \
            CODE_SIGNING_ALLOWED=NO MARKETING_VERSION=0.7.287 \
            MBLINK_SOURCE_REVISION="$(git rev-parse HEAD)" build

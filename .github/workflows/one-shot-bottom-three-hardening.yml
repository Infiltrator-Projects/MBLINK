# SPDX-License-Identifier: GPL-3.0-or-later
name: One-shot MBLINK bottom-three forensic hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-bottom-three-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/one-shot-bottom3.py
          test "$(wc -c < app/linux/main.c)" -le 114000
          ! grep -Fq '#include "../link/src/' src/core/mblink.c
          grep -Fq '../../src/link/src/core/transport.c' app/ios/MBLINK.xcodeproj/project.pbxproj
          git diff --check
          git diff --stat

          # The GitHub Actions token has contents:write but not workflows:write.
          # Keep the validated source/CMake/test transformation, but restore
          # workflow/script paths so this push contains no workflow mutation.
          git checkout -- .github/workflows/ci.yml
          git checkout -- .github/workflows/one-shot-bottom-three-hardening.yml
          git checkout -- tools/one-shot-bottom3.py

      - name: Commit source hardening to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MBLINK release automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/linux/main.c app/linux/session_trace.c app/linux/session_trace.h app/linux/style.c app/linux/style.h tests/test_linux_session_trace.c CMakeLists.txt
          git commit -m "Harden Linux trace semantics and source boundaries"
          git push origin HEAD:main

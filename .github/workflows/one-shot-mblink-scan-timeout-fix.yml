name: One-shot MBLINK manufacturer scan timing fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-mblink-scan-timeout-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply evidence-backed manufacturer scan timing fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          header = Path('include/mblink/mercedes_data_scan.h')
          text = header.read_text()
          text = replace_once(
              text,
              '    size_t identifier_index;\n    uint16_t identifiers[MBLINK_MERCEDES_DATA_SCAN_MAX_RECORDS];',
              '    size_t identifier_index;\n'
              '    /* Retry transient ELM NO DATA on already-proven identifiers. */\n'
              '    uint8_t current_no_response_retries;\n'
              '    uint16_t identifiers[MBLINK_MERCEDES_DATA_SCAN_MAX_RECORDS];',
              'scan retry state')
          header.write_text(text)

          source = Path('src/mercedes/data_scan.c')
          text = source.read_text()
          text = replace_once(
              text,
              '        return write_text("ATST20", buffer, buffer_size, written);',
              '        /* 0x64 * 4 ms = 400 ms.  The old ATST20 (128 ms) was\n'
              '         * proven too short by C207 captures: known-positive DIDs\n'
              '         * repeatedly fell through to ELM NO DATA at the timeout. */\n'
              '        return write_text("ATST64", buffer, buffer_size, written);',
              'ELM scan timeout')
          text = replace_once(
              text,
              '    if (scan == NULL) return;\n    scan->attempted_count++;',
              '    if (scan == NULL) return;\n'
              '    scan->current_no_response_retries = 0U;\n'
              '    scan->attempted_count++;',
              'retry reset')
          marker = 'static void accept_uds_identifier(\n'
          helper = '''static bool retry_known_identifier_after_no_response(\n    MblinkMercedesDataScan *scan)\n{\n    if (scan == NULL || !scan->identifier_list_active ||\n        scan->current_no_response_retries >= 2U) {\n        return false;\n    }\n    scan->current_no_response_retries++;\n    return true;\n}\n\n'''
          text = replace_once(text, marker, helper + marker, 'retry helper')
          old = '''    if (response->result != MBLINK_ELM327_RESULT_OK) {\n        scan->no_response_count++;\n        advance_identifier(scan);\n        return;\n    }'''
          new = '''    if (response->result != MBLINK_ELM327_RESULT_OK) {\n        /*\n         * A refresh list contains identifiers already proven positive.\n         * One ELM timeout is therefore not evidence that the DID vanished.\n         * Retry the same identifier twice before recording a miss.\n         */\n        if (retry_known_identifier_after_no_response(scan)) return;\n        scan->no_response_count++;\n        advance_identifier(scan);\n        return;\n    }'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'UDS/KWP no-response handlers: expected two matches, found {count}')
          text = text.replace(old, new)
          source.write_text(text)

          tests = Path('tests/test_mercedes_data_scan.c')
          text = tests.read_text().replace('"ATST20"', '"ATST64"')
          old = '''    CHECK(accept_command(&scan, "3E01", response_ok("7E")) == 0);\n    CHECK(accept_command(\n              &scan, "2158", response_ok("61580090556800")) == 0);'''
          new = '''    CHECK(accept_command(&scan, "3E01", response_ok("7E")) == 0);\n\n    /*\n     * Regression for the C207 shrink-on-every-refresh fault: a known-positive\n     * identifier may hit the adapter timeout transiently.  It must remain the\n     * current identifier and be retried rather than being discarded.\n     */\n    CHECK(accept_command(&scan, "2158", response_no_data()) == 0);\n    CHECK(scan.current_identifier == UINT16_C(0x58));\n    CHECK(scan.no_response_count == 0U);\n    CHECK(scan.current_no_response_retries == 1U);\n    CHECK(accept_command(&scan, "2158", response_no_data()) == 0);\n    CHECK(scan.current_identifier == UINT16_C(0x58));\n    CHECK(scan.no_response_count == 0U);\n    CHECK(scan.current_no_response_retries == 2U);\n    CHECK(accept_command(\n              &scan, "2158", response_ok("61580090556800")) == 0);\n    CHECK(scan.current_no_response_retries == 0U);'''
          if old not in text:
              raise SystemExit('targeted refresh retry regression: anchor missing')
          text = text.replace(old, new, 1)
          tests.write_text(text)
          PY

          rm .github/workflows/one-shot-mblink-scan-timeout-fix.yml
          git diff --check
          git diff -- include/mblink/mercedes_data_scan.h src/mercedes/data_scan.c tests/test_mercedes_data_scan.c

      - name: Commit fix to main
        shell: bash
        run: |
          git config user.name "MBLINK release automation"
          git config user.email "actions@users.noreply.github.com"
          git add include/mblink/mercedes_data_scan.h src/mercedes/data_scan.c tests/test_mercedes_data_scan.c .github/workflows/one-shot-mblink-scan-timeout-fix.yml
          git commit -m "Fix Mercedes manufacturer scan timeout attrition"
          git push origin HEAD:main

name: HAL one-shot MBLINK migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hal-migrate-mblink.yml
      - .github/hal_migrate_mblink.py

permissions:
  contents: write

concurrency:
  group: hal-one-shot-mblink-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out MBLINK recursively
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Retarget migration to corrected LINK and select implementations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/hal_migrate_mblink.py')
          text = path.read_text(encoding='utf-8')
          old_sha = 'e8121c5507a2df4df57bd0bf8bd5f1b236e79023'
          new_sha = 'cb830ec2d04d11f97cf0a2a6dd7a29bae6c7a13b'
          if text.count(old_sha) != 1:
              raise SystemExit('unexpected old LINK pin count in migration helper')
          text = text.replace(old_sha, new_sha, 1)
          old = '''    start = text.find(start_marker)\n    if start < 0:\n        raise SystemExit(f"{path}: start marker not found: {start_marker!r}")\n    if text.find(start_marker, start + 1) >= 0:\n        raise SystemExit(f"{path}: start marker is ambiguous: {start_marker!r}")\n'''
          new = '''    start = text.rfind(start_marker)\n    if start < 0:\n        raise SystemExit(f"{path}: start marker not found: {start_marker!r}")\n'''
          if old not in text:
              raise SystemExit('replace_braced helper shape changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply LINK ownership migration
        run: python3 .github/hal_migrate_mblink.py

      - name: Wire shared session trace into Apple target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/ios/MBLINK.xcodeproj/project.pbxproj')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '\t\tA22100000000000000000016 /* link_units.c in Sources */ = {isa = PBXBuildFile; fileRef = A22000000000000000000016 /* link_units.c */; };\n',
                  '\t\tA22100000000000000000016 /* link_units.c in Sources */ = {isa = PBXBuildFile; fileRef = A22000000000000000000016 /* link_units.c */; };\n'
                  '\t\tA22100000000000000000017 /* link_session_trace.c in Sources */ = {isa = PBXBuildFile; fileRef = A22000000000000000000017 /* link_session_trace.c */; };\n'
              ),
              (
                  '\t\tA22000000000000000000016 /* link_units.c */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.c; name = "link_units.c"; path = "../../src/link/src/core/units.c"; sourceTree = SOURCE_ROOT; };\n',
                  '\t\tA22000000000000000000016 /* link_units.c */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.c; name = "link_units.c"; path = "../../src/link/src/core/units.c"; sourceTree = SOURCE_ROOT; };\n'
                  '\t\tA22000000000000000000017 /* link_session_trace.c */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.c; name = "link_session_trace.c"; path = "../../src/link/src/core/session_trace.c"; sourceTree = SOURCE_ROOT; };\n'
              ),
              (
                  '\t\t\t\tA22000000000000000000016 /* link_units.c */,\n',
                  '\t\t\t\tA22000000000000000000016 /* link_units.c */,\n'
                  '\t\t\t\tA22000000000000000000017 /* link_session_trace.c */,\n'
              ),
              (
                  '\t\t\t\tA22100000000000000000016 /* link_units.c in Sources */,\n',
                  '\t\t\t\tA22100000000000000000016 /* link_units.c in Sources */,\n'
                  '\t\t\t\tA22100000000000000000017 /* link_session_trace.c in Sources */,\n'
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Xcode project anchor count {text.count(old)} for {old.strip()}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate ownership boundaries
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile .github/hal_migrate_mblink.py
          rm -rf .github/__pycache__
          test "$(git -C src/link rev-parse HEAD)" = cb830ec2d04d11f97cf0a2a6dd7a29bae6c7a13b
          grep -Fq 'typedef LinkSessionTrace MblinkLinuxSessionTrace' app/linux/session_trace.h
          grep -Fq 'link_session_trace_record_graph' app/linux/session_trace.c
          grep -Fq 'link_units_convert_obd2_with_preferences' app/linux/main.c
          grep -Fq 'link_discover_standard_uds29_target_at' src/mercedes/discover_plan.c
          grep -Fq 'LinkVehicleProfileCachedPIDs' platform/apple/MBLinkDiagnosticsController.m
          grep -Fq 'mergeStandardCapabilitiesFromDiagnosticFlow' platform/apple/MBLinkDiagnosticsController.m
          grep -Fq 'typealias DiagnosticParameter = LinkDiagnosticParameter' app/ios/MBLINK/ConnectionViewModel.swift
          grep -Fq 'LinkMetricTile(parameter: parameter)' app/ios/MBLINK/MBLINKApp.swift
          grep -Fq '../../src/link/src/core/session_trace.c' app/ios/MBLINK.xcodeproj/project.pbxproj
          test "$(grep -Fc 'link_session_trace.c in Sources' app/ios/MBLINK.xcodeproj/project.pbxproj)" -eq 2
          test ! -e packaging/native-installer.sh
          grep -Fq 'src/link/packaging/native-product-installer.sh.in' scripts/build-native-installer.sh
          ! grep -Fq '0.14503773773020923' app/linux/main.c
          ! grep -Fq '0.621371192237334' app/linux/main.c
          ! grep -Fq '0.2641720523581484' app/linux/main.c
          ! grep -Fq '0.2199692482990878' app/linux/main.c
          ! grep -Fq '0.1322773573109265' app/linux/main.c
          ! grep -Fq '235.214583' app/linux/main.c
          ! grep -Fq '282.480936' app/linux/main.c
          bash -n scripts/build-native-installer.sh

      - name: Create local validation commit
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add -A
          git diff --cached --check
          git commit -m 'Validate LINK consumer migration'

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtk-4-dev libbluetooth-dev libusb-1.0-0-dev

      - name: Build and test MBLINK with Linux face
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build-hal-migration \
            -DCMAKE_BUILD_TYPE=Release \
            -DMBLINK_BUILD_LINUX_APP=ON \
            -DBUILD_TESTING=ON
          cmake --build build-hal-migration --parallel 2
          ctest --test-dir build-hal-migration --output-on-failure --parallel 2

      - name: Exercise shared native installer generator
        shell: bash
        run: |
          set -euxo pipefail
          scripts/build-native-installer.sh /tmp/MBLINK-native-migration.run
          /tmp/MBLINK-native-migration.run --help >/dev/null
          rm -f /tmp/MBLINK-native-migration.run

      - name: Publish tested MBLINK migration without one-shot files
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/hal_migrate_mblink.py .github/workflows/hal-migrate-mblink.yml
          rm -rf .github/__pycache__
          git add -A
          git diff --cached --check
          git commit --amend -m 'Consume shared LINK product behaviour'
          git push origin HEAD:main

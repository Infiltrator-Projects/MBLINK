name: W204 CBF source discovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/w204-cbf-source-discovery.yml'
      - 'tools/mblink-cbf-data-extract.c'

permissions:
  contents: read

jobs:
  extract:
    name: Extract public W204 CBF read facts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install archive and MEGA clients
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends megatools p7zip-full

      - name: Build strict CBF extractor
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Wshadow \
             -Wformat=2 -Wstrict-prototypes -Wmissing-prototypes -Werror \
             tools/mblink-cbf-data-extract.c -o /tmp/mblink-cbf-data-extract

      - name: Download public W204 CBF archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w204-download /tmp/w204-cbf cbf-facts
          link='https://mega.nz/file/7JAQHJxL#vOUIANdlv--LMwfCVfbUeDsGUkF_BemdWDIuyJ3lJ-E'
          megadl --no-progress --path /tmp/w204-download "$link"
          archive="$(find /tmp/w204-download -maxdepth 1 -type f | head -n1)"
          test -n "$archive"
          sha256sum "$archive" | tee cbf-facts/W204-cbf.archive.sha256
          7z l "$archive" | tee cbf-facts/W204-cbf.archive.list.txt
          7z x -y -o/tmp/w204-cbf "$archive" >/dev/null

      - name: Extract exact-controller read facts
        shell: bash
        run: |
          set -euo pipefail
          find_cbf() {
            local wanted="$1"
            find /tmp/w204-cbf -type f -iname "$wanted" -print -quit
          }
          extract_one() {
            local profile="$1"
            local source_name="$2"
            local wanted="$3"
            local file
            file="$(find_cbf "$wanted")"
            if test -z "$file"; then
              echo "::error::Missing $wanted in W204 archive"
              exit 1
            fi
            sha256sum "$file" | tee "cbf-facts/\${source_name}.sha256"
            /tmp/mblink-cbf-data-extract "$file" \
              > "cbf-facts/\${source_name}-direct-uds22.tsv"
            /tmp/mblink-cbf-data-extract --profile \
              "$profile" "$source_name" "$file" \
              > "cbf-facts/\${source_name}-profile.inc"
          }

          extract_one gateway-cgw204 CGW_204.cbf CGW_204.cbf
          extract_one eis-ezs204 EIS_204.cbf EIS_204.cbf
          extract_one cluster-ic204 IC_204.cbf IC_204.cbf
          extract_one steering-sccm204 SCCM_204.cbf SCCM_204.cbf
          extract_one restraints-orc204 ORC_204.cbf ORC_204.cbf
          extract_one headunit-hu204 HU_204.cbf HU_204.cbf
          extract_one fuel-pump-fscu FSCM212.cbf FSCM212.cbf

          {
            for tsv in cbf-facts/*-direct-uds22.tsv; do
              printf '%s\t' "$(basename "$tsv" -direct-uds22.tsv)"
              awk 'NR>1 {n++} END {print n+0}' "$tsv"
            done
          } | sort | tee cbf-facts/direct-uds22-counts.tsv

      - name: Upload extracted source facts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w204-cbf-source-facts
          path: cbf-facts/
          if-no-files-found: error
          retention-days: 7

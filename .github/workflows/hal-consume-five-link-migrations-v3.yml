name: HAL consume five LINK migrations v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hal-consume-five-link-migrations-v3.yml

permissions:
  contents: write

jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply robust migration script
        shell: bash
        run: |
          set -euo pipefail
          LINK_SHA=b070ce488d99d3e7fb3faaadc4b1ecce66edf063
          git -C src/link fetch origin "$LINK_SHA"
          git -C src/link checkout "$LINK_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap
          source = Path('.github/workflows/hal-consume-five-link-migrations-v2.yml').read_text()
          body = source.split("python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          body = textwrap.dedent(body)
          body = re.sub(
              r'''(?m)^\s*'profile\["liveResponders"\]'\s*,?\s*$''',
              '', body)
          obsolete = '\nppath = Path("app/ios/MBLINK.xcodeproj/project.pbxproj")'
          if obsolete not in body:
              raise SystemExit('obsolete Xcode metadata block marker missing')
          body = body.split(obsolete, 1)[0] + '\n'
          exec(body, {'__name__': '__main__'})

          cpath = Path('app/ios/MBLINK/ConnectionViewModel.swift')
          s = cpath.read_text()
          start = s.index('        var responderPIDs = [String: Set<UInt8>]()')
          end = s.index('        var modules = [DiagnosticModule]()', start)
          replacement = '''        var responderPIDs = [String: Set<UInt8>]()
          for responder in LinkVehicleProfileStandardResponders(profile as NSDictionary) {
              let rx = responder.responderCANIdentifier
              let extended = responder.isExtendedID
              let key = String(format: "%@:%08X", extended ? "29" : "11", rx)
              let pids = responder.pids.compactMap { UInt8(exactly: $0.uintValue) }
              responderPIDs[key, default: []].formUnion(pids)
          }

          '''
          s = s[:start] + replacement + s[end:]
          cpath.write_text(s)
          PY
          git diff --check
          if grep -n 'liveResponders' app/ios/MBLINK/ConnectionViewModel.swift; then
            echo 'MBLINK still knows LINK liveResponders schema' >&2
            exit 1
          fi
          grep -n 'LinkPIDSelectionStore\|LinkInterfaceLanguage\|LinkVehicleProfileStandardResponders\|SavedVehicleProfileSummary(' \
            app/ios/MBLINK/ConnectionViewModel.swift

      - name: Record source and submodule pin
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add src/link \
                  app/ios/MBLINK/ConnectionViewModel.swift \
                  app/ios/MBLINK/MBLINKApp.swift
          git diff --cached --check
          git commit -m "Consume five small LINK migrations"
          test "$(git ls-tree HEAD src/link | awk '{print $3}')" = "b070ce488d99d3e7fb3faaadc4b1ecce66edf063"

      - name: Validate MBLINK shared core
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DBUILD_TESTING=ON
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          rm -rf build

      - name: Publish MBLINK migration
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main

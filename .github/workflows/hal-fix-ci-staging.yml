# SPDX-License-Identifier: GPL-3.0-or-later
name: HAL fix CI staging

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hal-fix-ci-staging.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Correct staged workflow indentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/ci.proposed.yml')
          text = p.read_text()
          start = '    launch_output="$(SIMCTL_CHILD_MBLINK_CI_SIMULATED_FLOW=1 xcrun simctl launch "$udid" com.github.The-First-Infiltrator.MBLINK)"'
          end = '    xcrun simctl terminate "$udid" com.github.The-First-Infiltrator.MBLINK'
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('staged simulator block anchors are not unique')
          a = text.index(start)
          b = text.index(end, a) + len(end)
          block = text[a:b]
          fixed = '\n'.join('      ' + line for line in block.split('\n'))
          text = text[:a] + fixed + text[b:]
          text = text.replace('($attempt/72)...', '($attempt/6)...', 1)
          p.write_text(text)
          PY
          git diff --check
          grep -Fq '          launch_output="$(SIMCTL_CHILD_MBLINK_CI_SIMULATED_FLOW=1' .github/ci.proposed.yml
          grep -Fq '          marker="$data_container/Documents/mblink-ci-simulated-flow.ok"' .github/ci.proposed.yml
          grep -Fq '($attempt/6)...' .github/ci.proposed.yml
      - name: Publish corrected staging file
        shell: bash
        run: |
          set -euo pipefail
          git add .github/ci.proposed.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Correct staged MBLINK CI hardening"
          git push origin HEAD:main

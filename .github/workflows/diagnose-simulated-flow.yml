name: Diagnose simulated diagnostic flow

on:
  push:
    paths:
      - .github/workflows/diagnose-simulated-flow.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-26-arm64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Instrument diagnostic state in workspace only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/ios/MBLINK/ConnectionViewModel.swift')
          s = p.read_text()
          needle = '    private func refresh() {\n'
          insert = '''    private func refresh() {\n#if DEBUG\n        defer {\n            if ProcessInfo.processInfo.environment["MBLINK_CI_SIMULATED_FLOW"] == "1",\n               let directory = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first {\n                let marker = "ready=\\(controller.isReady)\\nvin=\\(controller.mercedesVINText ?? \"\")\\nstatus=\\(controller.statusText)\\nprobe=\\(mercedesProbeStatusText)\\n"\n                try? marker.write(to: directory.appendingPathComponent("mblink-ci-diagnostic-state.txt"), atomically: true, encoding: .utf8)\n            }\n        }\n#endif\n'''
          if needle not in s:
              raise SystemExit('refresh() insertion point not found')
          p.write_text(s.replace(needle, insert, 1))
          PY
      - name: Build simulator Debug
        shell: bash
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/derived-simulator-Debug"
          xcodebuild -project app/ios/MBLINK.xcodeproj -scheme MBLINK \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Launch and report diagnostic state
        shell: bash
        run: |
          set -u
          derived="$RUNNER_TEMP/derived-simulator-Debug"
          udid="$(xcrun simctl list devices available | sed -nE 's/.*iPhone[^()]*\(([0-9A-Fa-f-]{36})\).*/\1/p' | head -n1)"
          test -n "$udid" || exit 2
          xcrun simctl boot "$udid" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$udid" -b
          app="$derived/Build/Products/Debug-iphonesimulator/MBLINK.app"
          xcrun simctl install "$udid" "$app"
          SIMCTL_CHILD_MBLINK_CI_SIMULATED_FLOW=1 xcrun simctl launch "$udid" com.github.The-First-Infiltrator.MBLINK || true
          data_container="$(xcrun simctl get_app_container "$udid" com.github.The-First-Infiltrator.MBLINK data)"
          state="$data_container/Documents/mblink-ci-diagnostic-state.txt"
          success="$data_container/Documents/mblink-ci-simulated-flow.ok"
          for attempt in $(seq 1 60); do
            if (( attempt == 1 || attempt % 5 == 0 )); then
              echo "--- state $attempt ---"
              test -f "$state" && cat "$state" || echo 'state marker absent'
              test -f "$success" && { echo '--- success marker ---'; cat "$success"; }
            fi
            if test -f "$success" && grep -Fq 'ready=true' "$success"; then
              exit 0
            fi
            sleep 1
          done
          echo '--- final state ---'
          test -f "$state" && cat "$state" || true
          echo '--- recent app log ---'
          xcrun simctl spawn "$udid" log show --last 5m --style compact --predicate 'process == "MBLINK"' | tail -n 300 || true
          exit 1

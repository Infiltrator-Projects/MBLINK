name: HAL pin LINK 0.15.13

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pin:
    if: github.event.head_commit.message == 'Pin released LINK 0.15.13 into MBLINK'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Pin LINK and bump MBLINK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7a2eaa1961c979ce66d0475046f2554d56bf7b89"

          git -C src/link fetch origin e61aae48f784363932b5c8fe47c3d4b13974466f
          git -C src/link checkout e61aae48f784363932b5c8fe47c3d4b13974466f
          test "$(git -C src/link rev-parse HEAD)" = "e61aae48f784363932b5c8fe47c3d4b13974466f"
          test "$(tr -d '[:space:]' < src/link/VERSION)" = "0.15.13"

          python3 - <<'PY'
          from pathlib import Path

          version = Path('VERSION')
          if version.read_text().strip() != '0.7.189':
              raise SystemExit('unexpected MBLINK VERSION')
          version.write_text('0.7.190\n')

          header = Path('include/mblink/version.h')
          h = header.read_text()
          old_h = '#define MBLINK_VERSION_STRING "0.7.189"'
          if h.count(old_h) != 1:
              raise SystemExit(f'version header guard failed: {h.count(old_h)} matches')
          header.write_text(h.replace(old_h, '#define MBLINK_VERSION_STRING "0.7.190"'))

          project = Path('app/ios/MBLINK.xcodeproj/project.pbxproj')
          p = project.read_text()
          old_link = '3a60c45415273c8e91c7a5a887bb04ad787c80f6'
          new_link = 'e61aae48f784363932b5c8fe47c3d4b13974466f'
          if p.count(old_link) != 2:
              raise SystemExit(f'LINK source revision guard failed: {p.count(old_link)} matches')
          p = p.replace(old_link, new_link)
          old_marketing = 'MARKETING_VERSION = 0.7.189;'
          if p.count(old_marketing) != 4:
              raise SystemExit(f'marketing version guard failed: {p.count(old_marketing)} matches')
          p = p.replace(old_marketing, 'MARKETING_VERSION = 0.7.190;')
          project.write_text(p)
          PY

          rm .github/workflows/hal-pin-link-01513.yml
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add -A
          git diff --cached --check
          git diff --cached --submodule=short
          git commit -m "Pin LINK 0.15.13 picker presentation fix" -m "Advance MBLINK to 0.7.190 on released LINK 0.15.13. Keep Connect on the adapter picker when UIKit presentation is briefly unavailable, retain explicit BLE UUID selection, and align Apple/source version metadata."
          git push origin HEAD:main

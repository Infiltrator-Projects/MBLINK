# SPDX-License-Identifier: GPL-3.0-or-later
name: MBLINK Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Publish version release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release target
        id: release
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a plain X.Y.Z version; got: $version" >&2
            exit 1
          fi

          target=""
          if ! git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- VERSION; then
            target="$CURRENT_SHA"
          elif [[ "$COMMIT_MESSAGE" == *"[bootstrap-release]"* ]]; then
            target="$BEFORE_SHA"
          fi

          if [[ -z "$target" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        if: steps.release.outputs.publish == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TARGET: ${{ steps.release.outputs.target }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = process.env.RELEASE_VERSION;
            const tag = process.env.RELEASE_TAG;
            const target = process.env.RELEASE_TARGET;

            try {
              const existingRelease = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`${tag} already has release ${existingRelease.data.html_url}; nothing to do.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            let tagExists = false;
            try {
              const existingRef = await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`
              });
              tagExists = true;
              if (existingRef.data.object.sha !== target) {
                core.setFailed(`${tag} already exists at ${existingRef.data.object.sha}, expected ${target}.`);
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (!tagExists) {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: target
              });
            }

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: target,
              name: `MBLINK ${version}`,
              generate_release_notes: true,
              draft: false,
              prerelease: false
            });

            core.info(`Published ${release.data.html_url}`);

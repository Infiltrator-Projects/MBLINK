name: Temporary 0.7.187 CI Guard Blob

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Create corrected CI blob
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          old = "          grep -Fq 'LinkStandardObdView(snapshot: obdSnapshot)' app/ios/MBLINK/MBLINKApp.swift\n"
          new = (
              "          grep -Fq 'MBStandardOBDView()' app/ios/MBLINK/MBLINKApp.swift\n"
              "          grep -Fq 'private struct MBStandardOBDView: View' app/ios/MBLINK/MBLINKApp.swift\n"
              "          ! grep -Fq 'LinkStandardObdView(snapshot: obdSnapshot)' app/ios/MBLINK/MBLINKApp.swift\n"
          )
          if s.count(old) != 1:
              raise SystemExit(f'stale OBD guard count={s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          payload="$(jq -Rs '{content: ., encoding: "utf-8"}' .github/workflows/ci.yml)"
          response="$(curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Infiltrator-Projects/MBLINK/git/blobs \
            -d "$payload")"
          echo "$response"
          sha="$(jq -r '.sha' <<<"$response")"
          test -n "$sha" && test "$sha" != null
          echo "CI_BLOB_SHA=$sha"

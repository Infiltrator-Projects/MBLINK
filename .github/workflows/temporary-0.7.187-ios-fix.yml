name: Temporary 0.7.187 iOS Source Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair MBLINK-owned OBD screen
        shell: bash
        env:
          NAV_B64: 
          VIEW_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          p = Path('app/ios/MBLINK/MBLINKApp.swift')
          s = p.read_text()
          if 'private struct MBStandardOBDView: View {' in s:
              print('OBD repair already present')
              raise SystemExit(0)

          start = s.find('    private var primaryGrid: some View {')
          end = s.find('    private var connectionProgress: some View {', start)
          marker = 'private struct MBPIDSetupView: View {'
          at = s.find(marker)
          if start < 0 or end < 0 or at < 0:
              raise SystemExit('required source markers not found')

          nav = base64.b64decode(os.environ['NAV_B64']).decode()
          view = base64.b64decode(os.environ['VIEW_B64']).decode()
          s = s[:start] + nav + s[end:]
          at = s.find(marker)
          s = s[:at] + view + s[at:]

          if 'LinkStandardObdView(snapshot: obdSnapshot)' in s:
              raise SystemExit('shared OBD destination still present')
          if 'private var obdSnapshot: LinkStandardObdSnapshot' in s:
              raise SystemExit('obsolete snapshot still present')
          p.write_text(s)
          PY
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ios/MBLINK/MBLINKApp.swift
          git commit -m "Fix 0.7.187 iOS OBD presentation [obd-main-fixed]"
          git push origin HEAD:main
